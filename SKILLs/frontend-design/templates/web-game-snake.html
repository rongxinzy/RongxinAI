<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="doc-title"></title>
<meta id="doc-desc" name="description" content="">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #0e1113;
    --surface: #161a1c;
    --board: #111517;
    --grid: #1b2124;
    --line: #232a2d;
    --line-strong: #333d41;
    --ink: #e6ecec;
    --muted: #8b9698;
    --faint: #616d70;
    --accent: #5fd0a8;
    --accent-hi: #8df0c6;
    --on-accent: #0a1512;
    --food: #e8875f;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, Menlo, monospace;
    color-scheme: dark;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 22px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, p { margin: 0; }
  button { font: inherit; color: inherit; }

  .shell { width: 100%; max-width: 924px; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ── 抬头 ─────────────────────────────────────────────── */
  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line-strong);
  }

  h1 { font-size: 21px; font-weight: 600; letter-spacing: 0.16em; }

  .sub {
    margin-top: 9px;
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
  }

  .stats { display: flex; gap: 28px; text-align: right; }

  .stat-key { font-family: var(--mono); font-size: 11px; line-height: 1.5; color: var(--faint); }

  .stat-val {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 21px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .stat-val.is-best { color: var(--accent); }

  /* ── 主体 ─────────────────────────────────────────────── */
  .stage {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 268px;
    gap: 28px;
    align-items: start;
    margin-top: 26px;
  }

  .board {
    position: relative;
    min-width: 0;
    max-width: 100%;
    background: var(--board);
    border: 1px solid var(--line);
  }

  canvas { display: block; width: 100%; height: auto; }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    place-content: center;
    padding: 26px;
    text-align: center;
    background: rgba(10, 16, 17, 0.8);
  }

  .overlay.on { display: grid; }

  .overlay h2 { font-size: 19px; font-weight: 600; letter-spacing: 0.05em; }

  .overlay p {
    max-width: 32ch;
    margin: 11px auto 0;
    font-size: 13.5px;
    line-height: 1.75;
    color: var(--muted);
  }

  .overlay-score {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }

  /* ── 控制区 ───────────────────────────────────────────── */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line-strong); }

  .seg button {
    appearance: none;
    border: 0;
    border-left: 1px solid var(--line-strong);
    background: transparent;
    padding: 12px 4px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    transition: background-color 150ms ease, color 150ms ease;
  }

  .seg button:first-child { border-left: 0; }

  .seg button:hover { color: var(--ink); }

  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  .btn {
    display: block;
    width: 100%;
    margin-top: 12px;
    appearance: none;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    padding: 14px 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: background-color 150ms ease, color 150ms ease;
  }

  .btn:hover { background: transparent; color: var(--accent); }

  .btn.is-ghost { background: transparent; color: var(--accent); }

  .btn.is-ghost:hover { background: var(--accent); color: var(--on-accent); }

  .pad {
    display: grid;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(2, 44px);
    gap: 6px;
    justify-content: center;
    margin-top: 18px;
  }

  .pad button {
    appearance: none;
    border: 1px solid var(--line-strong);
    background: transparent;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: border-color 150ms ease, color 150ms ease;
  }

  .pad button:hover { border-color: var(--accent); color: var(--accent); }

  .pad button:nth-child(1) { grid-area: 1 / 2; }
  .pad button:nth-child(2) { grid-area: 2 / 1; }
  .pad button:nth-child(3) { grid-area: 2 / 2; }
  .pad button:nth-child(4) { grid-area: 2 / 3; }

  .hint {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12.5px;
    line-height: 1.9;
    color: var(--muted);
  }

  kbd {
    font-family: var(--mono);
    font-size: 11.5px;
    padding: 2px 6px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    color: var(--ink);
  }

  /* ── 战绩 ─────────────────────────────────────────────── */
  .runs {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
  }

  .runs-label { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; color: var(--faint); }

  .runs-list { display: flex; gap: 8px; flex-wrap: wrap; }

  .run {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    padding: 6px 11px;
    border: 1px solid var(--line);
    color: var(--muted);
  }

  .run.is-best { border-color: var(--accent); color: var(--accent); }

  .runs-empty { font-size: 12.5px; line-height: 1.6; color: var(--faint); }

  @media (max-width: 900px) {
    body { align-items: flex-start; padding: 28px 18px 40px; }
    .stage { grid-template-columns: minmax(0, 1fr); gap: 22px; }
    .head { flex-wrap: wrap; }
    .stats { gap: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <div>
      <h1 id="game-title"></h1>
      <p class="sub" id="game-sub"></p>
    </div>
    <div class="stats">
      <div>
        <div class="stat-key" id="score-key"></div>
        <div class="stat-val" id="score-val">0</div>
      </div>
      <div>
        <div class="stat-key" id="best-key"></div>
        <div class="stat-val is-best" id="best-val">0</div>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="board" id="board">
      <canvas id="canvas" role="img"></canvas>
      <div class="overlay" id="overlay">
        <div>
          <h2 id="overlay-title"></h2>
          <div class="overlay-score" id="overlay-score"></div>
          <p id="overlay-text"></p>
        </div>
      </div>
    </div>

    <div>
      <div class="seg" id="speeds" role="group"></div>
      <button class="btn" type="button" id="action"></button>
      <div class="pad" id="pad"></div>
      <p class="hint" id="hint"></p>
    </div>
  </div>

  <div class="runs">
    <span class="runs-label" id="runs-label"></span>
    <div class="runs-list" id="runs-list"></div>
  </div>
</div>

<script>
  // 可编辑区：文案、配色与规则都在这个对象里。改内容只改这里。
  const TEMPLATE = {
    meta: {
      lang: 'zh-CN',
      title: '磷光 贪吃蛇',
      description: '单文件贪吃蛇小游戏，打开即可游玩。',
    },

    theme: {
      bg: '#0e1113',
      surface: '#161a1c',
      board: '#111517',
      grid: '#1b2124',
      line: '#232a2d',
      lineStrong: '#333d41',
      ink: '#e6ecec',
      muted: '#8b9698',
      faint: '#616d70',
      accent: '#5fd0a8',
      accentHi: '#8df0c6',
      accentDim: '#2c6a56',
      onAccent: '#0a1512',
      food: '#e8875f',
    },

    copy: {
      title: '磷光',
      subtitle: '贪吃蛇 单人游戏',
      boardLabel: '贪吃蛇棋盘',
      scoreLabel: '本局',
      bestLabel: '本机最高',
      speedLabel: '速度',
      startLabel: '开始',
      pauseLabel: '暂停',
      resumeLabel: '继续',
      restartLabel: '重来',
      overlayPausedTitle: '已暂停',
      overlayPausedText: '按空格或点继续，回到棋盘。',
      overlayOverTitle: '本局结束',
      overlayOverText: '这一局吃到 {score} 分。再来一局？',
      padLabels: { up: '向上', left: '向左', down: '向下', right: '向右' },
      runsLabel: '最近几局',
      runsEmpty: '还没有记录，先玩一局。',
      keysHint: '吃掉发光方块加一分。撞墙或咬到自己，本局结束。方向键或 [[W]] [[A]] [[S]] [[D]] 转向，[[空格]] 暂停。手机可以点右侧方向键。',
    },

    rules: {
      cols: 24,
      rows: 15,
      cell: 26,
      startLength: 6,
      history: 5,
      storageKey: 'snake-recent-runs',
      speeds: [
        { label: '慢', stepMs: 155 },
        { label: '标准', stepMs: 108 },
        { label: '快', stepMs: 70 },
      ],
      defaultSpeed: 1,
    },
  };
  // ── 可编辑区结束 ──

  (function () {
    const meta = TEMPLATE.meta || {};
    const theme = TEMPLATE.theme || {};
    const copy = TEMPLATE.copy || {};
    const RULES = TEMPLATE.rules || {};

    const COLS = RULES.cols || 24;
    const ROWS = RULES.rows || 15;
    const CELL = RULES.cell || 26;
    const START_LENGTH = RULES.startLength || 6;
    const HISTORY_MAX = RULES.history || 5;
    const STORAGE_KEY = RULES.storageKey || 'snake-recent-runs';
    const SPEEDS = RULES.speeds || [{ label: '标准', stepMs: 108 }];

    const W = COLS * CELL;
    const H = ROWS * CELL;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);

    const byId = id => document.getElementById(id);

    const el = (tag, cls, text) => {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = String(text);
      return node;
    };

    const setText = (id, value) => {
      const node = byId(id);
      if (node) node.textContent = value == null ? '' : String(value);
    };

    const writeKeys = (node, text) => {
      if (!node) return;
      node.textContent = '';
      String(text == null ? '' : text).split(/(\[\[[^\]]+\]\])/).forEach(part => {
        const hit = part.match(/^\[\[([^\]]+)\]\]$/);
        if (hit) node.appendChild(el('kbd', null, hit[1]));
        else if (part) node.appendChild(document.createTextNode(part));
      });
    };

    /* 主题 */
    const themeVars = {
      bg: '--bg',
      surface: '--surface',
      board: '--board',
      grid: '--grid',
      line: '--line',
      lineStrong: '--line-strong',
      ink: '--ink',
      muted: '--muted',
      faint: '--faint',
      accent: '--accent',
      accentHi: '--accent-hi',
      accentDim: '--accent-dim',
      onAccent: '--on-accent',
      food: '--food',
    };

    Object.keys(themeVars).forEach(key => {
      if (theme[key]) document.documentElement.style.setProperty(themeVars[key], theme[key]);
    });

    if (meta.lang) document.documentElement.lang = meta.lang;
    if (meta.title) document.title = meta.title;
    const desc = byId('doc-desc');
    if (desc && meta.description) desc.setAttribute('content', meta.description);

    /* 文案 */
    setText('game-title', copy.title);
    setText('game-sub', copy.subtitle);
    setText('score-key', copy.scoreLabel);
    setText('best-key', copy.bestLabel);
    setText('runs-label', copy.runsLabel);
    writeKeys(byId('hint'), copy.keysHint);

    const canvas = byId('canvas');
    const board = byId('board');
    const overlay = byId('overlay');
    const overlayTitle = byId('overlay-title');
    const overlayScore = byId('overlay-score');
    const overlayText = byId('overlay-text');
    const actionBtn = byId('action');
    const padHost = byId('pad');
    const speedsHost = byId('speeds');
    const runsHost = byId('runs-list');

    board.style.width = W + 'px';
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    if (copy.boardLabel) canvas.setAttribute('aria-label', copy.boardLabel);
    if (copy.speedLabel) speedsHost.setAttribute('aria-label', copy.speedLabel);

    const ctx = canvas.getContext('2d');
    ctx.scale(DPR, DPR);

    const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const C = {
      board: cssVar('--board') || '#111517',
      grid: cssVar('--grid') || '#1b2124',
      body: cssVar('--accent') || '#5fd0a8',
      head: cssVar('--accent-hi') || '#8df0c6',
      tail: cssVar('--accent-dim') || '#2c6a56',
      food: cssVar('--food') || '#e8875f',
    };

    /* 颜色工具 */
    const parseHex = hex => {
      const v = String(hex).trim().replace('#', '');
      if (v.length === 3) {
        return [
          parseInt(v[0] + v[0], 16),
          parseInt(v[1] + v[1], 16),
          parseInt(v[2] + v[2], 16),
        ];
      }
      if (v.length !== 6 || /[^0-9a-f]/i.test(v)) return null;
      return [
        parseInt(v.slice(0, 2), 16),
        parseInt(v.slice(2, 4), 16),
        parseInt(v.slice(4, 6), 16),
      ];
    };

    const mix = (from, to, t) => {
      const a = parseHex(from);
      const b = parseHex(to);
      if (!a || !b) return t > 0.5 ? to : from;
      const out = a.map((v, i) => Math.round(v + (b[i] - v) * t));
      return 'rgb(' + out[0] + ',' + out[1] + ',' + out[2] + ')';
    };

    const roundRect = (x, y, w, h, r) => {
      ctx.beginPath();
      if (typeof ctx.roundRect === 'function') ctx.roundRect(x, y, w, h, r);
      else ctx.rect(x, y, w, h);
    };

    /* 状态 */
    var snake = [];
    var dir = { x: 1, y: 0 };
    var nextDir = { x: 1, y: 0 };
    var food = null;
    var score = 0;
    var best = 0;
    var history = [];
    var running = false;
    var paused = false;
    var over = false;
    var speedIndex = Math.min(Math.max(RULES.defaultSpeed || 0, 0), SPEEDS.length - 1);
    var acc = 0;
    var lastTs = 0;
    var raf = null;

    const readRuns = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.filter(n => typeof n === 'number' && isFinite(n)).slice(0, HISTORY_MAX);
      } catch (err) {
        return [];
      }
    };

    const writeRuns = () => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      } catch (err) {
        /* 无痕模式下写不进去，忽略 */
      }
    };

    const placedFood = () => {
      const free = [];
      for (var y = 0; y < ROWS; y += 1) {
        for (var x = 0; x < COLS; x += 1) {
          var taken = false;
          for (var i = 0; i < snake.length; i += 1) {
            if (snake[i].x === x && snake[i].y === y) { taken = true; break; }
          }
          if (!taken) free.push({ x: x, y: y });
        }
      }
      return free.length ? free[Math.floor(Math.random() * free.length)] : null;
    };

    const renderStats = () => {
      setText('score-val', score);
      setText('best-val', Math.max(best, score));
    };

    const renderRuns = () => {
      if (!runsHost) return;
      runsHost.textContent = '';
      if (!history.length) {
        runsHost.appendChild(el('span', 'runs-empty', copy.runsEmpty || ''));
        return;
      }
      history.forEach(value => {
        const chip = el('span', 'run' + (value === best && best > 0 ? ' is-best' : ''), value);
        runsHost.appendChild(chip);
      });
    };

    const showOverlay = mode => {
      if (!overlay) return;
      overlay.classList.add('on');
      if (mode === 'paused') {
        setText('overlay-title', copy.overlayPausedTitle);
        overlayScore.textContent = '';
        setText('overlay-text', copy.overlayPausedText);
      } else {
        setText('overlay-title', copy.overlayOverTitle);
        overlayScore.textContent = String(score);
        const text = String(copy.overlayOverText || '').replace('{score}', String(score));
        setText('overlay-text', text);
      }
    };

    const hideOverlay = () => {
      if (overlay) overlay.classList.remove('on');
    };

    const setAction = () => {
      if (!actionBtn) return;
      let label = copy.startLabel;
      if (over) label = copy.restartLabel;
      else if (running) label = copy.pauseLabel;
      else if (paused) label = copy.resumeLabel;
      actionBtn.textContent = label == null ? '' : String(label);
      actionBtn.className = running ? 'btn is-ghost' : 'btn';
    };

    const draw = ts => {
      const now = typeof ts === 'number' ? ts : performance.now();
      ctx.fillStyle = C.board;
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = C.grid;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (var gx = 1; gx < COLS; gx += 1) {
        ctx.moveTo(gx * CELL + 0.5, 0);
        ctx.lineTo(gx * CELL + 0.5, H);
      }
      for (var gy = 1; gy < ROWS; gy += 1) {
        ctx.moveTo(0, gy * CELL + 0.5);
        ctx.lineTo(W, gy * CELL + 0.5);
      }
      ctx.stroke();

      if (food) {
        const pulse = 0.5 + 0.5 * Math.sin(now / 430);
        const size = CELL * (0.42 + pulse * 0.1);
        ctx.save();
        ctx.translate(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);
        ctx.rotate(Math.PI / 4);
        ctx.fillStyle = C.food;
        roundRect(-size / 2, -size / 2, size, size, 2);
        ctx.fill();
        ctx.restore();
      }

      for (var i = snake.length - 1; i >= 0; i -= 1) {
        const seg = snake[i];
        const head = i === 0;
        const t = snake.length > 1 ? 1 - i / (snake.length - 1) : 1;
        const gap = head ? 1.5 : 2.5;
        ctx.fillStyle = head ? C.head : mix(C.tail, C.body, t);
        roundRect(seg.x * CELL + gap, seg.y * CELL + gap, CELL - gap * 2, CELL - gap * 2, head ? 6 : 4);
        ctx.fill();
      }

      if (snake.length) {
        const head = snake[0];
        const cx = head.x * CELL + CELL / 2;
        const cy = head.y * CELL + CELL / 2;
        const fwd = CELL * 0.17;
        const side = CELL * 0.17;
        const px = -dir.y;
        const py = dir.x;
        ctx.fillStyle = C.board;
        [-1, 1].forEach(sgn => {
          ctx.beginPath();
          ctx.arc(
            cx + dir.x * fwd + px * side * sgn,
            cy + dir.y * fwd + py * side * sgn,
            Math.max(1.6, CELL * 0.072),
            0,
            Math.PI * 2
          );
          ctx.fill();
        });
      }
    };

    const reset = () => {
      const cx = Math.floor(COLS / 2);
      const cy = Math.floor(ROWS / 2);
      snake = [];
      for (var i = 0; i < START_LENGTH; i += 1) snake.push({ x: cx - i, y: cy });
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      over = false;
      paused = false;
      acc = 0;
      lastTs = 0;
      food = placedFood();
      renderStats();
    };

    const finish = () => {
      running = false;
      over = true;
      paused = false;
      if (raf) {
        cancelAnimationFrame(raf);
        raf = null;
      }
      best = Math.max(best, score);
      history = [score].concat(history).slice(0, HISTORY_MAX);
      writeRuns();
      renderStats();
      renderRuns();
      setAction();
      showOverlay('over');
      draw();
    };

    const step = () => {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) {
        finish();
        return;
      }
      const growing = !!food && head.x === food.x && head.y === food.y;
      const body = growing ? snake : snake.slice(0, snake.length - 1);
      for (var i = 0; i < body.length; i += 1) {
        if (body[i].x === head.x && body[i].y === head.y) {
          finish();
          return;
        }
      }
      snake.unshift(head);
      if (growing) {
        score += 1;
        renderStats();
        food = placedFood();
      } else {
        snake.pop();
      }
    };

    const loop = ts => {
      if (!running) return;
      if (!lastTs) lastTs = ts;
      acc += ts - lastTs;
      lastTs = ts;
      const stepMs = (SPEEDS[speedIndex] || SPEEDS[0]).stepMs;
      var guard = 0;
      while (acc >= stepMs && running && guard < 8) {
        acc -= stepMs;
        guard += 1;
        step();
      }
      draw(ts);
      raf = running ? requestAnimationFrame(loop) : null;
    };

    const play = () => {
      if (over) reset();
      running = true;
      paused = false;
      over = false;
      hideOverlay();
      setAction();
      acc = 0;
      lastTs = 0;
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(loop);
    };

    const pause = () => {
      if (!running) return;
      running = false;
      paused = true;
      if (raf) {
        cancelAnimationFrame(raf);
        raf = null;
      }
      setAction();
      showOverlay('paused');
      draw();
    };

    const turn = (nx, ny) => {
      if (over) return;
      if (!running) play();
      if (dir.x === -nx && dir.y === -ny) return;
      if (nextDir.x === nx && nextDir.y === ny) return;
      nextDir = { x: nx, y: ny };
    };

    /* 速度档位 */
    SPEEDS.forEach((speed, i) => {
      const btn = el('button', null, speed.label);
      btn.type = 'button';
      btn.setAttribute('aria-pressed', i === speedIndex ? 'true' : 'false');
      btn.addEventListener('click', () => {
        speedIndex = i;
        Array.prototype.forEach.call(speedsHost.children, (node, j) => {
          node.setAttribute('aria-pressed', j === i ? 'true' : 'false');
        });
      });
      speedsHost.appendChild(btn);
    });

    /* 方向键 */
    const pads = [
      { key: 'up', x: 0, y: -1, glyph: '\u2191' },
      { key: 'left', x: -1, y: 0, glyph: '\u2190' },
      { key: 'down', x: 0, y: 1, glyph: '\u2193' },
      { key: 'right', x: 1, y: 0, glyph: '\u2192' },
    ];

    pads.forEach(pad => {
      const btn = el('button', null, pad.glyph);
      btn.type = 'button';
      if (copy.padLabels && copy.padLabels[pad.key]) btn.setAttribute('aria-label', copy.padLabels[pad.key]);
      btn.addEventListener('click', () => turn(pad.x, pad.y));
      padHost.appendChild(btn);
    });

    actionBtn.addEventListener('click', () => {
      if (running) pause();
      else play();
    });

    const keyMap = {
      ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
      W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0],
    };

    window.addEventListener('keydown', ev => {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      if (ev.key === ' ' || ev.key === 'Spacebar') {
        ev.preventDefault();
        if (running) pause();
        else play();
        return;
      }
      if (ev.key === 'Enter' && !running) {
        ev.preventDefault();
        play();
        return;
      }
      const move = keyMap[ev.key];
      if (move) {
        ev.preventDefault();
        turn(move[0], move[1]);
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && running) pause();
    });

    window.addEventListener('beforeunload', () => {
      if (raf) cancelAnimationFrame(raf);
    });

    /* 开局 */
    best = readRuns().reduce((max, value) => Math.max(max, value), 0);
    history = readRuns();
    reset();
    renderRuns();
    setAction();
    draw();
  })();
</script>
</body>
</html>
