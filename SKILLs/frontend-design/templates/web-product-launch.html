<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经纬 · 把散落的事件流压成一张可查询的网格</title>
<meta name="description" content="经纬把 23 类数据源接入同一张事件网格，p95 查询稳定在 68 毫秒以内。">
<style>
  :root {
    color-scheme: dark;
    --canvas: #0b0d10;
    --surface: #12151a;
    --surface-2: #171b21;
    --ink: #e9edf2;
    --ink-soft: #b6bec8;
    --muted: #7d8794;
    --rule: rgba(233, 237, 242, 0.12);
    --rule-strong: rgba(233, 237, 242, 0.26);
    --accent: #2ee6d6;
    --accent-ink: #04211f;
    --accent-dim: rgba(46, 230, 214, 0.16);
    --gutter: clamp(20px, 4vw, 44px);
    --measure: 62ch;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font: 400 15px/1.7 var(--sans);
    letter-spacing: 0.004em;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent); color: var(--accent-ink); }

  a { color: inherit; text-decoration: none; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 1px;
  }

  .skip {
    position: absolute;
    left: -9999px;
    top: 0;
    z-index: 40;
    background: var(--accent);
    color: var(--accent-ink);
    padding: 10px 16px;
  }

  .skip:focus { left: 12px; top: 12px; }

  .wrap {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 var(--gutter);
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .rule-top { border-top: 1px solid var(--rule); }

  /* ── 顶栏 ─────────────────────────────────────────────── */
  header.nav {
    position: sticky;
    top: 0;
    z-index: 30;
    backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--canvas) 82%, transparent);
    border-bottom: 1px solid var(--rule);
  }

  .nav-inner {
    display: flex;
    align-items: center;
    gap: 28px;
    height: 62px;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }

  .brand-mark {
    font-weight: 650;
    font-size: 17px;
    letter-spacing: 0.16em;
  }

  .brand-latin {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.28em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .nav-links {
    display: flex;
    gap: 26px;
    margin-left: auto;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .nav-links a { position: relative; padding: 4px 0; }

  .nav-links a::after {
    content: "";
    position: absolute;
    left: 0;
    right: 100%;
    bottom: 0;
    height: 1px;
    background: var(--accent);
    transition: right 320ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .nav-links a:hover { color: var(--ink); }

  .nav-links a:hover::after { right: 0; }

  .nav-cta { margin-left: 4px; }

  /* ── 按钮 ─────────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 42px;
    padding: 0 20px;
    border: 1px solid var(--rule-strong);
    border-radius: 2px;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.02em;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background-color 220ms ease, border-color 220ms ease, color 220ms ease, transform 160ms ease;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .btn:active { transform: translateY(1px); }

  .btn-solid {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }

  .btn-solid:hover { background: #59f0e2; border-color: #59f0e2; color: var(--accent-ink); }

  /* ── 首屏 ─────────────────────────────────────────────── */
  .hero-band {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: min(700px, calc(100svh - 62px));
    padding: clamp(40px, 6vh, 72px) var(--gutter) clamp(32px, 4.5vh, 56px);
  }

  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1.02fr) minmax(0, 0.98fr);
    gap: clamp(28px, 4vw, 62px);
    align-items: center;
  }

  .hero-copy { max-width: min(100%, 560px); }

  .hero h1 {
    margin: 16px 0 0;
    font-size: clamp(28px, 3.3vw, 48px);
    line-height: 1.16;
    text-wrap: balance;
    font-weight: 640;
    letter-spacing: -0.02em;
  }

  .hero h1 em {
    font-style: normal;
    border-bottom: 3px solid var(--accent);
    padding-bottom: 2px;
  }

  .hero-lede {
    margin: 20px 0 0;
    color: var(--ink-soft);
    max-width: 42ch;
    text-wrap: balance;
  }

  .hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 30px;
  }

  .hero-stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1px;
    margin-top: clamp(38px, 5vh, 60px);
    border-top: 1px solid var(--rule);
  }

  .stat { padding: 18px 14px 0 0; }

  .stat-key {
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stat-value {
    display: block;
    margin-top: 8px;
    font-family: var(--sans);
    font-variant-numeric: tabular-nums;
    font-size: clamp(24px, 2.6vw, 34px);
    line-height: 1;
    letter-spacing: -0.012em;
    font-weight: 560;
  }

  .stat-unit {
    font-size: 12px;
    color: var(--muted);
    margin-left: 4px;
  }

  /* 仪表：首屏右半边的可视化面板 */
  .instrument {
    position: relative;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: linear-gradient(180deg, var(--surface-2), var(--surface));
    overflow: hidden;
  }

  .instrument-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .instrument-live { display: inline-flex; align-items: center; gap: 7px; }

  .instrument-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 var(--accent-dim);
    animation: pulse 2400ms ease-out infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(46, 230, 214, 0.34); }
    70% { box-shadow: 0 0 0 9px rgba(46, 230, 214, 0); }
    100% { box-shadow: 0 0 0 0 rgba(46, 230, 214, 0); }
  }

  .instrument-readout {
    font-family: var(--sans);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0;
    font-weight: 560;
    color: var(--ink);
  }

  .instrument canvas {
    display: block;
    width: 100%;
    height: clamp(240px, 34vh, 340px);
  }

  .instrument-foot {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 10px 14px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }

  /* ── 分节标题 ─────────────────────────────────────────── */
  .section { padding: clamp(64px, 9vh, 112px) 0; }

  .section-head { max-width: var(--measure); }

  .section-head h2 {
    margin: 14px 0 0;
    font-size: clamp(26px, 3.2vw, 40px);
    line-height: 1.16;
    text-wrap: balance;
    font-weight: 620;
    letter-spacing: -0.014em;
  }

  .section-head p { margin: 16px 0 0; color: var(--ink-soft); text-wrap: balance; }

  /* ── 三段工作流（左粘右滚） ───────────────────────────── */
  .flow-grid {
    display: grid;
    grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
    gap: clamp(28px, 5vw, 72px);
    align-items: start;
    margin-top: 52px;
  }

  .flow-visual {
    position: sticky;
    top: 92px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--surface);
    padding: 18px;
  }

  .morph {
    position: relative;
    height: clamp(230px, 30vh, 300px);
    border: 1px solid var(--rule);
    border-radius: 2px;
    background:
      linear-gradient(90deg, var(--rule) 1px, transparent 1px) 0 0 / 25% 100%,
      linear-gradient(180deg, var(--rule) 1px, transparent 1px) 0 0 / 100% 25%,
      var(--canvas);
    overflow: hidden;
  }

  .morph-dot {
    position: absolute;
    left: 0;
    top: 0;
    width: 7px;
    height: 7px;
    margin: -3.5px 0 0 -3.5px;
    border-radius: 50%;
    background: var(--ink-soft);
    transition: transform 900ms cubic-bezier(0.22, 0.7, 0.2, 1), background-color 500ms ease, opacity 500ms ease;
  }

  .morph.is-lattice .morph-dot { background: var(--accent); }

  .morph-rows {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 9px;
    padding: 0 22px;
    opacity: 0;
    transition: opacity 520ms ease;
  }

  .morph.is-rows .morph-rows { opacity: 1; }

  .morph.is-rows .morph-dot { opacity: 0.18; }

  .morph-row {
    display: grid;
    grid-template-columns: 74px 1fr 52px;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }

  .morph-bar { height: 6px; background: var(--accent); border-radius: 1px; opacity: 0.72; }

  .flow-caption {
    margin: 14px 0 0;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .steps { display: flex; flex-direction: column; }

  .step {
    padding: 30px 0 34px;
    border-top: 1px solid var(--rule);
    opacity: 0.42;
    transition: opacity 420ms ease;
  }

  .step:first-child { border-top: 0; padding-top: 0; }

  .step.is-active { opacity: 1; }

  .step-index {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--muted);
  }

  .step h3 {
    margin: 12px 0 0;
    font-size: clamp(19px, 1.7vw, 24px);
    font-weight: 600;
    letter-spacing: -0.008em;
  }

  .step p { margin: 12px 0 0; color: var(--ink-soft); max-width: 46ch; }

  .step-metric {
    display: inline-block;
    margin-top: 16px;
    padding: 5px 10px;
    border: 1px solid var(--rule-strong);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
  }

  /* ── 指标 ─────────────────────────────────────────────── */
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 1px;
    margin-top: 46px;
    border-top: 1px solid var(--rule);
  }

  .metric {
    padding: 26px 20px 26px 0;
    border-right: 1px solid var(--rule);
  }

  .metric:last-child { border-right: 0; }

  .metric-label { font-size: 13px; color: var(--ink-soft); }

  .metric-value {
    display: block;
    margin-top: 14px;
    font-family: var(--sans);
    font-variant-numeric: tabular-nums;
    font-size: clamp(30px, 3.4vw, 46px);
    line-height: 1;
    letter-spacing: -0.012em;
    font-weight: 560;
  }

  .metric-note { display: block; margin-top: 10px; font-size: 12px; color: var(--muted); }

  .metric svg { display: block; margin-top: 18px; width: 100%; height: 34px; overflow: visible; }

  /* ── 对比表 ───────────────────────────────────────────── */
  .compare { margin-top: 42px; }

  .compare-row {
    display: grid;
    grid-template-columns: 180px minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(16px, 3vw, 44px);
    padding: 20px 0;
    border-bottom: 1px solid var(--rule);
    align-items: baseline;
  }

  .compare-row:last-child { border-bottom: 0; }

  .compare-head {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .compare-key { font-size: 14px; color: var(--ink); }

  .compare-before { color: var(--muted); }

  .compare-after { color: var(--ink); }

  .compare-after b { color: var(--accent); font-weight: 500; }

  /* ── 客户 ─────────────────────────────────────────────── */
  .logos {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 1px;
    margin-top: 40px;
    border: 1px solid var(--rule);
  }

  .logo-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 96px;
    padding: 18px;
    border-right: 1px solid var(--rule);
    color: var(--ink-soft);
    transition: color 220ms ease, background-color 220ms ease;
  }

  .logo-cell:last-child { border-right: 0; }

  .logo-cell:hover { color: var(--ink); background: var(--surface); }

  .logo-cell svg { flex: none; }

  .logo-name { font-size: 13.5px; letter-spacing: 0.02em; }

  /* ── 引言 ─────────────────────────────────────────────── */
  .quote {
    max-width: 32ch;
    margin: 0;
    font-size: clamp(24px, 3vw, 38px);
    line-height: 1.28;
    text-wrap: balance;
    letter-spacing: -0.014em;
    font-weight: 500;
  }

  .quote-by {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 26px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .quote-by::before { content: ""; width: 42px; height: 1px; background: var(--accent); }

  /* ── 接入 ─────────────────────────────────────────────── */
  .start-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: clamp(28px, 5vw, 68px);
    align-items: start;
    margin-top: 44px;
  }

  .start-list { list-style: none; margin: 0; padding: 0; }

  .start-list li {
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr);
    gap: 14px;
    padding: 18px 0;
    border-top: 1px solid var(--rule);
  }

  .start-list li:first-child { border-top: 0; padding-top: 0; }

  .start-index { font-family: var(--mono); font-size: 12px; color: var(--accent); }

  .start-list b { display: block; font-weight: 550; font-size: 15px; }

  .start-list span.body { display: block; margin-top: 6px; color: var(--ink-soft); font-size: 13.5px; }

  .code {
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: var(--surface);
    overflow: hidden;
  }

  .code-head {
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .code pre {
    margin: 0;
    padding: 18px 16px;
    overflow-x: auto;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.85;
    color: var(--ink-soft);
  }

  .code .k { color: var(--accent); }
  .code .c { color: #5c6672; }

  /* ── 收尾 ─────────────────────────────────────────────── */
  .closing {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 28px;
    padding: clamp(52px, 7vh, 84px) 0;
    border-top: 1px solid var(--rule-strong);
  }

  .closing h2 {
    margin: 0;
    font-size: clamp(26px, 3.4vw, 44px);
    line-height: 1.14;
    font-weight: 620;
    letter-spacing: -0.016em;
    max-width: 22ch;
  }

  .closing-actions { display: flex; gap: 12px; flex-wrap: wrap; }

  footer {
    padding: 30px 0 46px;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 12.5px;
  }

  .foot-inner { display: flex; flex-wrap: wrap; gap: 18px 32px; justify-content: space-between; }

  .foot-links { display: flex; flex-wrap: wrap; gap: 20px; }

  .foot-links a:hover { color: var(--ink); }

  /* ── 滚动显现 ─────────────────────────────────────────── */
  .reveal {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 700ms cubic-bezier(0.2, 0.7, 0.2, 1), transform 700ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  .reveal.is-in { opacity: 1; transform: none; }

  @media (max-width: 1080px) {
    .hero { grid-template-columns: 1fr; }
    .hero-copy { max-width: 46ch; }
    .flow-grid { grid-template-columns: 1fr; }
    .flow-visual { position: static; }
    .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .metric:nth-child(2n) { border-right: 0; }
    .metric:nth-child(n + 3) { border-top: 1px solid var(--rule); }
    .logos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .logo-cell:nth-child(2n) { border-right: 0; }
    .logo-cell:nth-child(n + 3) { border-top: 1px solid var(--rule); }
    .start-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 720px) {
    .nav-links { display: none; }
    .nav-inner { gap: 12px; }
    .hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat { padding-bottom: 16px; }
    .compare-row { grid-template-columns: 1fr; gap: 8px; }
    .compare-head { display: none; }
    .metric-grid, .logos { grid-template-columns: 1fr; }
    .metric, .logo-cell { border-right: 0; }
    .metric + .metric, .logo-cell + .logo-cell { border-top: 1px solid var(--rule); }
    .morph-row { grid-template-columns: 58px 1fr 40px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>

<header class="nav">
  <div class="wrap nav-inner">
    <div class="brand">
      <span class="brand-mark" id="brand-mark">经纬</span>
      <span class="brand-latin" id="brand-latin">Meridian</span>
    </div>
    <nav class="nav-links" id="nav-links" aria-label="页面导航"></nav>
    <div class="nav-cta" id="nav-cta"></div>
  </div>
</header>

<main id="main">
  <section class="wrap hero-band">
    <div class="hero">
    <div class="hero-copy">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-title"></h1>
      <p class="hero-lede" id="hero-lede"></p>
      <div class="hero-actions" id="hero-actions"></div>
    </div>

    <figure class="instrument reveal" style="margin:0">
      <div class="instrument-head">
        <span id="panel-title"></span>
        <span class="instrument-live">
          <span class="instrument-dot" aria-hidden="true"></span>
          <span class="instrument-readout" id="panel-readout">0</span>
        </span>
      </div>
      <canvas id="field"></canvas>
      <figcaption class="instrument-foot">
        <span id="panel-left"></span>
        <span id="panel-right"></span>
      </figcaption>
    </figure>
    </div>
    <div class="hero-stats" id="hero-stats"></div>
  </section>

  <section class="section rule-top" id="flow">
    <div class="wrap">
      <div class="section-head reveal">
          <h2 id="flow-title"></h2>
        <p id="flow-lede"></p>
      </div>

      <div class="flow-grid">
        <div class="flow-visual reveal">
          <div class="morph" id="morph" aria-hidden="true">
            <div class="morph-rows" id="morph-rows"></div>
          </div>
          <p class="flow-caption" id="flow-caption"></p>
        </div>

        <div class="steps" id="steps"></div>
      </div>
    </div>
  </section>

  <section class="section rule-top" id="metrics">
    <div class="wrap">
      <div class="section-head reveal">
        <p class="eyebrow" id="metrics-eyebrow"></p>
        <h2 id="metrics-title"></h2>
        <p id="metrics-note"></p>
      </div>
      <div class="metric-grid reveal" id="metric-grid"></div>
    </div>
  </section>

  <section class="section rule-top" id="compare">
    <div class="wrap">
      <div class="section-head reveal">

  (function render() {
    const byId = id => document.getElementById(id);

    const setText = (id, value) => {
      const node = byId(id);
      if (node) node.textContent = value == null ? '' : String(value);
    };

    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    };

    const fill = (id, nodes) => {
      const host = byId(id);
      if (!host) return;
      host.textContent = '';
      nodes.forEach(node => host.appendChild(node));
    };

    const announce = node => {
      const href = node.getAttribute('href');
      if (!href || href.charAt(0) !== '#' || href === '#') return;
      node.addEventListener('click', event => {
        const anchor = document.querySelector(href);
        if (!anchor) return;
        event.preventDefault();
        anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    };

    const action = (item, solid) => {
      const node = el('a', 'btn' + (solid ? ' btn-solid' : ''), item.label);
      node.href = item.href || '#';
      announce(node);
      return node;
    };

    // 配色由 TEMPLATE.theme 注入，结构里不写死颜色
    const themeVars = {
      canvas: '--canvas',
      surface: '--surface',
      surface2: '--surface-2',
      ink: '--ink',
      inkSoft: '--ink-soft',
      muted: '--muted',
      rule: '--rule',
      ruleStrong: '--rule-strong',
      accent: '--accent',
      accentInk: '--accent-ink',
    };
    const theme = TEMPLATE.theme || {};
    Object.keys(themeVars).forEach(key => {
      if (theme[key]) document.documentElement.style.setProperty(themeVars[key], theme[key]);
    });

    const meta = TEMPLATE.meta || {};
    if (meta.lang) document.documentElement.lang = meta.lang;
    if (meta.title) document.title = meta.title;
    const description = document.querySelector('meta[name="description"]');
    if (description && meta.description) description.setAttribute('content', meta.description);

    const brand = TEMPLATE.brand || {};
    setText('brand-mark', brand.mark);
    setText('brand-latin', brand.latin);
    fill('nav-links', (brand.nav || []).map(item => {
      const node = el('a', null, item.label);
      node.href = item.target || '#';
      announce(node);
      return node;
    }));
    if (brand.cta) {
      const cta = el('a', 'btn', brand.cta.label);
      cta.href = brand.cta.href || '#';
      announce(cta);
      fill('nav-cta', [cta]);
    }

    const hero = TEMPLATE.hero || {};
    setText('hero-eyebrow', hero.eyebrow);
    // 标题允许一个 <em> 标记，用来给关键词加底线强调
    byId('hero-title').innerHTML = hero.title || '';
    setText('hero-lede', hero.lede);
    fill('hero-actions', [action(hero.primary || {}, true), action(hero.secondary || {}, false)]);
    fill('hero-stats', (hero.stats || []).map(item => {
      const cell = el('div', 'stat');
      cell.appendChild(el('span', 'stat-key', item.key));
      const value = el('span', 'stat-value');
      value.appendChild(el('span', 'stat-number', formatNumber(item.value, item.decimals)));
      if (item.unit) value.appendChild(el('span', 'stat-unit', item.unit));
      cell.appendChild(value);
      return cell;
    }));

    const panel = hero.panel || {};
    setText('panel-title', panel.title);
    setText('panel-left', panel.left);
    setText('panel-right', panel.right || panel.nodes);

    function formatNumber(value, decimals) {
      const number = Number(value);
      if (!isFinite(number)) return String(value == null ? '' : value);
      return number.toFixed(decimals || 0);
    }

    const flow = TEMPLATE.flow || {};
    setText('flow-title', flow.title);
    setText('flow-lede', flow.lede);
    setText('flow-caption', flow.caption);
    fill('steps', (flow.steps || []).map((step, index) => {
      const block = el('article', 'step' + (index === 0 ? ' is-active' : ''));
      block.dataset.step = String(index);
      block.appendChild(el('span', 'step-index', '0' + (index + 1)));
      block.appendChild(el('h3', null, step.title));
      block.appendChild(el('p', null, step.text));
      if (step.metric) block.appendChild(el('span', 'step-metric', step.metric));
      return block;
    }));

    const metrics = TEMPLATE.metrics || {};
    setText('metrics-eyebrow', metrics.eyebrow);
    setText('metrics-title', metrics.title);
    setText('metrics-note', metrics.note);
    fill('metric-grid', (metrics.items || []).map(item => {
      const cell = el('div', 'metric');
      cell.appendChild(el('span', 'metric-label', item.label));
      const value = el('span', 'metric-value', item.value + (item.unit || ''));
      cell.appendChild(value);
      cell.appendChild(el('span', 'metric-note', item.note));
      cell.appendChild(sparkline(item.spark));
      return cell;
    }));

    function sparkline(points) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      const values = (points || []).map(Number).filter(value => isFinite(value));
      svg.setAttribute('viewBox', '0 0 100 30');
      svg.setAttribute('preserveAspectRatio', 'none');
      svg.setAttribute('aria-hidden', 'true');
      if (values.length < 2) return svg;
      const max = Math.max.apply(null, values);
      const min = Math.min.apply(null, values);
      const span = max - min || 1;
      const step = 100 / (values.length - 1);
      const coords = values.map((value, index) => {
        const x = index * step;
        const y = 28 - ((value - min) / span) * 24;
        return x.toFixed(2) + ',' + y.toFixed(2);
      });
      const line = document.createElementNS(ns, 'polyline');
      line.setAttribute('points', coords.join(' '));
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', 'var(--accent)');
      line.setAttribute('stroke-width', '1.4');
      line.setAttribute('vector-effect', 'non-scaling-stroke');
      svg.appendChild(line);
      const area = document.createElementNS(ns, 'polygon');
      area.setAttribute('points', '0,30 ' + coords.join(' ') + ' 100,30');
      area.setAttribute('fill', 'rgba(46,230,214,0.10)');
      svg.insertBefore(area, line);
      return svg;
    }

    const compare = TEMPLATE.compare || {};
    setText('compare-title', compare.title);
    const compareRows = [];
    if (compare.head) {
      const head = el('div', 'compare-row');
      head.appendChild(el('span', 'compare-head', compare.head.key));
      head.appendChild(el('span', 'compare-head', compare.head.before));
      head.appendChild(el('span', 'compare-head', compare.head.after));
      compareRows.push(head);

    (compare.rows || []).forEach(row => {
      const line = el('div', 'compare-row');
      line.appendChild(el('span', 'compare-key', row.key));
      line.appendChild(el('span', 'compare-before', row.before));
      line.appendChild(el('span', 'compare-after', row.after)).innerHTML = row.after || '';

    fill('compare-body', compareRows);

    const proof = TEMPLATE.proof || {};
    setText('proof-eyebrow', proof.eyebrow);

    // 客户标识只用单色几何字标，不引入任何外部图片
    function monogram(mark) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('width', '22');
      svg.setAttribute('height', '22');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('aria-hidden', 'true');
      const shape = document.createElementNS(ns, 'rect');
      shape.setAttribute('fill', 'none');
      shape.setAttribute('stroke', 'currentColor');
      shape.setAttribute('stroke-width', '1.3');
      if (mark === 'circle') {
        shape.setAttribute('x', '3');
        shape.setAttribute('y', '3');
        shape.setAttribute('width', '18');
        shape.setAttribute('height', '18');
        shape.setAttribute('rx', '9');
      } else if (mark === 'triangle') {
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', 'M12 3.6 20.6 19.4H3.4Z');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'currentColor');
        path.setAttribute('stroke-width', '1.3');
        svg.appendChild(path);
        return svg;
      } else if (mark === 'diamond') {
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', 'M12 2.8 21.2 12 12 21.2 2.8 12Z');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'currentColor');
        path.setAttribute('stroke-width', '1.3');
        svg.appendChild(path);
        return svg;
      } else if (mark === 'hex') {
        const path = document.createElementNS(ns, 'path');
        path.setAttribute('d', 'M12 2.6 20.2 7.3v9.4L12 21.4 3.8 16.7V7.3Z');
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'currentColor');
        path.setAttribute('stroke-width', '1.3');
        svg.appendChild(path);
        return svg;
      } else {
        shape.setAttribute('x', '3');
        shape.setAttribute('y', '3');
        shape.setAttribute('width', '18');
        shape.setAttribute('height', '18');
        shape.setAttribute('rx', '2');
      }
      svg.appendChild(shape);
      return svg;
    }

    const quote = TEMPLATE.quote || {};
    setText('quote-text', quote.text);
    setText('quote-by', (quote.author || '') + (quote.role ? ' · ' + quote.role : ''));

    const start = TEMPLATE.start || {};
    setText('start-title', start.title);
    fill('start-steps', (start.steps || []).map((step, index) => {
      const item = el('li');
      item.appendChild(el('span', 'start-index', '0' + (index + 1)));
      const body = el('div');

    const code = start.code || {};

    const closing = TEMPLATE.closing || {};

    const footer = TEMPLATE.footer || {};
    setText('footer-brand', footer.brand);
    setText('footer-note', footer.note);
    fill('footer-links', (footer.links || []).map(item => {
      const node = el('a', null, item.label);
      node.href = item.target || '#';
      announce(node);
      return node;
    }));

    // ── 滚动显现 ─────────────────────────────────────────────
    const reveals = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(
        entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-in');
              observer.unobserve(entry.target);
            }
          });
        },
        { rootMargin: '0px 0px -12% 0px', threshold: 0.12 },
      );
      reveals.forEach(node => observer.observe(node));
    } else {
      reveals.forEach(node => node.classList.add('is-in'));
    }

    // ── 指标数字：滚动进入时补间 ─────────────────────────────
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion && 'IntersectionObserver' in window) {
      const counters = new IntersectionObserver(
        entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            counters.unobserve(entry.target);
            const node = entry.target;
            const target = Number(node.dataset.value);
            const decimals = Number(node.dataset.decimals || 0);
            if (!isFinite(target)) return;
            const start = performance.now();
            const duration = 900;
            const tick = now => {
              const progress = Math.min(1, (now - start) / duration);
              const eased = 1 - Math.pow(1 - progress, 3);
              node.textContent = (target * eased).toFixed(decimals);
              if (progress < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
          });
        },
        { threshold: 0.6 },
      );
      Array.prototype.slice.call(document.querySelectorAll('.stat-number')).forEach(node => {
        const raw = node.textContent;
        node.dataset.value = raw;
        node.dataset.decimals = raw.indexOf('.') >= 0 ? String(raw.split('.')[1].length) : '0';
        counters.observe(node);
      });
    }

    // ── 散点 → 网格 → 结果表 ─────────────────────────────────
    const morph = byId('morph');
    const steps = Array.prototype.slice.call(document.querySelectorAll('.step'));
    const DOTS = 56;
    const dots = [];
    const layout = {};

    function measure() {
      const box = morph.getBoundingClientRect();
      layout.width = box.width;
      layout.height = box.height;
    }

    // 用固定种子生成散点，保证每次渲染的截图一致
    let seed = 20260917;
    function random() {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      return seed / 2147483648;
    }

    function buildDots() {
      measure();
      for (let index = 0; index < DOTS; index += 1) {
        const dot = el('span', 'morph-dot');
        morph.appendChild(dot);
        dots.push({
          node: dot,
          scatter: { x: random() * layout.width, y: random() * layout.height },
        });
      }
      paint(0);
    }

    function latticePosition(index) {
      const columns = 8;
      const rows = Math.ceil(DOTS / columns);
      const gapX = layout.width / (columns + 1);
      const gapY = layout.height / (rows + 1);
      return {
        x: gapX * ((index % columns) + 1),
        y: gapY * (Math.floor(index / columns) + 1),
      };
    }

    function paint(stepIndex) {
      measure();
      morph.classList.toggle('is-lattice', stepIndex === 1);
      morph.classList.toggle('is-rows', stepIndex === 2);
      dots.forEach((dot, index) => {
        const target = stepIndex === 0 ? dot.scatter : latticePosition(index);
        dot.node.style.transform = 'translate3d(' + target.x.toFixed(1) + 'px,' + target.y.toFixed(1) + 'px,0)';
      });
    }

    fill('morph-rows', (flow.steps || []).map((step, index) => {
      const row = el('div', 'morph-row');
      row.appendChild(el('span', null, 'step ' + (index + 1)));
      row.appendChild(el('span', 'morph-bar'));
      row.appendChild(el('span', null, '·'));
      return row;
    }));
    const bars = Array.prototype.slice.call(document.querySelectorAll('.morph-bar'));
    bars.forEach((bar, index) => {
      bar.style.width = String(38 + index * 26) + '%';
    });

    function activate(stepIndex) {
      steps.forEach((node, index) => node.classList.toggle('is-active', index === stepIndex));
      paint(stepIndex);
    }

    if ('IntersectionObserver' in window && steps.length) {
      const stepObserver = new IntersectionObserver(
        entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) activate(Number(entry.target.dataset.step || 0));
          });
        },
        { rootMargin: '-42% 0px -42% 0px', threshold: 0 },
      );
      steps.forEach(node => stepObserver.observe(node));
    }

    buildDots();
    window.addEventListener('resize', () => {
      const active = steps.findIndex(node => node.classList.contains('is-active'));
      paint(active < 0 ? 0 : active);
    });

    // ── 首屏流场 ─────────────────────────────────────────────
    (function field() {
      const canvas = byId('field');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const readout = byId('panel-readout');
      const accent = theme.accent || '#2ee6d6';
      // 拖尾层：每帧用画布底色做一次低透明覆盖，粒子轨迹形成余晖
      const trail = 'rgba(11, 13, 16, 0.14)';
      let width = 0;
      let height = 0;
      let particles = [];
      let running = false;
      let frame = 0;
      let animation = 0;
      let lastTime = 0;

      function resize() {
        const box = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = Math.max(1, Math.round(box.width));
        height = Math.max(1, Math.round(box.height));
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        seedParticles();
      }

      function seedParticles() {
        const count = width < 620 ? 190 : 520;
        particles = [];
        for (let index = 0; index < count; index += 1) {
          particles.push({
            x: random() * width,
            y: random() * height,
            life: 40 + random() * 90,
          });
        }
      }

      // 廉价的方向场：两个正弦叠加，足够形成稳定的流线
      function angleAt(x, y, time) {
        const scale = 0.0042;
        return (
          Math.sin(x * scale + time * 0.00016) * 1.5 +
          Math.cos(y * scale * 1.3 - time * 0.00011) * 1.1
        );
      }

      function step(time, delta) {
        const speed = Math.min(3.4, delta * 0.13);
        ctx.lineWidth = 1;
        for (let index = 0; index < particles.length; index += 1) {
          const particle = particles[index];
          const angle = angleAt(particle.x, particle.y, time);
          const nextX = particle.x + Math.cos(angle) * speed;
          const nextY = particle.y + Math.sin(angle) * speed;
          const alpha = 0.16 + 0.46 * (particle.life / 130);
          ctx.strokeStyle = 'rgba(46,230,214,' + alpha.toFixed(3) + ')';
          ctx.beginPath();
          ctx.moveTo(particle.x, particle.y);
          ctx.lineTo(nextX, nextY);
          ctx.stroke();
          particle.x = nextX;
          particle.y = nextY;
          particle.life -= 1;
          if (particle.life <= 0 || nextX < -20 || nextX > width + 20 || nextY < -20 || nextY > height + 20) {
            particle.x = random() * width;
            particle.y = random() * height;
            particle.life = 40 + random() * 90;
          }
        }
      }

      function intensity() {
        return Math.round(width * 2.6 + Math.sin(performance.now() / 900) * 420 + height * 3.1);
      }

      function loop(time) {
        if (!running) return;
        const delta = Math.min(32, time - lastTime || 16);
        lastTime = time;
        // 拖尾：每帧用画布底色做一层低透明度覆盖
        ctx.fillStyle = trail;
        ctx.fillRect(0, 0, width, height);
        step(time, delta);
        frame += 1;
        if (frame % 12 === 0 && readout) readout.textContent = intensity().toLocaleString('en-US');
        animation = requestAnimationFrame(loop);
      }

      function start() {
        if (running) return;
        running = true;
        lastTime = 0;
        animation = requestAnimationFrame(loop);
      }

      function stop() {
        running = false;
        if (animation) cancelAnimationFrame(animation);
      }

      function staticFrame() {
        ctx.fillStyle = trail;
        ctx.fillRect(0, 0, width, height);
        for (let index = 0; index < 90; index += 1) step(0, 16);
        if (readout) readout.textContent = intensity().toLocaleString('en-US');
      }

      resize();
      window.addEventListener('resize', resize);

      if (reduceMotion) {
        staticFrame();
      } else {
        if ('IntersectionObserver' in window) {
          new IntersectionObserver(
            entries => {
              entries.forEach(entry => (entry.isIntersecting ? start() : stop()));
            },
            { threshold: 0.06 },
          ).observe(canvas);
        } else {
          start();
        }
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) stop();
          else if (canvas.getBoundingClientRect().top < window.innerHeight) start();
        });
      }
    })();
  })();
</script>
</body>
</html>
