name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.3.14-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate bundled Skill frontmatter
        run: bun run validate:skills
      - name: Lint
        run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Restore Bun and Electron caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: test-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            test-${{ runner.os }}-1.3.14-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Compile Electron sources used by integration tests
        run: bun run compile:electron
      - name: Run tests
        run: bun run test
      - name: Verify Presentation Studio compiler and validator
        run: |
          npm ci --prefix SKILLs/presentation-studio --ignore-scripts
          npm test --prefix SKILLs/presentation-studio

  bundle-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.3.14-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build renderer bundle
        run: bun run build:vite
        env:
          VITE_SKIP_ELECTRON: '1'
      - name: Enforce renderer bundle budgets
        run: bun run test:bundle-budget
