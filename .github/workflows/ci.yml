name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
  workflow_call:
    secrets:
      MODELSCOPE_TOKENS:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      path-plan: ${{ steps.plan.outputs.path-plan }}
      linux-install: ${{ steps.plan.outputs.linux-install }}
      windows-install: ${{ steps.plan.outputs.windows-install }}
      memory-leak: ${{ steps.plan.outputs.memory-leak }}
      channel-runtime: ${{ steps.plan.outputs.channel-runtime }}
      python-runtime-linux: ${{ steps.plan.outputs.python-runtime-linux }}
      python-runtime-windows: ${{ steps.plan.outputs.python-runtime-windows }}
      installer-preview: ${{ steps.plan.outputs.installer-preview }}
      browser-preview: ${{ steps.plan.outputs.browser-preview }}
      enterprise: ${{ steps.plan.outputs.enterprise }}
      streaming-mutations: ${{ steps.plan.outputs.streaming-mutations }}
      windows-scripts: ${{ steps.plan.outputs.windows-scripts }}
      build-verification: ${{ steps.plan.outputs.build-verification }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Select expensive checks from the complete diff
        id: plan
        run: node scripts/ci/gates/plan.ts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fail on oversized committed binaries in the diff
        run: node scripts/ci/check-large-files.mjs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Fail on oversized hand-written source files
        run: node scripts/ci/check-source-line-limit.mjs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Install checksum-pinned workflow validator
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint/archive.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/archive.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
      - name: Validate workflow syntax and job dependencies
        run: '"$RUNNER_TEMP/actionlint/actionlint" -shellcheck='
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: ./.github/actions/setup-bun-workspace
      - name: Validate bundled Skill frontmatter
        run: bun run validate:skills
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Fail on unused TypeScript files, exports, and dependencies
        run: bun run knip
      - name: Fail on dead Python under scripts/
        run: bun run check:python-dead-code

  electron-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-workspace
      - name: Typecheck Electron without emitting or rebuilding native modules
        run: bun run typecheck:electron

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-workspace
        with:
          include-electron: 'true'
          save-cache: ${{ matrix.shard == 1 && 'true' || 'false' }}
      - name: Install Electron for ABI probe fixtures (no native rebuild)
        run: node node_modules/electron/install.js
      - uses: ./.github/actions/prepare-node-test-native
        with:
          save-cache: ${{ matrix.shard == 1 && 'true' || 'false' }}
      - name: Run tests
        run: bun run test -- --shard=${{ matrix.shard }}/2
      - name: Verify Presentation Studio compiler and validator
        if: matrix.shard == 1
        run: |
          npm ci --prefix SKILLs/presentation-studio --ignore-scripts
          npm test --prefix SKILLs/presentation-studio

  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-workspace
      - name: Restore renderer TypeScript and Vite caches
        id: renderer-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/tsc/renderer.tsbuildinfo
            .cache/vite
          key: renderer-build-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'tsconfig.node.json', 'vite.config.ts', 'bun.lock') }}
          restore-keys: |
            renderer-build-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'tsconfig.node.json', 'vite.config.ts', 'bun.lock') }}-
            renderer-build-${{ runner.os }}-
      - name: Typecheck renderer sources
        run: |
          mkdir -p .cache/tsc
          bun run build:tsc -- --incremental --tsBuildInfoFile .cache/tsc/renderer.tsbuildinfo
      - name: Build renderer bundle
        run: bun run build:vite
        env:
          VITE_SKIP_ELECTRON: '1'
          VITE_CACHE_DIR: .cache/vite
      - name: Enforce renderer bundle budgets
        run: bun run test:bundle-budget
      - name: Save renderer TypeScript and Vite caches
        if: steps.renderer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/tsc/renderer.tsbuildinfo
            .cache/vite
          key: ${{ steps.renderer-cache.outputs.cache-primary-key }}

  enterprise:
    needs: changes
    if: needs.changes.outputs.enterprise == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-workspace
      - name: Typecheck enterprise extension
        run: bun run typecheck:enterprise
      - name: Run enterprise extension tests
        run: bun run test:enterprise
      - name: Build enterprise extension bundle and renderer
        run: bun run build:enterprise
      - name: Verify enterprise extension bundle
        run: bun run verify:enterprise:bundle
      - name: Verify enterprise packaging config
        run: bun run verify:enterprise:packaging-config

  channel-runtime:
    needs: changes
    if: needs.changes.outputs.channel-runtime == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Restore channel runtime download
        id: channel-cache
        uses: actions/cache/restore@v5
        with:
          path: vendor/channel-runtime
          key: channel-runtime-${{ runner.os }}-${{ hashFiles('package.json', 'scripts/download-channel-runtime.cjs') }}
          restore-keys: |
            channel-runtime-${{ runner.os }}-
      - name: Download the pinned channel runtime
        run: npm run channel:runtime:linux-x64
      - name: Verify channel transport and QQ Bot support
        run: npm run channel:runtime:smoke
      - name: Save channel runtime download
        if: steps.channel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: vendor/channel-runtime
          key: ${{ steps.channel-cache.outputs.cache-primary-key }}

  python-runtime-linux:
    needs: changes
    if: needs.changes.outputs.python-runtime-linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HUSKY: '0'
      PYTHON_RUNTIME_INTEGRATION: '1'
      PYTHON_RUNTIME_RUNNER: '${{ github.workspace }}/dist-electron/python-runtime-runner.js'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Bundle the independent Runner
        run: bun build src/main/pythonRuntime/runner.ts --target=node --format=cjs --outfile=dist-electron/python-runtime-runner.js
      - name: Verify pinned Python, isolated packages, rebuild and process cancellation
        run: bun x --no-install vitest run src/main/pythonRuntime/runtime.integration.test.ts --maxWorkers=1

  python-runtime-windows:
    needs: changes
    if: needs.changes.outputs.python-runtime-windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HUSKY: '0'
      PYTHON_RUNTIME_INTEGRATION: '1'
      PYTHON_RUNTIME_RUNNER: '${{ github.workspace }}/dist-electron/python-runtime-runner.js'
      PYTHON_RUNTIME_JOB_HELPER: '${{ github.workspace }}/resources/python-runtime/job-runner.exe'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build actual Job Object helper
        shell: pwsh
        run: ./scripts/python-runtime/build-job-runner.ps1
      - name: Verify descendant containment and parent-death cleanup
        run: node --test scripts/python-runtime/job-runner.test.cjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Bundle the independent Runner
        run: bun build src/main/pythonRuntime/runner.ts --target=node --format=cjs --outfile=dist-electron/python-runtime-runner.js
      - name: Verify Windows standalone Python and real uv wheel environments
        run: bun x --no-install vitest run src/main/pythonRuntime/runtime.integration.test.ts --maxWorkers=1

  browser-preview:
    needs: changes
    if: needs.changes.outputs.browser-preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-workspace
      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run web:preview:codegen:check
      - run: bun run web:preview:stream-replay:codegen:check
      - run: bun run web:preview:contract
      - run: bun run web:preview:check

  installer-preview:
    needs: changes
    if: needs.changes.outputs.installer-preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.58.0-${{ runner.os }}
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ci/installer-style-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-preview-${{ github.run_id }}
          path: acceptance-diagnostics/installer-preview
          retention-days: 7

  memory-leak:
    needs: changes
    if: needs.changes.outputs.memory-leak == 'true'
    uses: ./.github/workflows/memory-regression.yml

  linux-install:
    needs: changes
    if: needs.changes.outputs.linux-install == 'true'
    uses: ./.github/workflows/linux-install-pr.yml
    secrets:
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}

  windows-install:
    needs: changes
    if: needs.changes.outputs.windows-install == 'true'
    uses: ./.github/workflows/windows-installer-pr.yml

  streaming-mutations:
    needs: changes
    if: needs.changes.outputs.streaming-mutations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-workspace
      - uses: ./.github/actions/prepare-node-test-native
        with:
          save-cache: 'false'
      - run: bun run test:streaming-mutations
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: streaming-mutations-${{ github.run_attempt }}
          path: artifacts/streaming-mutations
          retention-days: 7

  windows-scripts:
    needs: changes
    if: needs.changes.outputs.windows-scripts == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-workspace
      - name: Exercise Windows PowerShell 5 gates, diagnostics and native TAR checkpoints
        run: bun x --no-install vitest run scripts/ci/windows-installer-size-smoke.test.ts scripts/ci/windows-diagnostics.test.ts scripts/ci/build-checkpoint.test.ts scripts/ci/windows-shell-uninstall.test.ts scripts/ci/windows-shell-interactive.test.ts scripts/installer-shell/distribution-contracts.test.ts scripts/setup-windows-skill-python.test.ts

  build-verification:
    needs: changes
    if: needs.changes.outputs.build-verification == 'true'
    uses: ./.github/workflows/build-inference-editions.yml
    with:
      mode: verify
      build-macos: false
      build-linux: true
      linux-inference-editions: cpu
      linux-directory-only: true
      build-windows: true
      windows-inference-editions: lite
      fail-fast: false

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      [
        changes,
        lint,
        electron-compile,
        test,
        bundle-budget,
        enterprise,
        channel-runtime,
        python-runtime-linux,
        python-runtime-windows,
        installer-preview,
        browser-preview,
        memory-leak,
        linux-install,
        windows-install,
        streaming-mutations,
        windows-scripts,
        build-verification,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .nvmrc
            scripts/ci/gates
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Require every selected check to succeed
        run: node scripts/ci/gates/verify.ts
        env:
          GATE_PLAN: ${{ needs.changes.outputs.plan }}
          GATE_PATH_PLAN: ${{ needs.changes.outputs.path-plan }}
          GATE_RESULTS: ${{ toJSON(needs) }}
