name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Validate bundled Skill frontmatter
        run: bun run validate:skills
      - name: Enforce retired runtime decoupling
        run: bun run check:openclaw-decoupling
      - name: Lint
        run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore Bun and Electron caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: test-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            test-${{ runner.os }}-1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Compile Electron sources used by integration tests
        run: bun run compile:electron
      - name: Run tests
        run: bun run test
      - name: Verify Presentation Studio compiler and validator
        run: |
          npm ci --prefix SKILLs/presentation-studio --ignore-scripts
          npm test --prefix SKILLs/presentation-studio

  bundle-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Build renderer bundle
        run: bun run build:vite
        env:
          VITE_SKIP_ELECTRON: '1'
      - name: Enforce renderer bundle budgets
        run: bun run test:bundle-budget

  memory-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore Bun and Electron caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
          key: memory-leak-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            memory-leak-${{ runner.os }}-1.4.0-
      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0 xvfb
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Build application for the memory regression scenario
        run: |
          bun run build:vite
          bun run compile:electron
      - name: Run Electron memory regression check
        run: xvfb-run -a bun run test:memory-leak
      - name: Upload heap snapshots when the threshold is exceeded
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: memory-leak-diagnostics
          path: artifacts/memory-leak
          if-no-files-found: error
