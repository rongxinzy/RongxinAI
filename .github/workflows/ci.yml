name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  HUSKY: '0'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fail on oversized committed binaries in the diff
        run: node scripts/ci/check-large-files.mjs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Fail on oversized hand-written source files
        run: node scripts/ci/check-source-line-limit.mjs
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Install checksum-pinned workflow validator
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint/archive.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/archive.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
      - name: Validate workflow syntax and job dependencies
        run: '"$RUNNER_TEMP/actionlint/actionlint" -shellcheck='
      - uses: ./.github/actions/setup-bun-workspace
        with:
          save-cache: 'true'
      - name: Validate bundled Skill frontmatter
        run: bun run validate:skills
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Fail on unused TypeScript files, exports, and dependencies
        run: bun run knip
      - name: Fail on production files reachable only from tests
        run: bun run knip:production
      - name: Fail on dead Python under scripts/
        run: bun run check:python-dead-code

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-workspace
      - uses: ./.github/actions/prepare-node-test-native
        with:
          save-cache: ${{ matrix.shard == 1 && 'true' || 'false' }}
      - name: Run unit tests without building the application
        run: bun run test:unit -- --shard=${{ matrix.shard }}/2
      - name: Run enterprise unit tests
        if: matrix.shard == 2
        run: bun run test:enterprise

  ci-gate:
    name: ci-gate
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .nvmrc
            scripts/ci/gates
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Require lint and every unit test shard to succeed
        run: node scripts/ci/gates/verify.ts
        env:
          GATE_RESULTS: ${{ toJSON(needs) }}
