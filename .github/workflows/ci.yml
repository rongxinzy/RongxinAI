name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      MODELSCOPE_TOKENS:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      linux-install: ${{ steps.plan.outputs.linux-install }}
      windows-install: ${{ steps.plan.outputs.windows-install }}
      memory-leak: ${{ steps.plan.outputs.memory-leak }}
      enterprise: ${{ steps.plan.outputs.enterprise }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Select expensive checks from the complete PR diff
        id: plan
        run: node scripts/ci/gates/plan.ts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install checksum-pinned workflow validator
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint/archive.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint/archive.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
      - name: Validate workflow syntax and job dependencies
        # ShellCheck policy is separate; this gate validates every workflow's
        # YAML, expressions, reusable-workflow inputs and dependency graph.
        run: '"$RUNNER_TEMP/actionlint/actionlint" -shellcheck='
      - uses: ./.github/actions/setup-bun-workspace
        with:
          save-cache: 'true'

      - name: Validate bundled Skill frontmatter
        run: bun run validate:skills
      - name: Enforce retired runtime decoupling
        run: bun run check:openclaw-decoupling
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-workspace
        with:
          cache-prefix: test
          include-electron: 'true'
          save-cache: ${{ matrix.shard == 1 && 'true' || 'false' }}
      - name: Restore Electron TypeScript cache
        id: electron-tsc
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/tsc/electron.tsbuildinfo
            dist-electron
          key: tsc-electron-${{ runner.os }}-${{ hashFiles('electron-tsconfig.json', 'package.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-electron-${{ runner.os }}-${{ hashFiles('electron-tsconfig.json', 'package.json') }}-
            tsc-electron-${{ runner.os }}-
      - name: Compile Electron sources used by integration tests
        run: |
          mkdir -p .cache/tsc
          bun run compile:electron -- --incremental --tsBuildInfoFile .cache/tsc/electron.tsbuildinfo
      - name: Save Electron TypeScript cache
        if: matrix.shard == 1 && steps.electron-tsc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/tsc/electron.tsbuildinfo
            dist-electron
          key: ${{ steps.electron-tsc.outputs.cache-primary-key }}
      - name: Install Electron for native ABI integration tests
        # Dependency lifecycle scripts are disabled above; the ABI probe needs
        # the actual target runtime, rather than a host Node approximation.
        run: node node_modules/electron/install.js
      - name: Run tests
        run: bun run test -- --shard=${{ matrix.shard }}/4
      - name: Verify Presentation Studio compiler and validator
        if: matrix.shard == 1
        run: |
          npm ci --prefix SKILLs/presentation-studio --ignore-scripts
          npm test --prefix SKILLs/presentation-studio

  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun-workspace
      - name: Restore renderer TypeScript and Vite caches
        id: renderer-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/tsc/renderer.tsbuildinfo
            .cache/vite
          key: renderer-build-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'tsconfig.node.json', 'vite.config.ts', 'bun.lock') }}-${{ github.sha }}
          restore-keys: |
            renderer-build-${{ runner.os }}-${{ hashFiles('tsconfig.json', 'tsconfig.node.json', 'vite.config.ts', 'bun.lock') }}-
            renderer-build-${{ runner.os }}-
      - name: Typecheck renderer sources
        run: |
          mkdir -p .cache/tsc
          bun run build:tsc -- --incremental --tsBuildInfoFile .cache/tsc/renderer.tsbuildinfo
      - name: Build renderer bundle
        run: bun run build:vite
        env:
          VITE_SKIP_ELECTRON: '1'
          VITE_CACHE_DIR: .cache/vite
      - name: Enforce renderer bundle budgets
        run: bun run test:bundle-budget
      - name: Save renderer TypeScript and Vite caches
        if: steps.renderer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/tsc/renderer.tsbuildinfo
            .cache/vite
          key: ${{ steps.renderer-cache.outputs.cache-primary-key }}

  enterprise:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Skip enterprise toolchain
        if: needs.changes.outputs.enterprise != 'true'
        run: echo "No enterprise changes; baseline job stays green without an install."
      - uses: actions/checkout@v6
        if: needs.changes.outputs.enterprise == 'true'
      - uses: ./.github/actions/setup-bun-workspace
        if: needs.changes.outputs.enterprise == 'true'
      - name: Typecheck enterprise extension
        if: needs.changes.outputs.enterprise == 'true'
        run: bun run typecheck:enterprise
      - name: Run enterprise extension tests
        if: needs.changes.outputs.enterprise == 'true'
        run: bun run test:enterprise
      - name: Build enterprise extension bundle and renderer
        if: needs.changes.outputs.enterprise == 'true'
        run: bun run build:enterprise
      - name: Verify enterprise extension bundle
        if: needs.changes.outputs.enterprise == 'true'
        run: bun run verify:enterprise:bundle
      - name: Verify enterprise packaging config
        if: needs.changes.outputs.enterprise == 'true'
        run: bun run verify:enterprise:packaging-config

  memory-leak:
    needs: changes
    if: needs.changes.outputs.memory-leak == 'true'
    uses: ./.github/workflows/memory-regression.yml

  linux-install:
    needs: changes
    if: needs.changes.outputs.linux-install == 'true'
    uses: ./.github/workflows/linux-install-pr.yml
    secrets:
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}

  windows-install:
    needs: changes
    if: needs.changes.outputs.windows-install == 'true'
    uses: ./.github/workflows/windows-installer-pr.yml

  merge-gate:
    name: merge-gate
    if: always()
    needs: [changes, lint, test, bundle-budget, enterprise, memory-leak, linux-install, windows-install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: scripts/ci/gates
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Require every selected check to succeed
        run: node scripts/ci/gates/verify.ts
        env:
          GATE_PLAN: ${{ needs.changes.outputs.plan }}
          GATE_RESULTS: ${{ toJSON(needs) }}
