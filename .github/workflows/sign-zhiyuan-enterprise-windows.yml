name: Sign Zhiyuan Enterprise Windows package

# Preserve validation of an unsigned release handoff, but build with the
# maintained in-repository client and its generic installer.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful zhiyuanAaaS unsigned Build Windows enterprise package Actions run ID
        required: true
        type: string
      release_version:
        description: 'Enterprise SemVer matching the unsigned build. Leave empty to read its artifact version.'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: enterprise-certum-signing
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    if: github.repository == 'rongxinzy/RongxinAI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package-version: ${{ steps.source.outputs.package-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - id: source
        name: Validate Zhiyuan Enterprise unsigned package run
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RUNTIME_ARTIFACT_READ_TOKEN: ${{ secrets.AAAS_ARTIFACT_READ_TOKEN || secrets.RUNTIME_ARTIFACT_READ_TOKEN }}
        run: node scripts/enterprise-signing/prepare.mjs
      - name: Record handoff identity
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.source-run-id }}
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
          PACKAGE_VERSION: ${{ steps.source.outputs.package-version }}
        run: |
          {
            echo '### Zhiyuan Enterprise signing handoff'
            echo
            echo "- source run: $SOURCE_RUN_ID"
            echo "- source commit (handoff provenance): $SOURCE_SHA"
            echo "- package version: $PACKAGE_VERSION"
            echo "- client source commit: $GITHUB_SHA"
            echo '- method: maintained in-repository enterprise installer (app + installer signed)'
            echo '- AEP server: configured and persisted by the client at login'
          } >> "$GITHUB_STEP_SUMMARY"

  sign:
    needs: prepare
    uses: ./.github/workflows/enterprise-windows.yml
    with:
      version: v${{ needs.prepare.outputs.package-version }}
      source_ref: ${{ github.sha }}
    secrets: inherit
