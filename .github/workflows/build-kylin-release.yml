name: Build Kylin V11 package (reusable)

on:
  workflow_call:
    inputs:
      source-ref:
        description: Commit, tag, or branch to build
        type: string
        required: true
      app-build-version:
        description: SemVer embedded in the RPM package
        type: string
        required: true
      runner-labels:
        description: JSON array of self-hosted Kylin V11 runner labels
        type: string
        default: '["self-hosted","linux","x64","kylin-v11"]'
    secrets:
      MODELSCOPE_TOKENS:
        required: false
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ZHIYUAN_DEFAULT_LOCALE: zh-CN
  ZHIYUAN_GO_PROXY: https://goproxy.cn,direct
  ZHIYUAN_UPDATE_VARIANT: cpu

jobs:
  kylin-v11-rpm:
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}

      - name: Verify Kylin V11 x86_64 runner
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          [[ "$arch" == "x86_64" ]] || {
            echo "Kylin V11 package requires x86_64, got $arch" >&2
            exit 1
          }
          source /etc/os-release
          [[ "${ID:-}" == "kylin" && "${VERSION_ID:-}" == "V11" ]] || {
            echo "Expected Kylin V11, got ${PRETTY_NAME:-unknown}" >&2
            exit 1
          }

      - name: Install builder dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo_cmd=()
          if [[ "$(id -u)" -ne 0 ]]; then sudo_cmd=(sudo); fi
          "${sudo_cmd[@]}" dnf install -y \
            at-spi2-core ca-certificates curl file gcc-c++ git gtk3 make \
            libnotify libsecret libXScrnSaver libXtst libuuid mesa-libgbm nss \
            python3 rpm-build tar unzip xdg-utils xorg-x11-server-Xvfb

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile --ignore-scripts --backend copyfile

      - name: Apply project patches
        run: bun run apply:patches

      - name: Read pinned Magpie Go toolchain
        id: magpie-toolchain
        run: >-
          node -e "const p=require('./resources/magpie/upstream.json');
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT,
          'go-version='+p.goVersion.replace(/^go/,'')+'\n')"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.magpie-toolchain.outputs.go-version }}
          cache: false

      - name: Build and verify pinned Magpie gateway
        run: |
          set -euo pipefail
          go version | grep -Fq "go${{ steps.magpie-toolchain.outputs.go-version }}"
          for attempt in 1 2 3; do
            if bun run magpie:build -- --target linux-x64; then
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Magpie build failed after $attempt attempts" >&2
              exit 1
            fi
            echo "Magpie build attempt $attempt failed; retrying in 15 seconds..." >&2
            sleep 15
          done
          bun run magpie:verify -- --target linux-x64

      - name: Prepare Kylin runtimes
        run: |
          set -euo pipefail
          bash scripts/ci/with-download-retries.sh bun run setup:posix-uv-runtime
          bash scripts/ci/with-download-retries.sh bun run setup:posix-python-runtime

      - name: Configure Kylin llama.cpp runtime mirror
        shell: bash
        run: |
          node -e "const fs=require('node:fs'); const p=require('./package.json');
          const repo=p.llamacpp.runtimeRepo.replace(/^https:\/\/github\.com\//,'').replace(/\.git$/,'');
          const base='https://gh-proxy.com/https://github.com/'+repo+'/releases/download/'+p.llamacpp.runtimeReleaseTag;
          fs.appendFileSync(process.env.GITHUB_ENV, 'LLAMACPP_RUNTIME_BASE_URL='+base+'\n')"

      - name: Build Kylin V11 RPM package
        env:
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: bun run dist:kylin:x64

      - name: Verify Kylin V11 RPM package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rpms=(release/*.rpm)
          [[ ${#rpms[@]} -eq 1 ]] || {
            echo "Expected exactly one Kylin V11 RPM package, found ${#rpms[@]}" >&2
            exit 1
          }
          rpm -qip "${rpms[0]}"
          rpm -qlp "${rpms[0]}" | grep -Fq '/opt/'
          mkdir -p kylin-assets
          cp "${rpms[0]}" kylin-assets/
          (
            cd kylin-assets
            sha256sum ./*.rpm > SHA256SUMS
          )

      - name: Upload Kylin V11 RPM package
        uses: actions/upload-artifact@v6
        with:
          name: kylin-v11-x64-rpm
          path: kylin-assets/*
          if-no-files-found: error
          retention-days: 14
