name: Test Artifact Upload

on:
  workflow_dispatch:
    inputs:
      artifact_repo:
        description: 'JFrog target repository'
        required: true
        default: 'generic-local'
        type: string
      artifact_path:
        description: 'Remote path in JFrog (e.g. ci-test/rongxin-ai/test.txt)'
        required: true
        default: 'ci-test/rongxin-ai/test-artifact.txt'
        type: string
  push:
    branches: [main, develop]
    paths:
      - 'scripts/upload-artifact.cjs'
      - '.github/workflows/test-artifact-upload.yml'
      - 'certs/headscale.crt'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  upload-to-jfrog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          # Ubuntu runners may have tailscale pre-installed; ensure latest
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Import Headscale Certificate
        run: |
          sudo cp certs/headscale.crt /usr/local/share/ca-certificates/headscale.crt
          sudo update-ca-certificates
          grep -c "headscale" /etc/ssl/certs/ca-certificates.crt || true

      - name: Start Tailscale VPN
        env:
          VPN_KEY: ${{ secrets.VPN_KEY }}
        run: |
          # Go programs need explicit env vars to find custom CA certs
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          export SSL_CERT_DIR=/etc/ssl/certs

          # Cleanup any stale tailscaled (GH runners often have one pre-installed)
          echo "Stopping existing tailscaled..."
          sudo systemctl stop tailscaled 2>/dev/null || true
          sudo systemctl disable tailscaled 2>/dev/null || true
          sudo pkill -9 tailscaled 2>/dev/null || true
          sleep 2
          sudo rm -f /var/run/tailscale/tailscaled.sock
          sudo rm -rf /var/lib/tailscale/*

          echo "Starting tailscaled in userspace networking mode..."
          sudo nohup tailscaled \
            --tun=userspace-networking \
            --socks5-server=localhost:1055 \
            --outbound-http-proxy-listen=localhost:1056 \
            --no-logs-no-support \
            > /tmp/tailscaled.log 2>&1 &
          TAILSCALED_PID=$!
          echo "tailscaled PID: $TAILSCALED_PID"

          # Wait for socket to appear
          for i in $(seq 1 15); do
            if [ -S /var/run/tailscale/tailscaled.sock ]; then
              echo "Socket ready at attempt $i"
              break
            fi
            echo "Waiting for tailscaled socket... ($i/15)"
            sleep 1
          done

          echo "=== tailscaled initial logs ==="
          cat /tmp/tailscaled.log || true

          echo "Running tailscale up..."
          sudo -E tailscale up \
            --login-server=https://headscale.wystarry.com:9443/ \
            --accept-routes \
            --auth-key "$VPN_KEY" \
            --hostname="github-actions-${{ github.run_id }}" \
            --timeout=60s

          echo "Waiting for BackendState=Running..."
          for i in $(seq 1 15); do
            STATE=$(sudo tailscale status --json 2>/dev/null | grep -o '"BackendState" *: *"[^"]*"' | grep -o '"[^"]*"$' | tr -d '"' || true)
            echo "Attempt $i/15: BackendState=$STATE"
            if [ "$STATE" = "Running" ]; then
              echo "Tailscale is Running!"
              break
            fi
            sleep 2
          done

          echo "=== Tailscale Status ==="
          sudo tailscale status || true
          echo "=== Tailscale IPs ==="
          sudo tailscale ip -4 || true

      - name: Verify VPN Connectivity
        run: |
          PROXY="socks5h://localhost:1055"
          echo "Testing SOCKS5 proxy ($PROXY) connectivity..."

          # Test proxy itself
          curl -sS --connect-timeout 5 --proxy "$PROXY" http://100.100.100.100 2>&1 | head -5 || true

          # Test JFrog reachability through proxy
          echo "Testing JFrog via VPN proxy..."
          curl -sS --connect-timeout 15 --proxy "$PROXY" \
            -u "${{ secrets.FROG_NAME }}:${{ secrets.FROG_PW }}" \
            http://172.18.5.249:8081/artifactory/api/repositories || {
              echo "Warning: JFrog API check returned non-zero"
            }

          echo "=== tailscaled logs ==="
          cat /tmp/tailscaled.log || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Generate Test Artifact
        run: |
          mkdir -p dist
          cat > dist/test-artifact.txt <<EOF
          Test artifact generated by RongxinAI CI
          =========================================
          Timestamp (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)
          GitHub Run ID:   ${{ github.run_id }}
          Workflow:        ${{ github.workflow }}
          Repository:      ${{ github.repository }}
          Commit SHA:      ${{ github.sha }}
          Ref:             ${{ github.ref }}
          Actor:           ${{ github.actor }}
          EOF
          echo "Generated artifact:"
          cat dist/test-artifact.txt

      - name: Upload Artifact to JFrog
        env:
          FROG_NAME: ${{ secrets.FROG_NAME }}
          FROG_PW: ${{ secrets.FROG_PW }}
          ALL_PROXY: socks5h://localhost:1055
        run: |
          REPO="${{ inputs.artifact_repo || 'generic-local' }}"
          REMOTE_PATH="${{ inputs.artifact_path || 'ci-test/rongxin-ai/test-artifact-${{ github.run_id }}.txt' }}"
          echo "Uploading to repo=$REPO remote=$REMOTE_PATH"
          node scripts/upload-artifact.cjs dist/test-artifact.txt "$REMOTE_PATH" "$REPO"
