name: Build Windows release (staged)

# Release-mode Windows pipeline: prepare/restore cached runtimes, authenticate
# Certum SimplySign with TOTP window alignment and automatic retries, build and
# sign lite/cuda installers in one session, and upload release candidates.

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      app-build-version:
        required: true
        type: string
      include-modelscope-token:
        description: Pass the optional legacy token to packaging processes
        type: boolean
        default: true
      enterprise-extension:
        description: Add the enterprise extension and product identity to the shared installer
        type: boolean
        default: false
    secrets:
      CERTUM_USER_ID:
        required: true
      CERTUM_OTP_URI:
        required: true
      CERTUM_CERT_THUMBPRINT:
        required: true
      UPDATE_MANIFEST_KEY_ID:
        required: true
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64:
        required: true
      MODELSCOPE_TOKENS:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-release:
    outputs:
      commit: ${{ steps.source-commit.outputs.commit }}
    runs-on: windows-2022
    environment: release
    timeout-minutes: 180
    env:
      ZHIYUAN_ENTERPRISE_BUILD: ${{ inputs.enterprise-extension && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
      - name: Resolve immutable source commit
        id: source-commit
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ZHIYUAN_SOURCE_COMMIT=$commit" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            resources/uv-win
            resources/python-win
            resources/skill-python
            vendor/engram-runtime
            vendor/channel-runtime
            build-tar/windows-components
          key: copy-v2-packaging-Windows-win-x64-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'SKILLs/**/requirements.txt', 'scripts/setup-*runtime*.js', 'scripts/windows-resource-pack.cjs') }}
          restore-keys: |
            copy-v2-packaging-Windows-win-x64-node24-bun1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts --backend copyfile
      - run: bun run apply:patches
      - name: Verify optional enterprise extension
        if: ${{ inputs.enterprise-extension }}
        run: |
          bun run typecheck:enterprise
          bun run test:enterprise
          bun run build:enterprise
          bun run verify:enterprise:bundle
      - name: Read pinned Magpie Go toolchain
        id: magpie-toolchain
        run: node -e "const p=require('./resources/magpie/upstream.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'go-version='+p.goVersion.replace(/^go/,'')+'\n')"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.magpie-toolchain.outputs.go-version }}
          cache: false
      - name: Cache Magpie module and build scratch
        uses: actions/cache@v5
        with:
          path: |
            .cache/magpie
            resources/magpie
          key: magpie-Windows-win-x64-go${{ steps.magpie-toolchain.outputs.go-version }}-${{ hashFiles('resources/magpie/upstream.json', 'scripts/build-magpie-runtime.cjs', 'scripts/magpie-runtime.cjs') }}
      - name: Build and verify pinned Magpie gateway
        env:
          MAGPIE_TARGET: win32-x64
        run: |
          bun run magpie:build -- --target win32-x64
          bun run magpie:verify -- --target win32-x64
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
          bun run engram:runtime:win-x64
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and verify the Windows Python job helper
        shell: pwsh
        run: |
          ./scripts/python-runtime/build-job-runner.ps1
          node --test scripts/python-runtime/job-runner.test.cjs
      - name: Connect Certum SimplySign
        id: certum-signing
        uses: ./.github/actions/setup-certum-signing
        with:
          user-id: ${{ secrets.CERTUM_USER_ID }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certificate-thumbprint: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      - name: Build signed Windows core (lite)
        run: node scripts/build-windows.cjs --signed ${{ inputs.enterprise-extension && '--enterprise' || '' }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ inputs.include-modelscope-token && secrets.MODELSCOPE_TOKENS || '' }}

      - name: Seal the signed Lite rehearsal installer
        shell: pwsh
        env:
          THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          SOURCE_COMMIT: ${{ steps.source-commit.outputs.commit }}
        run: |
          $product = (node scripts/packaging/windows-product.cjs) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve installer product' }
          $setup = Get-ChildItem release -Filter 'ZhiYuanAgent-Setup-*.exe' -File
          if (@($setup).Count -ne 1) { throw 'Expected one signed Lite setup' }
          $app = Get-Item (Join-Path release "win-unpacked/$($product.executableName)")
          foreach ($file in @($setup, $app)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:THUMBPRINT) {
              throw "Signature verification failed for $($file.Name): $($signature.Status)"
            }
          }
          @{
            sourceCommit = $env:SOURCE_COMMIT
            candidateVersion = '${{ inputs.app-build-version }}'
            installer = $setup.Name
            installerSha256 = (Get-FileHash -LiteralPath $setup.FullName).Hash.ToLowerInvariant()
            app = $app.Name
            appSha256 = (Get-FileHash -LiteralPath $app.FullName).Hash.ToLowerInvariant()
            asarSha256 = (Get-FileHash -LiteralPath release/win-unpacked/resources/app.asar).Hash.ToLowerInvariant()
            thumbprint = $env:THUMBPRINT
          } | ConvertTo-Json | Set-Content release/python-signed-rehearsal.json -Encoding utf8
      - name: Upload the signed installer for the isolated upgrade rehearsal
        uses: actions/upload-artifact@v6
        with:
          name: windows-python-signed-lite
          path: |
            release/ZhiYuanAgent-Setup-*.exe
            release/python-signed-rehearsal.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
