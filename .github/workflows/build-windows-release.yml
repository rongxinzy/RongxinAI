name: Build Windows release (staged)

# Release-mode Windows pipeline: compile/sign the application once (lite core),
# build CUDA llama-server on windows-2022, then package/sign each edition's
# metadata and components in one Certum session. Acceptance runs in parallel.

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      app-build-version:
        required: true
        type: string
    secrets:
      CERTUM_USER_ID:
        required: true
      CERTUM_OTP_URI:
        required: true
      CERTUM_CERT_THUMBPRINT:
        required: true
      UPDATE_MANIFEST_KEY_ID:
        required: true
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64:
        required: true
      MODELSCOPE_TOKENS:
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cuda-runtime:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - uses: ./.github/actions/prepare-windows-cuda
      - uses: actions/upload-artifact@v6
        with:
          name: windows-cuda-runtime-${{ inputs.app-build-version }}
          path: vendor/llamacpp/cuda
          retention-days: 2

  windows-release:
    needs: cuda-runtime
    runs-on: windows-latest
    environment: release
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
      - name: Resolve immutable source commit
        id: source-commit
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ZHIYUAN_SOURCE_COMMIT=$commit" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: packaging-Windows-win-x64-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'scripts/**') }}
          restore-keys: |
            packaging-Windows-win-x64-node24-bun1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Read pinned Magpie Go toolchain
        id: magpie-toolchain
        run: node -e "const p=require('./resources/magpie/upstream.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'go-version='+p.goVersion.replace(/^go/,'')+'\n')"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.magpie-toolchain.outputs.go-version }}
          cache: false
      - name: Cache Magpie module and build scratch
        uses: actions/cache@v5
        with:
          path: |
            .cache/magpie
            resources/magpie
          key: magpie-Windows-win-x64-go${{ steps.magpie-toolchain.outputs.go-version }}-${{ hashFiles('resources/magpie/upstream.json', 'scripts/build-magpie-runtime.cjs', 'scripts/magpie-runtime.cjs') }}
      - name: Build and verify pinned Magpie gateway
        env:
          MAGPIE_TARGET: win32-x64
        run: |
          bun run magpie:build -- --target win32-x64
          bun run magpie:verify -- --target win32-x64
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
          bun run engram:runtime:win-x64
      - run: node scripts/sync-vendor-llamacpp-cpu-edition.cjs
        env:
          LLAMACPP_CPU_TARGET_ID: win-x64
      - name: Download CUDA runtime bundle
        uses: actions/download-artifact@v8
        with:
          name: windows-cuda-runtime-${{ inputs.app-build-version }}
          path: vendor/llamacpp/cuda
      - name: Connect Certum SimplySign
        id: certum-signing
        uses: ./.github/actions/setup-certum-signing
        with:
          user-id: ${{ secrets.CERTUM_USER_ID }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certificate-thumbprint: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      - name: Build signed Windows core (lite)
        run: bun run dist:win:signed
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Export public signing identity for independent acceptance
        shell: powershell
        env:
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
        run: |
          . ./scripts/ci/windows-signing-certificate.ps1
          $certificate = Resolve-WindowsSigningCertificate -ExpectedThumbprint $env:CERTUM_CERT_THUMBPRINT
          [IO.File]::WriteAllBytes((Join-Path $PWD 'release/signing-certificate.cer'), $certificate.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
      - uses: ./.github/actions/verify-windows-compression
        with:
          artifact-suffix: windows-common-${{ github.run_id }}
      - name: Assemble Windows release payloads (lite, cpu, cuda)
        shell: bash
        run: |
          set -euo pipefail
          assemble_bundle() {
            local edition="$1"
            local out_dir="bundle-win32-x64-${edition}"
            mkdir -p "$out_dir"
            shopt -s nullglob
            local installers=(release/ZhiYuanAgent-Setup-*.exe)
            local updaters=()
            local file
            for file in release/*.exe; do
              [[ "$(basename "$file")" == ZhiYuanAgent-Setup-* ]] || updaters+=("$file")
            done
            local blockmaps=(release/*.exe.blockmap)
            local metadata="release/electron-updater/latest.yml"
            [[ "$edition" != "lite" ]] && metadata="release/electron-updater/latest-${edition}.yml"
            node scripts/release/normalize-electron-updater-metadata.mjs \
              '${{ inputs.app-build-version }}' win32 x64 "$edition" \
              release/latest.yml "$metadata"
            node scripts/release/create-release-candidate.mjs \
              '${{ inputs.app-build-version }}' \
              '${{ steps.source-commit.outputs.commit }}' \
              '${{ github.run_id }}' "$out_dir" "candidate-win32-x64-${edition}.json" \
              "${installers[0]}:win32:x64:${edition}:installer" \
              "${updaters[0]}:win32:x64:${edition}:updater" \
              "${blockmaps[0]}:win32:x64:${edition}:blockmap" \
              "${metadata}:win32:x64:${edition}:metadata"
            paths=(release package.json build-tar/windows-components scripts/installer-shell/out "$out_dir")
            if [[ "$edition" != lite ]]; then paths+=(resources/llamacpp-bundled); fi
            node scripts/ci/build-checkpoint.mjs create "checkpoint-${edition}" "win32-x64-${edition}" "${paths[@]}"
          }
          assemble_bundle lite
          node scripts/release/windows/assemble-windows-edition.cjs cpu
          assemble_bundle cpu
          node scripts/release/windows/assemble-windows-edition.cjs cuda
          assemble_bundle cuda
        env:
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - uses: actions/upload-artifact@v6
        with:
          name: windows-package-lite-${{ github.run_id }}
          path: checkpoint-lite/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: windows-package-cpu-${{ github.run_id }}
          path: checkpoint-cpu/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v6
        with:
          name: windows-package-cuda-${{ github.run_id }}
          path: checkpoint-cuda/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  acceptance:
    needs: windows-release
    strategy:
      fail-fast: false
      matrix:
        edition: [lite, cpu, cuda]
    runs-on: windows-latest
    environment: release
    timeout-minutes: 90
    env:
      APP_BUILD_VERSION: ${{ inputs.app-build-version }}
      ZHIYUAN_UPDATE_VARIANT: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
      - name: Resolve immutable source commit
        shell: bash
        run: echo "ZHIYUAN_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-bun-workspace
      - uses: actions/download-artifact@v8
        with:
          name: windows-package-${{ matrix.edition }}-${{ github.run_id }}
          path: package-checkpoint
      - name: Restore and verify the exact edition package
        run: node scripts/ci/build-checkpoint.mjs restore package-checkpoint 'win32-x64-${{ matrix.edition }}'
      - name: Verify Windows Authenticode signatures
        shell: powershell
        run: >-
          ./scripts/ci/verify-windows-authenticode.ps1
          -ProjectRoot '${{ github.workspace }}'
          -ExpectedThumbprint '${{ secrets.CERTUM_CERT_THUMBPRINT }}'
          -CertificatePath 'release/signing-certificate.cer'
      - name: Verify packaged ACP registry and bridges
        run: node scripts/ci/verify-packaged-acp-resources.mjs
      - name: Verify packaged release version
        run: node scripts/ci/verify-packaged-app-version.mjs '${{ inputs.app-build-version }}'
      - name: Measure Windows release without size ceilings
        shell: powershell
        run: ./scripts/ci/windows-installer-size-smoke.ps1 -ProjectRoot '${{ github.workspace }}'
      - name: Verify Windows package runtimes with a clean PATH
        shell: powershell
        run: ./scripts/ci/windows-runtime-smoke.ps1 -ProjectRoot '${{ github.workspace }}'
      - name: Verify the shared compression qualification against this package
        run: node scripts/ci/compression-qualification.cjs verify
      - name: Prepare isolated native uninstall acceptance
        id: ownership
        shell: powershell
        run: ./scripts/ci/windows-shell-uninstall.ps1 -Action prepare
      - name: Verify Windows cold install, cache-hit upgrade, and uninstall
        shell: powershell
        run: ./scripts/ci/windows-installer-smoke.ps1 -ProjectRoot '${{ github.workspace }}'
      - name: Verify final signed WebView2 installer and bind evidence
        id: shell-evidence
        if: ${{ !cancelled() && steps.ownership.outcome == 'success' }}
        shell: pwsh
        run: |
          node scripts/ci/windows-shell-interactive.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Signed shell interactive acceptance failed.' }
          $installer = @(Get-ChildItem -LiteralPath release -Filter 'ZhiYuanAgent-Setup-*.exe' -File)
          if ($installer.Count -ne 1) { throw 'Expected exactly one signed shell installer.' }
          $installed = Join-Path $env:RUNNER_TEMP 'zhiyuan-shell-acceptance/安装路径/知远.exe'
          node scripts/ci/windows-shell-evidence.mjs acceptance-diagnostics/shell-interactive $installer[0].FullName $installed
          if ($LASTEXITCODE -ne 0) { throw 'Signed shell evidence is invalid.' }
      - name: Verify signed native uninstall preserves user data
        if: ${{ !cancelled() && steps.shell-evidence.outcome == 'success' }}
        shell: powershell
        env:
          EXPECTED_THUMBPRINT: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
        run: ./scripts/ci/windows-shell-uninstall.ps1 -Action verify -ExpectedThumbprint $env:EXPECTED_THUMBPRINT
      - name: Collect Windows diagnostics
        if: always()
        shell: powershell
        run: ./scripts/ci/collect-windows-diagnostics.ps1
      - name: Upload signed shell acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: signed-shell-acceptance-win32-x64-${{ matrix.edition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-diagnostics
          if-no-files-found: error
          retention-days: 14
      - name: Upload accepted Windows release payload
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ inputs.app-build-version }}-win32-x64-${{ matrix.edition }}
          path: bundle-win32-x64-${{ matrix.edition }}/
          if-no-files-found: error
          retention-days: 14
