name: Build Windows release (staged)

# Release-mode Windows pipeline: prepare/restore cached runtimes, authenticate
# Certum SimplySign with TOTP window alignment and automatic retries, build and
# sign lite/cpu/cuda installers in one session, and upload release candidates.

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      app-build-version:
        required: true
        type: string
      enterprise-extension:
        description: Add the enterprise extension and product identity to the shared installer
        type: boolean
        default: false
    secrets:
      CERTUM_USER_ID:
        required: true
      CERTUM_OTP_URI:
        required: true
      CERTUM_CERT_THUMBPRINT:
        required: true
      UPDATE_MANIFEST_KEY_ID:
        required: true
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64:
        required: true
      MODELSCOPE_TOKENS:
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-release:
    runs-on: windows-2022
    environment: release
    timeout-minutes: 180
    env:
      ZHIYUAN_ENTERPRISE_BUILD: ${{ inputs.enterprise-extension && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
      - name: Resolve immutable source commit
        id: source-commit
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ZHIYUAN_SOURCE_COMMIT=$commit" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            resources/mingit
            resources/uv-win
            resources/python-win
            resources/skill-python
            vendor/engram-runtime
            vendor/channel-runtime
            build-tar/windows-components
          key: packaging-Windows-win-x64-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'SKILLs/**/requirements.txt', 'scripts/setup-*runtime*.js', 'scripts/windows-resource-pack.cjs') }}
          restore-keys: |
            packaging-Windows-win-x64-node24-bun1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Verify optional enterprise extension
        if: ${{ inputs.enterprise-extension }}
        run: |
          bun run typecheck:enterprise
          bun run test:enterprise
          bun run build:enterprise
          bun run verify:enterprise:bundle
      - name: Read pinned Magpie Go toolchain
        id: magpie-toolchain
        run: node -e "const p=require('./resources/magpie/upstream.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'go-version='+p.goVersion.replace(/^go/,'')+'\n')"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.magpie-toolchain.outputs.go-version }}
          cache: false
      - name: Cache Magpie module and build scratch
        uses: actions/cache@v5
        with:
          path: |
            .cache/magpie
            resources/magpie
          key: magpie-Windows-win-x64-go${{ steps.magpie-toolchain.outputs.go-version }}-${{ hashFiles('resources/magpie/upstream.json', 'scripts/build-magpie-runtime.cjs', 'scripts/magpie-runtime.cjs') }}
      - name: Build and verify pinned Magpie gateway
        env:
          MAGPIE_TARGET: win32-x64
        run: |
          bun run magpie:build -- --target win32-x64
          bun run magpie:verify -- --target win32-x64
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
          bun run engram:runtime:win-x64
      - run: node scripts/sync-vendor-llamacpp-cpu-edition.cjs
        if: ${{ !inputs.enterprise-extension }}
        env:
          LLAMACPP_CPU_TARGET_ID: win-x64
      - uses: ./.github/actions/prepare-windows-cuda
        if: ${{ !inputs.enterprise-extension }}
      - name: Connect Certum SimplySign
        id: certum-signing
        uses: ./.github/actions/setup-certum-signing
        with:
          user-id: ${{ secrets.CERTUM_USER_ID }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certificate-thumbprint: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      - name: Build signed Windows core (lite)
        run: node scripts/build-windows.cjs --signed ${{ inputs.enterprise-extension && '--enterprise' || '' }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Verify shared Windows installer
        uses: ./.github/actions/verify-windows-package
        with:
          certificate-thumbprint: ${{ steps.certum-signing.outputs.thumbprint }}
      - name: Verify optional packaged enterprise extension
        if: ${{ inputs.enterprise-extension }}
        env:
          ZHIYUAN_ELECTRON_PACKAGE_DIR: release/win-unpacked
          ZHIYUAN_REQUIRE_ELECTRON_PACKAGE: '1'
          ZHIYUAN_ELECTRON_RC_EVIDENCE_FILE: release/electron-rc-evidence.json
        run: |
          node enterprise/scripts/verify-electron-package.mjs
          node enterprise/scripts/verify-electron-rc.mjs
          node enterprise/scripts/verify-release-artifacts.mjs
      - name: Upload enterprise Windows installer
        if: ${{ inputs.enterprise-extension }}
        uses: actions/upload-artifact@v6
        with:
          name: zhiyuan-enterprise-windows-${{ inputs.app-build-version }}-${{ github.run_number }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/*.exe.manifest.json
            release/electron-rc-evidence.json
            acceptance-diagnostics/
          if-no-files-found: error
          retention-days: 14
      - name: Assemble Windows release payloads (lite, cpu, cuda)
        if: ${{ !inputs.enterprise-extension }}
        shell: bash
        run: |
          set -euo pipefail
          assemble_bundle() {
            local edition="$1"
            local out_dir="bundle-win32-x64-${edition}"
            mkdir -p "$out_dir"
            shopt -s nullglob
            local installers=(release/ZhiYuanAgent-Setup-*.exe)
            local updaters=()
            local file
            for file in release/*.exe; do
              [[ "$(basename "$file")" == ZhiYuanAgent-Setup-* ]] || updaters+=("$file")
            done
            local blockmaps=(release/*.exe.blockmap)
            local metadata="release/electron-updater/${edition}/latest.yml"
            mkdir -p "release/electron-updater/${edition}"
            node scripts/release/normalize-electron-updater-metadata.mjs \
              '${{ inputs.app-build-version }}' win32 x64 "$edition" \
              release/latest.yml "$metadata"
            node scripts/release/create-release-candidate.mjs \
              '${{ inputs.app-build-version }}' \
              '${{ steps.source-commit.outputs.commit }}' \
              '${{ github.run_id }}' "$out_dir" "candidate-win32-x64-${edition}.json" \
              "${installers[0]}:win32:x64:${edition}:installer" \
              "${updaters[0]}:win32:x64:${edition}:updater" \
              "${blockmaps[0]}:win32:x64:${edition}:blockmap" \
              "${metadata}:win32:x64:${edition}:metadata"
          }
          assemble_bundle lite
          node scripts/release/windows/assemble-windows-edition.cjs cpu
          assemble_bundle cpu
          node scripts/release/windows/assemble-windows-edition.cjs cuda
          assemble_bundle cuda
        env:
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Upload Windows lite release candidate
        if: ${{ !inputs.enterprise-extension }}
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ inputs.app-build-version }}-win32-x64-lite
          path: bundle-win32-x64-lite/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows cpu release candidate
        if: ${{ !inputs.enterprise-extension }}
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ inputs.app-build-version }}-win32-x64-cpu
          path: bundle-win32-x64-cpu/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows cuda release candidate
        if: ${{ !inputs.enterprise-extension }}
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ inputs.app-build-version }}-win32-x64-cuda
          path: bundle-win32-x64-cuda/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Windows packaging diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-package-diagnostics-${{ inputs.enterprise-extension && 'enterprise' || 'community' }}-${{ github.run_number }}
          path: |
            acceptance-diagnostics/
            release/*.exe
            scripts/installer-shell/out/*.manifest.json
            scripts/installer-shell/out/setup-size.json
            ${{ runner.temp }}/zhiyuan-build-logs
          if-no-files-found: ignore
          retention-days: 7
