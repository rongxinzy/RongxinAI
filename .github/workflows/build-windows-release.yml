name: Build Windows release (staged)

# Release-mode Windows pipeline: prepare/restore cached runtimes, authenticate
# Certum SimplySign with TOTP window alignment and automatic retries, build and
# sign lite/cpu/cuda installers in one session, and upload release candidates.

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
      app-build-version:
        required: true
        type: string
      enterprise-extension:
        description: Add the enterprise extension and product identity to the shared installer
        type: boolean
        default: false
    secrets:
      CERTUM_USER_ID:
        required: true
      CERTUM_OTP_URI:
        required: true
      CERTUM_CERT_THUMBPRINT:
        required: true
      UPDATE_MANIFEST_KEY_ID:
        required: true
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64:
        required: true
      MODELSCOPE_TOKENS:
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-release:
    outputs:
      commit: ${{ steps.source-commit.outputs.commit }}
    runs-on: windows-2022
    environment: release
    timeout-minutes: 180
    env:
      ZHIYUAN_ENTERPRISE_BUILD: ${{ inputs.enterprise-extension && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref }}
      - name: Resolve immutable source commit
        id: source-commit
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ZHIYUAN_SOURCE_COMMIT=$commit" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            resources/mingit
            resources/uv-win
            resources/python-win
            resources/skill-python
            vendor/engram-runtime
            vendor/channel-runtime
            build-tar/windows-components
          key: packaging-Windows-win-x64-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'SKILLs/**/requirements.txt', 'scripts/setup-*runtime*.js', 'scripts/windows-resource-pack.cjs') }}
          restore-keys: |
            packaging-Windows-win-x64-node24-bun1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Verify optional enterprise extension
        if: ${{ inputs.enterprise-extension }}
        run: |
          bun run typecheck:enterprise
          bun run test:enterprise
          bun run build:enterprise
          bun run verify:enterprise:bundle
      - name: Read pinned Magpie Go toolchain
        id: magpie-toolchain
        run: node -e "const p=require('./resources/magpie/upstream.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'go-version='+p.goVersion.replace(/^go/,'')+'\n')"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.magpie-toolchain.outputs.go-version }}
          cache: false
      - name: Cache Magpie module and build scratch
        uses: actions/cache@v5
        with:
          path: |
            .cache/magpie
            resources/magpie
          key: magpie-Windows-win-x64-go${{ steps.magpie-toolchain.outputs.go-version }}-${{ hashFiles('resources/magpie/upstream.json', 'scripts/build-magpie-runtime.cjs', 'scripts/magpie-runtime.cjs') }}
      - name: Build and verify pinned Magpie gateway
        env:
          MAGPIE_TARGET: win32-x64
        run: |
          bun run magpie:build -- --target win32-x64
          bun run magpie:verify -- --target win32-x64
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
          bun run engram:runtime:win-x64
      - run: node scripts/sync-vendor-llamacpp-cpu-edition.cjs
        if: ${{ !inputs.enterprise-extension }}
        env:
          LLAMACPP_CPU_TARGET_ID: win-x64
      - uses: ./.github/actions/prepare-windows-cuda
        if: ${{ !inputs.enterprise-extension }}
      - name: Connect Certum SimplySign
        id: certum-signing
        uses: ./.github/actions/setup-certum-signing
        with:
          user-id: ${{ secrets.CERTUM_USER_ID }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certificate-thumbprint: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      - name: Build signed Windows core (lite)
        run: node scripts/build-windows.cjs --signed ${{ inputs.enterprise-extension && '--enterprise' || '' }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Verify shared Windows installer
        if: ${{ inputs.enterprise-extension }}
        uses: ./.github/actions/verify-windows-package
        with:
          certificate-thumbprint: ${{ steps.certum-signing.outputs.thumbprint }}
      - name: Verify optional packaged enterprise extension
        if: ${{ inputs.enterprise-extension }}
        env:
          ZHIYUAN_ELECTRON_PACKAGE_DIR: release/win-unpacked
          ZHIYUAN_REQUIRE_ELECTRON_PACKAGE: '1'
          ZHIYUAN_ELECTRON_RC_EVIDENCE_FILE: release/electron-rc-evidence.json
        run: |
          node enterprise/scripts/verify-electron-package.mjs
          node enterprise/scripts/verify-electron-rc.mjs
          node enterprise/scripts/verify-release-artifacts.mjs
      - name: Upload enterprise Windows installer
        if: ${{ inputs.enterprise-extension }}
        uses: actions/upload-artifact@v6
        with:
          name: zhiyuan-enterprise-windows-${{ inputs.app-build-version }}-${{ github.run_number }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/*.exe.manifest.json
            release/electron-rc-evidence.json
            acceptance-diagnostics/
          if-no-files-found: error
          retention-days: 14
      - name: Checkpoint final Windows lite bytes
        if: ${{ !inputs.enterprise-extension }}
        uses: ./.github/actions/checkpoint-windows-package
        with:
          edition: lite
          version: ${{ inputs.app-build-version }}
          certificate-thumbprint: ${{ steps.certum-signing.outputs.thumbprint }}
      - name: Upload Windows lite acceptance inputs
        if: ${{ !inputs.enterprise-extension }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-lite
          path: checkpoint-win32-x64-lite/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Remove uploaded Windows lite checkpoint
        if: ${{ !inputs.enterprise-extension }}
        shell: pwsh
        run: Remove-Item -LiteralPath checkpoint-win32-x64-lite -Recurse
      - name: Assemble signed Windows cpu installer
        if: ${{ !inputs.enterprise-extension }}
        run: node scripts/release/windows/assemble-windows-edition.cjs cpu
        env:
          ZHIYUAN_UPDATE_VARIANT: cpu
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Checkpoint final Windows cpu bytes
        if: ${{ !inputs.enterprise-extension }}
        uses: ./.github/actions/checkpoint-windows-package
        with:
          edition: cpu
          version: ${{ inputs.app-build-version }}
          certificate-thumbprint: ${{ steps.certum-signing.outputs.thumbprint }}
      - name: Upload Windows cpu acceptance inputs
        if: ${{ !inputs.enterprise-extension }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-cpu
          path: checkpoint-win32-x64-cpu/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Remove uploaded Windows cpu checkpoint
        if: ${{ !inputs.enterprise-extension }}
        shell: pwsh
        run: Remove-Item -LiteralPath checkpoint-win32-x64-cpu -Recurse
      - name: Assemble signed Windows cuda installer
        if: ${{ !inputs.enterprise-extension }}
        run: node scripts/release/windows/assemble-windows-edition.cjs cuda
        env:
          ZHIYUAN_UPDATE_VARIANT: cuda
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Checkpoint final Windows cuda bytes
        if: ${{ !inputs.enterprise-extension }}
        uses: ./.github/actions/checkpoint-windows-package
        with:
          edition: cuda
          version: ${{ inputs.app-build-version }}
          certificate-thumbprint: ${{ steps.certum-signing.outputs.thumbprint }}
      - name: Upload Windows cuda acceptance inputs
        if: ${{ !inputs.enterprise-extension }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-cuda
          path: checkpoint-win32-x64-cuda/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Remove uploaded Windows cuda checkpoint
        if: ${{ !inputs.enterprise-extension }}
        shell: pwsh
        run: Remove-Item -LiteralPath checkpoint-win32-x64-cuda -Recurse
      - name: Preserve Windows packaging diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-package-diagnostics-${{ inputs.enterprise-extension && 'enterprise' || 'community' }}-${{ github.run_number }}
          path: |
            acceptance-diagnostics/
            release/*.exe
            scripts/installer-shell/out/*.manifest.json
            scripts/installer-shell/out/setup-size.json
            ${{ runner.temp }}/zhiyuan-build-logs
          if-no-files-found: ignore
          retention-days: 7

  acceptance:
    needs: windows-release
    if: ${{ !inputs.enterprise-extension }}
    strategy:
      fail-fast: false
      matrix:
        edition: [lite, cpu, cuda]
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      ZHIYUAN_UPDATE_VARIANT: ${{ matrix.edition }}
      APP_BUILD_VERSION: ${{ inputs.app-build-version }}
      ZHIYUAN_SOURCE_COMMIT: ${{ needs.windows-release.outputs.commit }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.windows-release.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - uses: actions/download-artifact@v8
        with:
          name: windows-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.edition }}
          path: checkpoint/
      - name: Restore and verify exact signed package inputs
        shell: bash
        run: node scripts/ci/build-checkpoint.mjs restore checkpoint win32-x64-${{ matrix.edition }}
      - name: Read restored public signing identity
        id: public-signing-identity
        shell: pwsh
        run: |
          $path = (Resolve-Path -LiteralPath release/signing-certificate.cer).Path
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($path)
          if ($certificate.HasPrivateKey) { throw 'Acceptance certificate must contain only a public key' }
          $thumbprint = $certificate.Thumbprint
          if ($thumbprint -notmatch '^[A-Fa-f0-9]{40}$') { throw 'Invalid public certificate thumbprint' }
          "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT
      - name: Verify final Windows installer on a fresh runner
        uses: ./.github/actions/verify-windows-package
        with:
          certificate-thumbprint: ${{ steps.public-signing-identity.outputs.thumbprint }}
          certificate-path: release/signing-certificate.cer
          artifact-suffix: ${{ matrix.edition }}-${{ github.run_attempt }}
      - name: Freeze verified Windows candidate
        uses: ./.github/actions/freeze-windows-candidate
        with:
          edition: ${{ matrix.edition }}
          version: ${{ inputs.app-build-version }}
          source-commit: ${{ needs.windows-release.outputs.commit }}
      - name: Upload accepted Windows release candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ inputs.app-build-version }}-win32-x64-${{ matrix.edition }}
          path: bundle-win32-x64-${{ matrix.edition }}/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve edition acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-acceptance-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.edition }}
          path: acceptance-diagnostics/
          if-no-files-found: warn
          retention-days: 7
