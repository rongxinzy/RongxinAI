name: Build Zhiyuan Enterprise Windows package (manual)

# Resolve the requested identity, then use the ordinary Windows release pipeline.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      source_ref:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Enterprise version (vX.Y.Z)
        required: true
        type: string
      source_ref:
        description: Commit, tag, or branch reachable from main
        required: true
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: enterprise-windows-package-${{ inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  identity:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Validate version and source commit
        id: identity
        shell: bash
        env:
          RAW_ENTERPRISE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="$(printf '%s' "$RAW_ENTERPRISE_VERSION" | tr -d '[:space:]')"
          if [[ ! "$raw" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Expected enterprise version vX.Y.Z' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          commit="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" origin/main
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  package:
    needs: identity
    uses: ./.github/workflows/build-windows-release.yml
    with:
      source-ref: ${{ needs.identity.outputs.commit }}
      app-build-version: ${{ needs.identity.outputs.version }}
      enterprise-extension: true
    secrets: inherit
