name: Daily release (auto)

# Automatic production release: computes the conventional CalVer build number
# (YYYY.M.D-build.N, N counts today's releases already in the bucket), runs the
# full quality gates, builds every platform with the installer smoke suite
# (cold install, cache-hit upgrade, uninstall, signatures, deb install), and
# publishes to the stable channel only when every smoke step passed. The
# manual candidate + promotion pair stays available as a fallback.

on:
  schedule:
    # 01:23 UTC = 09:23 Beijing, off the hour to dodge fleet spikes.
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional explicit SemVer override, no v prefix; auto-computed when empty'
        required: false
        default: ''
        type: string

concurrency:
  group: zhiyuan-online-update-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  R2_BUCKET: zhiyuan-releases

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve release identity and compute the conventional version
        id: identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          source_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$source_commit" origin/main; then
            echo 'Release source must resolve to a commit reachable from origin/main' >&2
            exit 1
          fi

          version="$RELEASE_VERSION"
          if [[ -z "$version" ]]; then
            # Conventional CalVer: YYYY.M.D-build.N where N is one past the
            # releases already uploaded for today (immutable keys decide, not
            # the stable pointer, so failed publishes never reuse a number).
            export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
            export AWS_DEFAULT_REGION=auto
            export AWS_ENDPOINT_URL_S3="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
            base="$(date -u +%Y.%-m.%-d)"
            count="$(
              aws s3api list-objects-v2 \
                --bucket "$R2_BUCKET" \
                --prefix "releases/${base}-build." \
                --delimiter '/' \
                --query 'length(CommonPrefixes[])' \
                --output text
            )"
            [[ "$count" =~ ^[0-9]+$ ]] || count=0
            version="${base}-build.$((count + 1))"
          fi

          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'release_version must be a SemVer value without a v prefix' >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          {
            echo '### Release identity'
            echo
            echo "- version: \`$version\`"
            echo "- source commit: \`$source_commit\`"
            echo '- publication: automatic after the installer smoke gates pass'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install release tools
        run: |
          pipx install 'awscli>=1.45.10,<2'
          npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund

  memory-regression:
    needs: prepare-release
    uses: ./.github/workflows/memory-regression.yml
    with:
      source-ref: ${{ needs.prepare-release.outputs.commit }}

  quality:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-node@v6
        with: { node-version: '24.x' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.0' }
      - name: Restore Bun and Electron caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: release-quality-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            release-quality-${{ runner.os }}-1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Verify npm package signatures
        shell: bash
        run: |
          set -euo pipefail
          for lockfile in \
            SKILLs/presentation-studio/package-lock.json \
            SKILLs/web-search/package-lock.json \
            scripts/release/package-lock.json; do
            directory="$(dirname "$lockfile")"
            npm --prefix "$directory" ci --ignore-scripts
            npm --prefix "$directory" audit signatures --package-lock-only --ignore-scripts
          done
      - name: Validate source and dependency policy
        run: |
          bun run validate:skills
          bun run check:openclaw-decoupling
          bun run check:supply-chain-inputs
          bun run lint
      - name: Typecheck and enforce renderer bundle budgets
        run: |
          bun run build:tsc
          bun run build:vite
          bun run test:bundle-budget
        env:
          VITE_SKIP_ELECTRON: '1'
      - name: Verify Presentation Studio compiler and validator
        run: npm test --prefix SKILLs/presentation-studio
      - name: Compile Electron sources used by integration tests
        run: bun run compile:electron
      - name: Install Electron for native ABI integration tests
        run: node node_modules/electron/install.js
      - name: Run tests
        run: bun run test

  build-release:
    needs: [prepare-release, quality, memory-regression]
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            target: win32-x64-lite
            runtime_target: win-x64
          - platform: macos
            runner: macos-latest
            target: darwin-arm64-default
            runtime_target: mac-arm64
          - platform: linux
            runner: ubuntu-latest
            target: linux-x64-default
            runtime_target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-node@v6
        with: { node-version: '24.x' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.0' }
      - name: Restore bundled runtime cache
        uses: actions/cache@v5
        with:
          path: |
            resources/python-win
            resources/uv-win
            resources/python-mac
            resources/uv-mac
            resources/python-linux
            resources/uv-linux
            resources/uv-archives
          key: bundled-runtimes-${{ runner.os }}-${{ matrix.runtime_target }}-${{ hashFiles('scripts/setup-python-runtime.js', 'scripts/setup-uv-runtime.js', 'scripts/setup-mac-python-runtime.js', 'scripts/setup-mac-uv-runtime.js', 'electron-builder.json') }}
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            vendor/channel-runtime
          key: release-packaging-${{ runner.os }}-${{ matrix.runtime_target }}-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'scripts/**') }}
          restore-keys: |
            release-packaging-${{ runner.os }}-${{ matrix.runtime_target }}-node24-bun1.4.0-
      - name: Install Electron system dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libatspi2.0-0 libgbm1 libgtk-3-0 libnotify4 libnss3 libsecret-1-0 \
            libxss1 libxtst6 libuuid1 xdg-utils xvfb
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Set up Windows runtimes
        if: ${{ matrix.platform == 'windows' }}
        run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
      - name: Set up POSIX runtimes
        if: ${{ matrix.platform != 'windows' }}
        run: |
          bun run setup:posix-uv-runtime
          bun run setup:posix-python-runtime
      - name: Connect Certum SimplySign
        if: ${{ matrix.platform == 'windows' }}
        id: certum-signing
        uses: ./.github/actions/setup-certum-signing
        with:
          user-id: ${{ secrets.CERTUM_USER_ID }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certificate-thumbprint: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      - name: Build Windows release
        if: ${{ matrix.platform == 'windows' }}
        run: bun run dist:win:signed
        env:
          APP_BUILD_VERSION: ${{ needs.prepare-release.outputs.version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Validate optional macOS signing credentials
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          values=("$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID")
          provided=0
          for value in "${values[@]}"; do [[ -n "$value" ]] && provided=$((provided + 1)); done
          if [[ $provided -eq 0 ]]; then
            echo 'ZHIYUAN_MAC_AUTO_UPDATE_ENABLED=false' >> "$GITHUB_ENV"
            echo 'CSC_IDENTITY_AUTO_DISCOVERY=false' >> "$GITHUB_ENV"
            echo '::warning title=Unsigned macOS release::Apple signing credentials are unavailable.'
          elif [[ $provided -ne ${#values[@]} ]]; then
            echo 'macOS signing credentials are only partially configured' >&2
            exit 1
          else
            echo 'ZHIYUAN_MAC_AUTO_UPDATE_ENABLED=true' >> "$GITHUB_ENV"
            echo 'CSC_IDENTITY_AUTO_DISCOVERY=true' >> "$GITHUB_ENV"
          fi
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build unsigned macOS release
        if: ${{ matrix.platform == 'macos' && env.ZHIYUAN_MAC_AUTO_UPDATE_ENABLED != 'true' }}
        run: node scripts/ensure-build-version.js && bun run prepare:update-release && bun run dist:mac
        env:
          APP_BUILD_VERSION: ${{ needs.prepare-release.outputs.version }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Build signed macOS release
        if: ${{ matrix.platform == 'macos' && env.ZHIYUAN_MAC_AUTO_UPDATE_ENABLED == 'true' }}
        run: node scripts/ensure-build-version.js && bun run prepare:update-release && bun run dist:mac
        env:
          APP_BUILD_VERSION: ${{ needs.prepare-release.outputs.version }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Verify signed and notarized macOS release
        if: ${{ matrix.platform == 'macos' && env.ZHIYUAN_MAC_AUTO_UPDATE_ENABLED == 'true' }}
        shell: bash
        run: |
          app_path="$(find release -maxdepth 3 -type d -name '*.app' -print -quit)"
          [[ -n "$app_path" ]] || { echo 'Packaged macOS app was not found' >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
      - name: Build Linux release
        if: ${{ matrix.platform == 'linux' }}
        run: bun run dist:linux
        env:
          APP_BUILD_VERSION: ${{ needs.prepare-release.outputs.version }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Verify packaged release version
        shell: bash
        run: node scripts/ci/verify-packaged-app-version.mjs '${{ needs.prepare-release.outputs.version }}'
      - name: Verify packaged ACP registry and bridges
        shell: bash
        run: node scripts/ci/verify-packaged-acp-resources.mjs
      - name: Verify Windows Authenticode signatures
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/verify-windows-authenticode.ps1
          -ProjectRoot '${{ github.workspace }}'
          -ExpectedThumbprint '${{ steps.certum-signing.outputs.thumbprint }}'
      - name: Verify Windows release size and runtimes
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/windows-installer-size-smoke.ps1 -ProjectRoot '${{ github.workspace }}'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/windows-runtime-smoke.ps1 -ProjectRoot '${{ github.workspace }}'
      - name: Qualify Windows compression before release assembly
        if: ${{ matrix.platform == 'windows' }}
        uses: ./.github/actions/verify-windows-compression
      - name: Verify Windows cold install, cache-hit upgrade, and uninstall
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-installer-smoke.ps1
          -ProjectRoot '${{ github.workspace }}'
      - name: Verify the Linux renderer
        if: ${{ matrix.platform == 'linux' }}
        run: xvfb-run -a node scripts/verify-linux-renderer.mjs release/linux-unpacked release/linux-render-smoke.png
      - name: Install and start the exact Linux release deb
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(release/*.deb)
          [[ ${#debs[@]} -eq 1 ]] || { echo 'Expected exactly one Linux deb package' >&2; exit 1; }
          sudo apt-get install -y "$(realpath "${debs[0]}")"
          node scripts/verify-linux-renderer.mjs '/opt/知远/知远' release/linux-deb-install-smoke.png
      - name: Assemble Windows release payload
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        run: |
          shopt -s nullglob
          installers=(release/*.exe)
          blockmaps=(release/*.exe.blockmap)
          [[ ${#installers[@]} -eq 1 && ${#blockmaps[@]} -eq 1 ]] || { echo 'Expected one Windows installer and blockmap' >&2; exit 1; }
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ needs.prepare-release.outputs.version }}' win32 x64 lite \
            release/latest.yml release/electron-updater/latest.yml
          node scripts/release/create-release-candidate.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            '${{ needs.prepare-release.outputs.commit }}' \
            '${{ github.run_id }}' candidate candidate-win32-x64-lite.json \
            "${installers[0]}:win32:x64:lite:installer" \
            "${installers[0]}:win32:x64:lite:updater" \
            "${blockmaps[0]}:win32:x64:lite:blockmap" \
            'release/electron-updater/latest.yml:win32:x64:lite:metadata'
      - name: Assemble macOS release payload
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          blockmaps=(release/*.zip.blockmap)
          [[ ${#dmgs[@]} -eq 1 && ${#zips[@]} -eq 1 && ${#blockmaps[@]} -eq 1 ]] || { echo 'Expected one macOS DMG, ZIP, and blockmap' >&2; exit 1; }
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ needs.prepare-release.outputs.version }}' darwin arm64 default \
            release/latest-mac.yml release/electron-updater/latest-mac.yml
          node scripts/release/create-release-candidate.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            '${{ needs.prepare-release.outputs.commit }}' \
            '${{ github.run_id }}' candidate candidate-darwin-arm64-default.json \
            "${dmgs[0]}:darwin:arm64:default:installer" \
            "${zips[0]}:darwin:arm64:default:updater" \
            "${blockmaps[0]}:darwin:arm64:default:blockmap" \
            'release/electron-updater/latest-mac.yml:darwin:arm64:default:metadata'
      - name: Assemble Linux release payload
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          shopt -s nullglob
          debs=(release/*.deb)
          appimages=(release/*.AppImage)
          [[ ${#debs[@]} -eq 1 && ${#appimages[@]} -eq 1 ]] || { echo 'Expected one Linux deb and AppImage' >&2; exit 1; }
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ needs.prepare-release.outputs.version }}' linux x64 appimage \
            release/latest-linux.yml release/electron-updater/latest-linux.yml
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ needs.prepare-release.outputs.version }}' linux x64 deb \
            release/latest-linux.yml release/electron-updater/deb/latest-linux.yml
          node scripts/release/create-release-candidate.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            '${{ needs.prepare-release.outputs.commit }}' \
            '${{ github.run_id }}' candidate candidate-linux-x64.json \
            "${debs[0]}:linux:x64:deb:installer" \
            "${debs[0]}:linux:x64:deb:updater" \
            'release/electron-updater/deb/latest-linux.yml:linux:x64:deb:metadata' \
            "${appimages[0]}:linux:x64:appimage:installer" \
            "${appimages[0]}:linux:x64:appimage:updater" \
            'release/electron-updater/latest-linux.yml:linux:x64:appimage:metadata'
      - name: Upload release payload
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ needs.prepare-release.outputs.version }}-${{ matrix.target }}
          path: candidate
          if-no-files-found: error
          retention-days: 14

  # The publish gate consumes exactly the bytes the smoke steps above verified
  # (same-run artifacts). Any smoke failure stops the pipeline here and the
  # stable channel keeps its previous version.
  publish:
    needs: [prepare-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-node@v6
        with: { node-version: '24.x' }
      - name: Install release tools
        run: |
          pipx install 'awscli>=1.45.10,<2'
          npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
      - name: Download verified release payloads
        uses: actions/download-artifact@v8
        with:
          path: candidate/windows
          name: release-candidate-${{ needs.prepare-release.outputs.version }}-win32-x64-lite
      - uses: actions/download-artifact@v8
        with:
          path: candidate/macos
          name: release-candidate-${{ needs.prepare-release.outputs.version }}-darwin-arm64-default
      - uses: actions/download-artifact@v8
        with:
          path: candidate/linux
          name: release-candidate-${{ needs.prepare-release.outputs.version }}-linux-x64-default
      - name: Verify release completeness and identity
        shell: bash
        run: |
          set -euo pipefail
          manifests=(
            candidate/windows/candidate-win32-x64-lite.json
            candidate/macos/candidate-darwin-arm64-default.json
            candidate/linux/candidate-linux-x64.json
          )
          for manifest in "${manifests[@]}"; do
            [[ -f "$manifest" ]] || { echo "Missing release manifest: $manifest" >&2; exit 1; }
          done
          node scripts/release/verify-release-candidate.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            '${{ needs.prepare-release.outputs.commit }}' \
            '${{ github.run_id }}' \
            "${manifests[@]}" \
            --payload-roots candidate/windows candidate/macos candidate/linux
      - name: Configure protected R2 access
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            echo 'AWS_DEFAULT_REGION=auto'
            echo "AWS_ENDPOINT_URL_S3=https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          } >> "$GITHUB_ENV"
      - name: Verify and upload immutable release bytes
        shell: bash
        run: |
          node scripts/release/upload-release-candidate.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            '${{ needs.prepare-release.outputs.commit }}' \
            '${{ github.run_id }}' \
            uploaded-metadata \
            candidate/windows/candidate-win32-x64-lite.json \
            candidate/macos/candidate-darwin-arm64-default.json \
            candidate/linux/candidate-linux-x64.json \
            --payload-roots candidate/windows candidate/macos candidate/linux
      - name: Create signed stable manifest from uploaded release metadata
        run: |
          node scripts/release/publish-update-manifest.mjs \
            manifest/stable.json \
            '${{ needs.prepare-release.outputs.version }}' \
            '${{ needs.prepare-release.outputs.commit }}' \
            --metadata uploaded-metadata/update-artifacts-1.json uploaded-metadata/update-artifacts-2.json uploaded-metadata/update-artifacts-3.json
        env:
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
          UPDATE_SOURCE_PIPELINE_ID: ${{ github.run_id }}
      - name: Read current stable release
        id: current
        shell: bash
        run: |
          mkdir -p manifest
          set +e
          aws s3api head-object --bucket "$R2_BUCKET" --key channels/stable-pointer.json > manifest/current-pointer-head.json 2> manifest/current-pointer-head.err
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            aws s3api get-object --bucket "$R2_BUCKET" --key channels/stable-pointer.json manifest/current-pointer.json > /dev/null
            generation="$(jq -er 'select(.schemaVersion == 1) | .generation | select(type == "string" and test("^[A-Za-z0-9._-]+$"))' manifest/current-pointer.json)"
            aws s3api get-object --bucket "$R2_BUCKET" --key "generations/${generation}/legacy/stable.json" manifest/current.json > /dev/null
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'pointer_exists=true' >> "$GITHUB_OUTPUT"
            echo "pointer_etag=$(jq -r '.ETag' manifest/current-pointer-head.json)" >> "$GITHUB_OUTPUT"
          elif grep -Eq '404|Not Found|NoSuchKey' manifest/current-pointer-head.err; then
            set +e
            aws s3api head-object --bucket "$R2_BUCKET" --key channels/stable.json > manifest/current-head.json 2> manifest/current-head.err
            stable_status=$?
            set -e
            if [[ $stable_status -eq 0 ]]; then
              aws s3api get-object --bucket "$R2_BUCKET" --key channels/stable.json manifest/current.json > /dev/null
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              echo 'pointer_exists=false' >> "$GITHUB_OUTPUT"
            elif grep -Eq '404|Not Found|NoSuchKey' manifest/current-head.err; then
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              echo 'pointer_exists=false' >> "$GITHUB_OUTPUT"
            else
              cat manifest/current-head.err >&2
              exit "$stable_status"
            fi
          else
            cat manifest/current-pointer-head.err >&2
            exit "$status"
          fi
      - name: Enforce monotonic release version
        id: version_check
        shell: bash
        run: |
          current_path='-'
          [[ '${{ steps.current.outputs.exists }}' == 'true' ]] && current_path='manifest/current.json'
          node scripts/release/verify-update-transition.mjs "$current_path" manifest/stable.json '${{ needs.prepare-release.outputs.version }}'
        env:
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      - name: Verify electron-updater metadata and publish immutable generation
        if: steps.version_check.outputs.idempotent != 'true'
        shell: bash
        run: |
          metadata=(uploaded-metadata/update-artifacts-1.json uploaded-metadata/update-artifacts-2.json uploaded-metadata/update-artifacts-3.json)
          mkdir -p manifest/electron
          while IFS=$'\t' read -r key target filename; do
            target_file="${target//:/-}"
            mkdir -p "manifest/electron/${target_file}"
            aws s3api get-object --bucket "$R2_BUCKET" --key "$key" "manifest/electron/${target_file}/${filename}" > /dev/null
          done < <(jq -s -r '[.[].artifacts[] | select(.kind == "metadata")] | sort_by(.platform,.arch,.variant) | .[] | [.key,(.platform+":"+.arch+":"+.variant),.filename] | @tsv' "${metadata[@]}")
          node scripts/release/verify-electron-updater-generation.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            manifest/electron/win32-x64-lite/latest.yml:win32:x64:lite \
            manifest/electron/darwin-arm64-default/latest-mac.yml:darwin:arm64:default \
            manifest/electron/linux-x64-appimage/latest-linux.yml:linux:x64:appimage \
            manifest/electron/linux-x64-deb/latest-linux.yml:linux:x64:deb \
            --artifact-metadata "${metadata[@]}"
          generation_key='generations/${{ needs.prepare-release.outputs.version }}/legacy/stable.json'
          set +e
          aws s3api head-object --bucket "$R2_BUCKET" --key "$generation_key" > manifest/generation-head.json 2> manifest/generation-head.err
          generation_status=$?
          set -e
          if [[ $generation_status -eq 0 ]]; then
            aws s3api get-object --bucket "$R2_BUCKET" --key "$generation_key" manifest/existing-generation.json > /dev/null
            node scripts/release/verify-update-transition.mjs manifest/existing-generation.json manifest/stable.json '${{ needs.prepare-release.outputs.version }}'
            cp manifest/existing-generation.json manifest/stable.json
          elif grep -Eq '404|Not Found|NoSuchKey' manifest/generation-head.err; then
            aws s3api put-object --bucket "$R2_BUCKET" --key "$generation_key" --body manifest/stable.json --content-type application/json --cache-control 'public, max-age=31536000, immutable' --if-none-match '*' > /dev/null
          else
            cat manifest/generation-head.err >&2
            exit "$generation_status"
          fi
          node scripts/release/create-update-generation-pointer.mjs manifest/stable-pointer.json '${{ needs.prepare-release.outputs.version }}'
        env:
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      - name: Preserve previous stable state
        if: steps.version_check.outputs.idempotent != 'true' && steps.current.outputs.exists == 'true'
        shell: bash
        run: |
          aws s3api put-object --bucket "$R2_BUCKET" --key channels/stable.previous.json --body manifest/current.json --content-type application/json --cache-control no-store
          if [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]]; then
            aws s3api put-object --bucket "$R2_BUCKET" --key channels/stable.previous-pointer.json --body manifest/current-pointer.json --content-type application/json --cache-control no-store
          fi
      - name: Read legacy stable manifest ETag
        id: legacy
        if: steps.version_check.outputs.idempotent != 'true'
        shell: bash
        run: |
          set +e
          aws s3api head-object --bucket "$R2_BUCKET" --key channels/stable.json > manifest/legacy-head.json 2> manifest/legacy-head.err
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "etag=$(jq -r '.ETag' manifest/legacy-head.json)" >> "$GITHUB_OUTPUT"
          elif grep -Eq '404|Not Found|NoSuchKey' manifest/legacy-head.err; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat manifest/legacy-head.err >&2
            exit "$status"
          fi
      - name: Atomically publish stable manifests
        id: publish
        if: steps.version_check.outputs.idempotent != 'true'
        shell: bash
        run: |
          legacy_args=(--if-none-match '*')
          [[ '${{ steps.legacy.outputs.exists }}' == 'true' ]] && legacy_args=(--if-match '${{ steps.legacy.outputs.etag }}')
          pointer_args=(--if-none-match '*')
          [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]] && pointer_args=(--if-match '${{ steps.current.outputs.pointer_etag }}')

          publish_legacy() {
            aws s3api put-object --bucket "$R2_BUCKET" --key channels/stable.json --body manifest/stable.json --content-type application/json --cache-control no-store "${legacy_args[@]}" > manifest/publish-legacy.json || return $?
            legacy_etag="$(jq -er '.ETag' manifest/publish-legacy.json)"
          }
          publish_pointer() {
            aws s3api put-object --bucket "$R2_BUCKET" --key channels/stable-pointer.json --body manifest/stable-pointer.json --content-type application/json --cache-control no-store "${pointer_args[@]}" > manifest/publish-pointer.json || return $?
            pointer_etag="$(jq -er '.ETag' manifest/publish-pointer.json)"
          }
          rollback_legacy() {
            if [[ '${{ steps.legacy.outputs.exists }}' == 'true' ]]; then
              aws s3api put-object --bucket "$R2_BUCKET" --key channels/stable.json --body manifest/current.json --content-type application/json --cache-control no-store --if-match "$legacy_etag"
            else
              published_etag="$(aws s3api head-object --bucket "$R2_BUCKET" --key channels/stable.json --query ETag --output text)"
              [[ "$published_etag" == "$legacy_etag" ]] || { echo 'Legacy stable manifest changed concurrently; refusing unsafe rollback' >&2; return 1; }
              aws s3api delete-object --bucket "$R2_BUCKET" --key channels/stable.json
            fi
          }
          rollback_pointer() {
            if [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]]; then
              aws s3api put-object --bucket "$R2_BUCKET" --key channels/stable-pointer.json --body manifest/current-pointer.json --content-type application/json --cache-control no-store --if-match "$pointer_etag"
            else
              published_etag="$(aws s3api head-object --bucket "$R2_BUCKET" --key channels/stable-pointer.json --query ETag --output text)"
              [[ "$published_etag" == "$pointer_etag" ]] || { echo 'Stable pointer changed concurrently; refusing unsafe rollback' >&2; return 1; }
              aws s3api delete-object --bucket "$R2_BUCKET" --key channels/stable-pointer.json
            fi
          }
          if [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]]; then
            publish_legacy
            set +e
            publish_pointer
            publish_status=$?
            set -e
            [[ $publish_status -eq 0 ]] || { rollback_legacy; exit "$publish_status"; }
          else
            publish_pointer
            set +e
            publish_legacy
            publish_status=$?
            set -e
            [[ $publish_status -eq 0 ]] || { rollback_pointer; exit "$publish_status"; }
          fi
      - name: Summarize automatic release
        shell: bash
        run: |
          {
            echo '### Released automatically'
            echo
            echo "- version: \`${{ needs.prepare-release.outputs.version }}\`"
            echo "- source commit: \`${{ needs.prepare-release.outputs.commit }}\`"
            echo "- pipeline run: \`${{ github.run_id }}\`"
            echo '- installer smoke: cold install, cache-hit upgrade, uninstall, signatures — all passed'
          } >> "$GITHUB_STEP_SUMMARY"
