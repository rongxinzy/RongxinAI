name: Release (tag)

# Tag-triggered release: platform-staged build and publish (Windows, macOS,
# Linux). Each platform is independent (fail-fast: false). Stable promotion is
# manual via promote.yml.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: zhiyuan-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  R2_BUCKET: zhiyuan-releases

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve release identity from the tag
        id: identity
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'Release tags must use v<semver>, for example v2026.10.16-build.1' >&2
            exit 1
          fi
          version="${TAG_NAME#v}"
          git fetch --no-tags origin main
          source_commit="$(git rev-parse "${TAG_NAME}^{}")"
          if ! git merge-base --is-ancestor "$source_commit" origin/main; then
            echo 'Release tag must point to a commit reachable from origin/main' >&2
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          {
            echo '### Release identity'
            echo
            echo "- version: \`$version\`"
            echo "- source commit: \`$source_commit\`"
            echo '- channel: beta (stable requires promote workflow)'
          } >> "$GITHUB_STEP_SUMMARY"
  preflight:
    needs: prepare-release
    uses: ./.github/workflows/release-preflight.yml
    with:
      source-ref: ${{ needs.prepare-release.outputs.commit }}
      include-packaging: false
    secrets:
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}

  build-windows:
    needs: prepare-release
    uses: ./.github/workflows/build-windows-release.yml
    with:
      source-ref: ${{ needs.prepare-release.outputs.commit }}
      app-build-version: ${{ needs.prepare-release.outputs.version }}
    secrets:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_THUMBPRINT: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}

  build-macos:
    needs: prepare-release
    uses: ./.github/workflows/build-inference-editions.yml
    with:
      source-ref: ${{ needs.prepare-release.outputs.commit }}
      app-build-version: ${{ needs.prepare-release.outputs.version }}
      mode: release
      fail-fast: false
      build-windows: false
      build-linux: false
      windows-release-staged: true
    secrets:
      UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  build-linux:
    needs: prepare-release
    uses: ./.github/workflows/build-inference-editions.yml
    with:
      source-ref: ${{ needs.prepare-release.outputs.commit }}
      app-build-version: ${{ needs.prepare-release.outputs.version }}
      mode: release
      fail-fast: false
      build-windows: false
      build-macos: false
      windows-release-staged: true
    secrets:
      UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}

  publish-windows:
    needs: [prepare-release, preflight, build-windows]
    if: ${{ needs.preflight.result == 'success' && needs.build-windows.result == 'success' }}
    uses: ./.github/workflows/publish-platform-release.yml
    with:
      platform: win32
      version: ${{ needs.prepare-release.outputs.version }}
      commit: ${{ needs.prepare-release.outputs.commit }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
      UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}

  publish-macos:
    needs: [prepare-release, preflight, build-macos]
    if: ${{ needs.preflight.result == 'success' && needs.build-macos.result == 'success' }}
    uses: ./.github/workflows/publish-platform-release.yml
    with:
      platform: darwin
      version: ${{ needs.prepare-release.outputs.version }}
      commit: ${{ needs.prepare-release.outputs.commit }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
      UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}

  publish-linux:
    needs: [prepare-release, preflight, build-linux]
    if: ${{ needs.preflight.result == 'success' && needs.build-linux.result == 'success' }}
    uses: ./.github/workflows/publish-platform-release.yml
    with:
      platform: linux
      version: ${{ needs.prepare-release.outputs.version }}
      commit: ${{ needs.prepare-release.outputs.commit }}
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
      UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}

  github-prerelease:
    needs: [prepare-release, publish-windows, publish-macos, publish-linux]
    if: >-
      always() && (
        needs.publish-windows.result == 'success' ||
        needs.publish-macos.result == 'success' ||
        needs.publish-linux.result == 'success'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Download release payloads for GitHub assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-candidate-${{ needs.prepare-release.outputs.version }}-*
          path: candidate-staging
      - name: Stage GitHub release assets by bundle id
        shell: bash
        run: bash scripts/release/stage-downloaded-release-candidates.sh '${{ needs.prepare-release.outputs.version }}'
      - name: Collect GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find candidate -type f ! -name '*.json' ! -name '*.yml' ! -name '*.blockmap' -exec cp -t release-assets {} +
          ls -la release-assets
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 知远 ${{ needs.prepare-release.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
