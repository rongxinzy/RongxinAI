name: Release (tag)

# Tag-triggered release: platform-staged build and publish (Windows, macOS,
# Linux). Builds are independent; one complete generation is published. Stable promotion is
# manual via promote.yml.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: zhiyuan-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  R2_BUCKET: zhiyuan-releases

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve release identity from the tag
        id: identity
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'Release tags must use v<semver>, for example v2026.10.16-build.1' >&2
            exit 1
          fi
          version="${TAG_NAME#v}"
          git fetch --no-tags origin main
          source_commit="$(git rev-parse "${TAG_NAME}^{}")"
          if ! git merge-base --is-ancestor "$source_commit" origin/main; then
            echo 'Release tag must point to a commit reachable from origin/main' >&2
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          {
            echo '### Release identity'
            echo
            echo "- version: \`$version\`"
            echo "- source commit: \`$source_commit\`"
            echo '- channel: beta (stable requires promote workflow)'
          } >> "$GITHUB_STEP_SUMMARY"
  preflight:
    needs: prepare-release
    uses: ./.github/workflows/release-preflight.yml
    with:
      source-ref: ${{ needs.prepare-release.outputs.commit }}
      include-packaging: false
    secrets:
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}

  build-windows:
    needs: prepare-release
    uses: ./.github/workflows/build-windows-release.yml
    with:
      source-ref: ${{ needs.prepare-release.outputs.commit }}
      app-build-version: ${{ needs.prepare-release.outputs.version }}
    secrets:
      CERTUM_USER_ID: ${{ secrets.CERTUM_USER_ID }}
      CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
      CERTUM_CERT_THUMBPRINT: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}

  build-macos:
    needs: prepare-release
    uses: ./.github/workflows/build-inference-editions.yml
    with:
      source-ref: ${{ needs.prepare-release.outputs.commit }}
      app-build-version: ${{ needs.prepare-release.outputs.version }}
      mode: release
      fail-fast: false
      build-windows: false
      build-linux: false
      windows-release-staged: true
    secrets:
      UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  build-linux:
    needs: prepare-release
    uses: ./.github/workflows/build-inference-editions.yml
    with:
      source-ref: ${{ needs.prepare-release.outputs.commit }}
      app-build-version: ${{ needs.prepare-release.outputs.version }}
      mode: release
      fail-fast: false
      build-windows: false
      build-macos: false
      windows-release-staged: true
    secrets:
      UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}

  publish:
    needs: [prepare-release, preflight, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: zhiyuan-online-update-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install release tools
        run: |
          pipx install 'awscli>=1.45.10,<2'
          npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
      - name: Download verified release payloads
        uses: actions/download-artifact@v8
        with:
          pattern: release-candidate-${{ needs.prepare-release.outputs.version }}-*
          path: candidate-staging
      - name: Stage release candidates by bundle id
        shell: bash
        run: bash scripts/release/stage-downloaded-release-candidates.sh '${{ needs.prepare-release.outputs.version }}'
      - name: Verify release completeness and identity
        shell: bash
        run: |
          set -euo pipefail
          manifests=()
          roots=()
          while IFS=$'\t' read -r bundle manifest; do
            manifests+=("candidate/${bundle}/${manifest}")
            roots+=("candidate/${bundle}")
          done < <(node scripts/release/print-release-candidate-layout.mjs)
          for manifest in "${manifests[@]}"; do
            [[ -f "$manifest" ]] || { echo "Missing release manifest: $manifest" >&2; exit 1; }
          done
          node scripts/release/verify-release-candidate.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            '${{ needs.prepare-release.outputs.commit }}' \
            '${{ github.run_id }}' \
            "${manifests[@]}" \
            --payload-roots "${roots[@]}"
      - name: Configure protected R2 access
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            echo 'AWS_DEFAULT_REGION=auto'
            echo "AWS_ENDPOINT_URL_S3=https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          } >> "$GITHUB_ENV"
      - name: Verify and upload immutable release bytes
        shell: bash
        run: |
          set -euo pipefail
          manifests=()
          roots=()
          while IFS=$'\t' read -r bundle manifest; do
            manifests+=("candidate/${bundle}/${manifest}")
            roots+=("candidate/${bundle}")
          done < <(node scripts/release/print-release-candidate-layout.mjs)
          node scripts/release/upload-release-candidate.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            '${{ needs.prepare-release.outputs.commit }}' \
            '${{ github.run_id }}' \
            uploaded-metadata \
            "${manifests[@]}" \
            --payload-roots "${roots[@]}"
      - name: Archive build metadata for stable promotion
        shell: bash
        run: |
          shopt -s nullglob
          for file in uploaded-metadata/update-artifacts-*.json; do
            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "generations/${{ needs.prepare-release.outputs.version }}/build-metadata/$(basename "$file")" \
              --body "$file" \
              --content-type application/json \
              --cache-control 'public, max-age=31536000, immutable'
          done
      - name: Create signed beta manifest from uploaded release metadata
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          metadata=(uploaded-metadata/update-artifacts-*.json)
          [[ ${#metadata[@]} -gt 0 ]] || { echo 'Missing uploaded artifact metadata' >&2; exit 1; }
          node scripts/release/publish-update-manifest.mjs \
            manifest/beta.json \
            '${{ needs.prepare-release.outputs.version }}' \
            '${{ needs.prepare-release.outputs.commit }}' \
            --metadata "${metadata[@]}"
        env:
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
          UPDATE_SOURCE_PIPELINE_ID: ${{ github.run_id }}
          UPDATE_RELEASE_CHANNEL: beta
      - name: Read current beta release
        id: current
        shell: bash
        run: |
          mkdir -p manifest
          set +e
          aws s3api head-object --bucket "$R2_BUCKET" --key channels/beta-pointer.json > manifest/current-pointer-head.json 2> manifest/current-pointer-head.err
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            aws s3api get-object --bucket "$R2_BUCKET" --key channels/beta-pointer.json manifest/current-pointer.json > /dev/null
            generation="$(jq -er 'select(.schemaVersion == 1) | .generation | select(type == "string" and test("^[A-Za-z0-9._-]+$"))' manifest/current-pointer.json)"
            aws s3api get-object --bucket "$R2_BUCKET" --key "generations/${generation}/legacy/beta.json" manifest/current.json > /dev/null
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'pointer_exists=true' >> "$GITHUB_OUTPUT"
            echo "pointer_etag=$(jq -r '.ETag' manifest/current-pointer-head.json)" >> "$GITHUB_OUTPUT"
          elif grep -Eq '404|Not Found|NoSuchKey' manifest/current-pointer-head.err; then
            set +e
            aws s3api head-object --bucket "$R2_BUCKET" --key channels/beta.json > manifest/current-head.json 2> manifest/current-head.err
            stable_status=$?
            set -e
            if [[ $stable_status -eq 0 ]]; then
              aws s3api get-object --bucket "$R2_BUCKET" --key channels/beta.json manifest/current.json > /dev/null
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              echo 'pointer_exists=false' >> "$GITHUB_OUTPUT"
            elif grep -Eq '404|Not Found|NoSuchKey' manifest/current-head.err; then
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              echo 'pointer_exists=false' >> "$GITHUB_OUTPUT"
            else
              cat manifest/current-head.err >&2
              exit "$stable_status"
            fi
          else
            cat manifest/current-pointer-head.err >&2
            exit "$status"
          fi
      - name: Enforce monotonic beta version
        id: version_check
        shell: bash
        run: |
          current_path='-'
          [[ '${{ steps.current.outputs.exists }}' == 'true' ]] && current_path='manifest/current.json'
          node scripts/release/verify-update-transition.mjs "$current_path" manifest/beta.json '${{ needs.prepare-release.outputs.version }}'
        env:
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      - name: Verify electron-updater metadata and publish immutable generation
        if: steps.version_check.outputs.idempotent != 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          metadata=(uploaded-metadata/update-artifacts-*.json)
          [[ ${#metadata[@]} -gt 0 ]] || { echo 'Missing uploaded artifact metadata' >&2; exit 1; }
          mkdir -p manifest/electron
          while IFS=$'\t' read -r key target filename; do
            target_file="${target//:/-}"
            mkdir -p "manifest/electron/${target_file}"
            aws s3api get-object --bucket "$R2_BUCKET" --key "$key" "manifest/electron/${target_file}/${filename}" > /dev/null
          done < <(jq -s -r '[.[].artifacts[] | select(.kind == "metadata")] | sort_by(.platform,.arch,.variant) | .[] | [.key,(.platform+":"+.arch+":"+.variant),.filename] | @tsv' "${metadata[@]}")
          mapfile -t electron_specs < <(node scripts/release/print-electron-updater-verify-specs.mjs)
          node scripts/release/verify-electron-updater-generation.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            "${electron_specs[@]}" \
            --artifact-metadata "${metadata[@]}"
          generation_key='generations/${{ needs.prepare-release.outputs.version }}/legacy/beta.json'
          set +e
          aws s3api head-object --bucket "$R2_BUCKET" --key "$generation_key" > manifest/generation-head.json 2> manifest/generation-head.err
          generation_status=$?
          set -e
          if [[ $generation_status -eq 0 ]]; then
            aws s3api get-object --bucket "$R2_BUCKET" --key "$generation_key" manifest/existing-generation.json > /dev/null
            node scripts/release/verify-update-transition.mjs manifest/existing-generation.json manifest/beta.json '${{ needs.prepare-release.outputs.version }}'
            cp manifest/existing-generation.json manifest/beta.json
          elif grep -Eq '404|Not Found|NoSuchKey' manifest/generation-head.err; then
            aws s3api put-object --bucket "$R2_BUCKET" --key "$generation_key" --body manifest/beta.json --content-type application/json --cache-control 'public, max-age=31536000, immutable' --if-none-match '*' > /dev/null
          else
            cat manifest/generation-head.err >&2
            exit "$generation_status"
          fi
          node scripts/release/create-update-generation-pointer.mjs manifest/beta-pointer.json '${{ needs.prepare-release.outputs.version }}'
        env:
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      - name: Preserve previous beta state
        if: steps.version_check.outputs.idempotent != 'true' && steps.current.outputs.exists == 'true'
        shell: bash
        run: |
          aws s3api put-object --bucket "$R2_BUCKET" --key channels/beta.previous.json --body manifest/current.json --content-type application/json --cache-control no-store
          if [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]]; then
            aws s3api put-object --bucket "$R2_BUCKET" --key channels/beta.previous-pointer.json --body manifest/current-pointer.json --content-type application/json --cache-control no-store
          fi
      - name: Read legacy beta manifest ETag
        id: legacy
        if: steps.version_check.outputs.idempotent != 'true'
        shell: bash
        run: |
          set +e
          aws s3api head-object --bucket "$R2_BUCKET" --key channels/beta.json > manifest/legacy-head.json 2> manifest/legacy-head.err
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "etag=$(jq -r '.ETag' manifest/legacy-head.json)" >> "$GITHUB_OUTPUT"
          elif grep -Eq '404|Not Found|NoSuchKey' manifest/legacy-head.err; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat manifest/legacy-head.err >&2
            exit "$status"
          fi
      - name: Atomically publish beta manifests
        id: publish
        if: steps.version_check.outputs.idempotent != 'true'
        shell: bash
        run: |
          legacy_args=(--if-none-match '*')
          [[ '${{ steps.legacy.outputs.exists }}' == 'true' ]] && legacy_args=(--if-match '${{ steps.legacy.outputs.etag }}')
          pointer_args=(--if-none-match '*')
          [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]] && pointer_args=(--if-match '${{ steps.current.outputs.pointer_etag }}')

          publish_legacy() {
            aws s3api put-object --bucket "$R2_BUCKET" --key channels/beta.json --body manifest/beta.json --content-type application/json --cache-control no-store "${legacy_args[@]}" > manifest/publish-legacy.json || return $?
            legacy_etag="$(jq -er '.ETag' manifest/publish-legacy.json)"
          }
          publish_pointer() {
            aws s3api put-object --bucket "$R2_BUCKET" --key channels/beta-pointer.json --body manifest/beta-pointer.json --content-type application/json --cache-control no-store "${pointer_args[@]}" > manifest/publish-pointer.json || return $?
            pointer_etag="$(jq -er '.ETag' manifest/publish-pointer.json)"
          }
          rollback_legacy() {
            if [[ '${{ steps.legacy.outputs.exists }}' == 'true' ]]; then
              aws s3api put-object --bucket "$R2_BUCKET" --key channels/beta.json --body manifest/current.json --content-type application/json --cache-control no-store --if-match "$legacy_etag"
            else
              published_etag="$(aws s3api head-object --bucket "$R2_BUCKET" --key channels/beta.json --query ETag --output text)"
              [[ "$published_etag" == "$legacy_etag" ]] || { echo 'Legacy stable manifest changed concurrently; refusing unsafe rollback' >&2; return 1; }
              aws s3api delete-object --bucket "$R2_BUCKET" --key channels/beta.json
            fi
          }
          rollback_pointer() {
            if [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]]; then
              aws s3api put-object --bucket "$R2_BUCKET" --key channels/beta-pointer.json --body manifest/current-pointer.json --content-type application/json --cache-control no-store --if-match "$pointer_etag"
            else
              published_etag="$(aws s3api head-object --bucket "$R2_BUCKET" --key channels/beta-pointer.json --query ETag --output text)"
              [[ "$published_etag" == "$pointer_etag" ]] || { echo 'Stable pointer changed concurrently; refusing unsafe rollback' >&2; return 1; }
              aws s3api delete-object --bucket "$R2_BUCKET" --key channels/beta-pointer.json
            fi
          }
          if [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]]; then
            publish_legacy
            set +e
            publish_pointer
            publish_status=$?
            set -e
            [[ $publish_status -eq 0 ]] || { rollback_legacy; exit "$publish_status"; }
          else
            publish_pointer
            set +e
            publish_legacy
            publish_status=$?
            set -e
            [[ $publish_status -eq 0 ]] || { rollback_pointer; exit "$publish_status"; }
          fi
      - name: Smoke test published beta release
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_targets < <(node scripts/release/print-required-release-targets.mjs)
          node scripts/release/verify-published-update.mjs --channel beta \
            '${{ needs.prepare-release.outputs.version }}' \
            "${release_targets[@]}"
        env:
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      - name: Summarize beta release
        shell: bash
        run: |
          {
            echo '### Published to beta channel'
            echo
            echo "- version: \`${{ needs.prepare-release.outputs.version }}\`"
            echo "- source commit: \`${{ needs.prepare-release.outputs.commit }}\`"
            echo "- pipeline run: \`${{ github.run_id }}\`"
            echo '- installer smoke: cold install, cache-hit upgrade, uninstall, signatures — all passed'
          } >> "$GITHUB_STEP_SUMMARY"

  github-prerelease:
    needs: [prepare-release, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Download release payloads for GitHub assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-candidate-${{ needs.prepare-release.outputs.version }}-*
          path: candidate-staging
      - name: Stage GitHub release assets by bundle id
        shell: bash
        run: bash scripts/release/stage-downloaded-release-candidates.sh '${{ needs.prepare-release.outputs.version }}'
      - name: Collect GitHub release assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/collect-github-release-assets.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            '${{ needs.prepare-release.outputs.commit }}' \
            '${{ github.run_id }}'
          ls -la release-assets
      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 知远 ${{ needs.prepare-release.outputs.version }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
