name: Windows uv path experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Provision checksum-verified uv binaries
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'uv-windows-path-probe'
          New-Item -ItemType Directory -Path $root | Out-Null
          $checksums = [ordered]@{
            '0.11.32' = 'acfde570451cfdb8689fa159a138ee805ba4e241c466432750302c86254b0984'
            '0.13.9' = 'edd61f7f5728a56cc62455386661860bdfc7bab65872f39b0c25bdcc1d8e1beb'
          }
          foreach ($version in $checksums.Keys) {
            $archive = Join-Path $root "$version.zip"
            Invoke-WebRequest -Uri "https://github.com/astral-sh/uv/releases/download/$version/uv-x86_64-pc-windows-msvc.zip" -OutFile $archive -MaximumRetryCount 3
            if ((Get-FileHash -Path $archive -Algorithm SHA256).Hash -ine $checksums[$version]) {
              throw "uv $version checksum mismatch"
            }
            Expand-Archive -Path $archive -DestinationPath (Join-Path $root $version)
          }
      - name: Compare installation and native DLL imports with long paths disabled
        shell: pwsh
        run: |
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $before = (Get-ItemProperty -LiteralPath $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          try {
            New-ItemProperty -LiteralPath $key -Name LongPathsEnabled -Value 0 -PropertyType DWord -Force | Out-Null
            $actual = (Get-ItemProperty -LiteralPath $key -Name LongPathsEnabled).LongPathsEnabled
            if ($actual -ne 0) { throw "Wrong LongPathsEnabled value: $actual" }
            Write-Host "LongPathsEnabled=$actual on $([System.Environment]::OSVersion.VersionString)"
            node .github/experiments/uv-windows-paths.cjs
            if ($LASTEXITCODE -ne 0) { throw "Windows uv experiment exited with $LASTEXITCODE" }
          } finally {
            if ($null -eq $before) {
              Remove-ItemProperty -LiteralPath $key -Name LongPathsEnabled
            } else {
              Set-ItemProperty -LiteralPath $key -Name LongPathsEnabled -Value $before
            }
          }
