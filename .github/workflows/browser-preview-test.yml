name: Browser Preview Tests

on:
  pull_request:
    paths:
      - 'src/renderer/**'
      - 'src/shared/**'
      - 'vite.config.browser.ts'
      - 'tests/browserPreview.test.ts'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      
      - name: Install dependencies
        run: bun install
      
      - name: Install Playwright
        run: bunx playwright install --with-deps chromium
      
      - name: Start preview server
        run: bun run web:preview &
        env:
          CI: true
      
      - name: Wait for server
        run: bunx wait-on http://localhost:5176 --timeout 60000
      
      - name: Run Playwright tests
        run: bunx playwright test tests/browserPreview.test.ts
      
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-preview-screenshots
          path: docs/browser-preview-screenshots/
          retention-days: 30
