name: Windows installer gate

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-and-install:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Enforce retired runtime decoupling
        run: node scripts/ci/check-openclaw-decoupling.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore packaging caches
        id: packaging-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            vendor/engram-runtime
            vendor/channel-runtime
          key: windows-installer-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'scripts/**') }}
          restore-keys: |
            windows-installer-node24-bun1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Validate real Windows interaction drivers
        # These suites spawn real PowerShell processes and a C# compiler. Avoid
        # cross-suite CPU contention on the hosted runner; retain every timeout.
        run: bunx vitest run --maxWorkers=1 scripts/ci/windows-installer-size-smoke.test.ts scripts/ci/windows-installer-interactive.test.ts scripts/ci/windows-shell-interactive.test.ts scripts/ci/windows-shell-uninstall.test.ts scripts/installer-shell/app/engine-contracts.test.ts scripts/installer-shell/preview-ui.test.ts scripts/installer-shell/powershell-environment.test.ts scripts/installer/cleanup-after-install.test.ts scripts/installer/recover-component-switch.test.ts scripts/installer/migrate-user-skills.test.ts scripts/installer/validate-install-root.test.ts tests/nsis-installer.test.ts
      - name: Set up offline Windows runtimes
        run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
          bun run engram:runtime:win-x64
      - name: Build complete offline installer
        id: offline-build
        # Keep a stuck packager observable and fail it before the job-level
        # timeout so the diagnostics upload below still gets a chance to run.
        timeout-minutes: 65
        shell: pwsh
        run: |
          & .\scripts\ci\run-with-heartbeat.ps1 `
            -FilePath 'bun' `
            -ArgumentList @('run', 'dist:win:offline') `
            -TimeoutMinutes 55 `
            -HeartbeatSeconds 60
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Use the repo-vendored NSIS plugin bundle instead of the shared
          # electron-builder cache: restored CI caches have yielded a
          # nsis-resources bundle without its plugins directory (makensis then
          # silently drops the addplugindir and fails at the first plugin
          # call), and duplicating a plugin dll across two plugin dirs is a
          # hard "conflicts with a plugin in another directory" error.
          ELECTRON_BUILDER_NSIS_RESOURCES_DIR: ${{ github.workspace }}/build/nsis-resources
      - name: Check offline installer size
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-installer-size-smoke.ps1
          -ProjectRoot ${{ github.workspace }}
      - name: Benchmark shared Skill Python solid compression
        if: ${{ github.event_name != 'pull_request' }}
        uses: ./.github/actions/verify-windows-compression
      - name: Verify embedded runtimes with a clean PATH
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-runtime-smoke.ps1
          -ProjectRoot ${{ github.workspace }}
      - name: Record fresh-run ownership before native install smoke
        id: acceptance-ownership
        shell: powershell
        run: ./scripts/ci/windows-shell-uninstall.ps1 -Action prepare
      - name: Verify cold install, cache-hit upgrade, and uninstall
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-installer-smoke.ps1
          -ProjectRoot ${{ github.workspace }}
      - name: Verify real NSIS install, completion, launch, cancel, and retry
        timeout-minutes: 40
        shell: powershell
        run: ./scripts/ci/windows-installer-interactive.ps1
      - name: Verify real WebView2 setup and upgrade recovery
        id: shell-interaction
        # Its own install/data/runtime sandbox remains independent of NSIS UI.
        # Collect both results after a successful package; neither failure is waived.
        if: ${{ !cancelled() && steps.offline-build.outcome == 'success' && steps.acceptance-ownership.outcome == 'success' }}
        timeout-minutes: 45
        run: node scripts/ci/windows-shell-interactive.mjs
      - name: Bind WebView2 acceptance to the final installer
        id: shell-evidence
        if: ${{ !cancelled() && steps.shell-interaction.outcome == 'success' }}
        # Runner scripts are UTF-8 without a BOM; Windows PowerShell 5 reads ANSI.
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem release/ZhiYuanAgent-Setup-*.exe -File)
          if ($setup.Count -ne 1) { throw 'Expected exactly one final WebView2 installer' }
          $app = Join-Path $env:RUNNER_TEMP 'zhiyuan-shell-acceptance/安装路径/知远.exe'
          node scripts/ci/windows-shell-evidence.mjs acceptance-diagnostics/shell-interactive $setup[0].FullName $app
          if ($LASTEXITCODE -ne 0) { throw 'Final WebView2 evidence did not match this build' }
      - name: Verify native uninstall of the real WebView2 installation
        if: ${{ !cancelled() && steps.shell-evidence.outcome == 'success' }}
        timeout-minutes: 15
        shell: powershell
        run: ./scripts/ci/windows-shell-uninstall.ps1 -Action verify
      - name: Upload real installer interaction evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-interaction
          path: acceptance-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save shared packaging caches from verified main builds
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.packaging-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            vendor/engram-runtime
            vendor/channel-runtime
          key: ${{ steps.packaging-cache.outputs.cache-primary-key }}
      - name: Collect installer diagnostics
        if: ${{ failure() }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path installer-diagnostics -Force | Out-Null
          $timingLog = Join-Path $env:APPDATA 'ZhiYuanAgent\install-timing.log'
          if (Test-Path -LiteralPath $timingLog) {
            Copy-Item -LiteralPath $timingLog -Destination installer-diagnostics\install-timing.log -Force
          }
      - name: Upload installer diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-diagnostics
          path: |
            release/*.exe
            scripts/installer-shell/out/ZhiYuanSetupShell.exe
            scripts/installer-shell/out/ZhiYuanUninstall.exe
            scripts/installer-shell/out/ZhiYuanUninstall.exe.manifest.json
            scripts/installer-shell/out/setup-size.json
            installer-diagnostics/install-timing.log
            ${{ runner.temp }}/zhiyuan-build-logs
          if-no-files-found: ignore
          retention-days: 3
