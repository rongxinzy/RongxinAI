name: Windows installer gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-installer-pr.yml"
      - "bun.lock"
      - "package.json"
      - "electron-builder.json"
      - "build/icons/**"
      - "build/installer-assets/**"
      - "scripts/**"
      - "MCPs/**"
      - "SKILLs/**"
      - "resources/vc_redist.x64.exe"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-and-install:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Enforce retired runtime decoupling
        run: node scripts/ci/check-openclaw-decoupling.mjs
      - name: Check out the fixed cc-connect sidecar source
        uses: actions/checkout@v6
        with:
          repository: rongxinzy/pi-connect
          ref: 18cccf0898de8fcc2ac20f3a63dd2cc8a0c8bb5f
          path: .sidecars/pi-connect
          persist-credentials: false
      - name: Set up Go for the fixed cc-connect sidecar
        uses: actions/setup-go@v6
        with:
          go-version-file: .sidecars/pi-connect/go.mod
          cache-dependency-path: .sidecars/pi-connect/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            vendor/engram-runtime
          key: windows-installer-node24-bun1.3.14-${{ hashFiles('bun.lock', 'package.json', 'scripts/**') }}
          restore-keys: |
            windows-installer-node24-bun1.3.14-
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Set up offline Windows runtimes
        run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
          bun run engram:runtime:win-x64
      - name: Build complete offline installer
        # Keep a stuck packager observable and fail it before the job-level
        # timeout so the diagnostics upload below still gets a chance to run.
        timeout-minutes: 65
        shell: pwsh
        run: |
          & .\scripts\ci\run-with-heartbeat.ps1 `
            -FilePath 'bun' `
            -ArgumentList @('run', 'dist:win:offline') `
            -TimeoutMinutes 55 `
            -HeartbeatSeconds 60
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          ZHIYUAN_CC_CONNECT_SOURCE: ${{ github.workspace }}\\.sidecars\\pi-connect
      - name: Check offline installer size
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-installer-size-smoke.ps1
          -ProjectRoot ${{ github.workspace }}
      - name: Verify embedded runtimes with a clean PATH
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-runtime-smoke.ps1
          -ProjectRoot ${{ github.workspace }}
      - name: Verify cold install, cache-hit upgrade, and uninstall
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-installer-smoke.ps1
          -ProjectRoot ${{ github.workspace }}
      - name: Upload installer diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-diagnostics
          path: |
            release/*.exe
            ~/AppData/Roaming/ZhiYuanAgent/install-timing.log
            ${{ runner.temp }}/zhiyuan-build-logs
          if-no-files-found: ignore
          retention-days: 7
