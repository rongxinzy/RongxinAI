name: Windows installer gate

on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  package-and-install:
    uses: ./.github/workflows/build-inference-editions.yml
    with:
      mode: verify
      build-macos: false
      build-linux: false
      windows-inference-editions: lite
      extended-install-tests: true
