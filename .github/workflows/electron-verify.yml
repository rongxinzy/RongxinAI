name: Electron Verify

on:
  # The static SoL-Pi jiti gate needs the vite main bundle, which no ci.yml job
  # produces (its compile:electron is tsc-only). Running here keeps the gate on
  # every PR and main push without duplicating the build elsewhere.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: electron-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore build dependency caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-verify-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            electron-verify-${{ runner.os }}-1.4.0-

      - name: Install Electron Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      - name: Gate SoL-Pi jiti bundle wiring
        run: node scripts/ci/solpi-bundle-jiti-gate.cjs --static dist-electron/main.js
      - run: bun run compile:electron

      - name: Verify Build Structure
        run: |
          echo "=== Verifying dist/ structure ==="
          for f in dist/index.html; do
            if [ ! -f "$f" ]; then
              echo "? $f not found"
              exit 1
            fi
          done
          echo "? dist/ structure verified"

          echo "=== Verifying dist-electron/ structure ==="
          for f in dist-electron/main.js dist-electron/preload.js; do
            if [ ! -f "$f" ]; then
              echo "? $f not found"
              exit 1
            fi
          done
          echo "? dist-electron/ structure verified"

          echo "=== Build verification complete ==="
