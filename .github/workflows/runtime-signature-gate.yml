name: Windows runtime signature gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'scripts/ci/*authenticode*'
      - 'scripts/ci/*runtime-signatures*'
      - '.github/actions/verify-windows-runtime-signatures/**'
      - '.github/workflows/runtime-signature-gate.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'scripts/ci/*authenticode*'
      - 'scripts/ci/*runtime-signatures*'
      - '.github/actions/verify-windows-runtime-signatures/**'
      - '.github/workflows/runtime-signature-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: ./.github/actions/verify-windows-runtime-signatures
        with:
          signer-thumbprint: ${{ vars.RUNTIME_SIGNER_THUMBPRINT }}
