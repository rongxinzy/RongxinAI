name: Build platform artifacts (manual)

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS'
        required: true
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: true
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      # The bundled runtime uses pnpm upstream; Bun installs this repository.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build macOS
        run: bun run dist:mac
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/*.dmg
          retention-days: 7

  build-windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      # The bundled runtime uses pnpm upstream; Bun installs this repository.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Set up the portable Python runtime
        run: bun run setup:python-runtime
        env:
          ZHIYUAN_PORTABLE_PYTHON_ARCHIVE: ${{ secrets.WINDOWS_PYTHON_ARCHIVE }}
      - name: Build Windows
        run: bun run dist:win
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*.exe
          retention-days: 7

  build-linux:
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      # The bundled runtime uses pnpm upstream; Bun installs this repository.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Electron system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Build Linux
        run: bun run dist:linux
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 7
