name: Verify inference edition builds (manual)

on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS'
        required: true
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: true
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: verify-inference-editions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-inference-editions:
    uses: ./.github/workflows/build-inference-editions.yml
    with:
      source-ref: ${{ github.sha }}
      mode: verify
      fail-fast: false
      build-macos: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_macos) }}
      build-windows: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_windows) }}
      build-linux: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_linux) }}
    secrets:
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
