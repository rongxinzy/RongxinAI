name: Build Platforms

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: 'Build macOS'
        required: true
        default: true
        type: boolean
      build_windows:
        description: 'Build Windows'
        required: true
        default: true
        type: boolean
      build_linux:
        description: 'Build Linux'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-llamacpp-runtime-macos:
    if: ${{ github.event_name == 'push' || inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install
      - name: Build llama.cpp runtime
        run: npm run llamacpp:runtime:mac-arm64
      - name: Pack llama.cpp runtime
        run: |
          mkdir -p release
          tar -czf release/llamacpp-runtime-mac-arm64.tar.gz -C vendor/llamacpp-runtime mac-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: llamacpp-runtime-mac-arm64
          path: release/llamacpp-runtime-mac-arm64.tar.gz
          retention-days: 7

  build-llamacpp-runtime-windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install
      - name: Build llama.cpp runtime
        run: npm run llamacpp:runtime:win-x64
      - name: Pack llama.cpp runtime
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          tar -czf release/llamacpp-runtime-win-x64.tar.gz -C vendor/llamacpp-runtime win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: llamacpp-runtime-win-x64
          path: release/llamacpp-runtime-win-x64.tar.gz
          retention-days: 7

  build-llamacpp-runtime-linux:
    if: ${{ github.event_name == 'push' || inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm install
      - name: Build llama.cpp runtime
        run: npm run llamacpp:runtime:linux-x64
      - name: Pack llama.cpp runtime
        run: |
          mkdir -p release
          tar -czf release/llamacpp-runtime-linux-x64.tar.gz -C vendor/llamacpp-runtime linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: llamacpp-runtime-linux-x64
          path: release/llamacpp-runtime-linux-x64.tar.gz
          retention-days: 7

  # ========== macOS 构建 ==========
  build-macos:
    if: ${{ github.event_name == 'push' || inputs.build_macos }}
    needs: build-llamacpp-runtime-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      
      - run: npm install

      - uses: actions/download-artifact@v4
        with:
          name: llamacpp-runtime-mac-arm64
          path: release

      - name: Restore llama.cpp runtime
        run: |
          mkdir -p vendor/llamacpp-runtime
          tar -xzf release/llamacpp-runtime-mac-arm64.tar.gz -C vendor/llamacpp-runtime
          node scripts/sync-llamacpp-runtime-current.cjs mac-arm64

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build macOS
        run: npm run dist:mac
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      
      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/*.dmg
          retention-days: 7

  # ========== Windows 构建 ==========
  build-windows:
    if: ${{ github.event_name == 'push' || inputs.build_windows }}
    needs: build-llamacpp-runtime-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      
      - run: npm install

      - uses: actions/download-artifact@v4
        with:
          name: llamacpp-runtime-win-x64
          path: release

      - name: Restore llama.cpp runtime
        run: |
          New-Item -ItemType Directory -Force -Path vendor/llamacpp-runtime | Out-Null
          tar -xzf release/llamacpp-runtime-win-x64.tar.gz -C vendor/llamacpp-runtime
          node scripts/sync-llamacpp-runtime-current.cjs win-x64

      - name: Install pnpm
        run: npm install -g pnpm

      # Windows 需要 Python 运行时
      - name: Setup Python Runtime
        run: npm run setup:python-runtime
        env:
          LOBSTERAI_PORTABLE_PYTHON_ARCHIVE: ${{ secrets.WINDOWS_PYTHON_ARCHIVE }}
      
      - name: Build Windows
        run: npm run dist:win
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*.exe
          retention-days: 7

  # ========== Linux 构建 ==========
  build-linux:
    if: ${{ github.event_name == 'push' || inputs.build_linux }}
    needs: build-llamacpp-runtime-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: npm-${{ runner.os }}-
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libuuid1 libsecret-1-0
      
      - run: npm install

      - uses: actions/download-artifact@v4
        with:
          name: llamacpp-runtime-linux-x64
          path: release

      - name: Restore llama.cpp runtime
        run: |
          mkdir -p vendor/llamacpp-runtime
          tar -xzf release/llamacpp-runtime-linux-x64.tar.gz -C vendor/llamacpp-runtime
          node scripts/sync-llamacpp-runtime-current.cjs linux-x64

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build Linux
        run: npm run dist:linux
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
      
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 7

  # ========== 创建 Release ==========
  create-release:
    needs: [build-llamacpp-runtime-macos, build-llamacpp-runtime-windows, build-llamacpp-runtime-linux, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/llamacpp-runtime-mac-arm64/*.tar.gz
            artifacts/llamacpp-runtime-win-x64/*.tar.gz
            artifacts/llamacpp-runtime-linux-x64/*.tar.gz
            artifacts/macos-build/*.dmg
            artifacts/windows-build/*.exe
            artifacts/linux-build/*
          draft: true
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
