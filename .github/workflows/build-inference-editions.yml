name: Build inference editions (reusable)

on:
  workflow_call:
    inputs:
      source-ref:
        description: 'Commit, tag, or branch to build (defaults to the caller SHA)'
        type: string
        default: ''
      app-build-version:
        description: 'SemVer embedded in release artifacts (release mode only)'
        type: string
        default: ''
      extended-install-tests:
        description: 'Also run cold NSIS install, NSIS interaction drivers or Linux deb install'
        type: boolean
        default: false
      mode:
        description: 'release runs signing and candidate assembly; verify runs unsigned validation builds'
        type: string
        default: verify
      fail-fast:
        description: 'Stop other matrix legs when one build fails'
        type: boolean
        default: false
      build-macos:
        description: 'Include macOS cpu matrix legs (arm64 + x64; lite is Windows-only)'
        type: boolean
        default: true
      build-windows:
        description: 'Include Windows lite/cpu/cuda matrix legs'
        type: boolean
        default: true
      windows-inference-editions:
        description: 'Comma-separated Windows editions; PR smoke uses lite only'
        type: string
        default: 'lite,cpu,cuda'
      build-linux:
        description: 'Include Linux cpu/cuda matrix legs (lite is Windows-only)'
        type: boolean
        default: true
      linux-inference-editions:
        description: 'Comma-separated Linux editions to build (default cpu,cuda)'
        type: string
        default: 'cpu,cuda'
    secrets:
      CERTUM_USER_ID:
        required: false
      CERTUM_OTP_URI:
        required: false
      CERTUM_CERT_THUMBPRINT:
        required: false
      UPDATE_MANIFEST_KEY_ID:
        required: false
      UPDATE_MANIFEST_PUBLIC_KEY_BASE64:
        required: false
      MODELSCOPE_TOKENS:
        required: false
      MACOS_CSC_LINK:
        required: false
      MACOS_CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      cuda-matrix: ${{ steps.cuda.outputs.matrix }}
      has-cuda: ${{ steps.cuda.outputs.enabled }}
    steps:
      - id: plan
        env:
          BUILD_MACOS: ${{ inputs.build-macos }}
          WINDOWS_INFERENCE_EDITIONS: ${{ inputs.windows-inference-editions }}
          BUILD_WINDOWS: ${{ inputs.build-windows }}
          BUILD_LINUX: ${{ inputs.build-linux }}
          LINUX_INFERENCE_EDITIONS: ${{ inputs.linux-inference-editions }}
        shell: bash
        run: |
          matrix='{"include":['
          separator=''

          if [[ "$BUILD_WINDOWS" == "true" ]]; then
            IFS=',' read -r -a windows_editions <<< "$WINDOWS_INFERENCE_EDITIONS"
            for edition in "${windows_editions[@]}"; do
              [[ "$edition" =~ ^(lite|cpu|cuda)$ ]] || { echo 'Invalid Windows edition' >&2; exit 1; }
              # CUDA 12.4 nvcc rejects the VS 2026 (MSVC 14.5x) toolchain on
              # windows-latest; the CUDA leg builds on windows-2022 (VS 2022).
              runner='windows-latest'
              if [[ "$edition" == 'cuda' ]]; then runner='windows-2022'; fi
              matrix+="${separator}{\"platform\":\"windows\",\"runner\":\"${runner}\",\"artifact\":\"windows-${edition}-build\",\"runtime_target\":\"win-x64\",\"inference_edition\":\"${edition}\",\"target\":\"win32-x64-${edition}\"}"
              separator=','
            done
          fi
          # Edition matrix (krli, 2026-10-17): lite is Windows-only. Windows
          # lite/cpu/cuda, Linux cpu/cuda, macOS cpu (arm64 + x64) = 7 legs.
          # Keep in sync with scripts/release/inference-edition-targets.mjs.
          if [[ "$BUILD_LINUX" == "true" ]]; then
            IFS=',' read -r -a linux_editions <<< "$LINUX_INFERENCE_EDITIONS"
            for edition in "${linux_editions[@]}"; do
              edition="${edition// /}"
              [[ "$edition" =~ ^(cpu|cuda)$ ]] || { echo 'Invalid Linux edition' >&2; exit 1; }
              matrix+="${separator}{\"platform\":\"linux\",\"runner\":\"ubuntu-latest\",\"artifact\":\"linux-${edition}-build\",\"runtime_target\":\"linux-x64\",\"inference_edition\":\"${edition}\",\"target\":\"linux-x64-${edition}\"}"
              separator=','
            done
          fi
          if [[ "$BUILD_MACOS" == "true" ]]; then
            matrix+="${separator}{\"platform\":\"macos\",\"runner\":\"macos-latest\",\"artifact\":\"macos-arm64-cpu-build\",\"runtime_target\":\"mac-arm64\",\"arch\":\"arm64\",\"inference_edition\":\"cpu\",\"target\":\"darwin-arm64-cpu\"}"
            separator=','
            matrix+="${separator}{\"platform\":\"macos\",\"runner\":\"macos-15-intel\",\"artifact\":\"macos-x64-cpu-build\",\"runtime_target\":\"mac-x64\",\"arch\":\"x64\",\"inference_edition\":\"cpu\",\"target\":\"darwin-x64-cpu\"}"
          fi

          matrix+=']}'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - id: cuda
        shell: bash
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
        run: |
          matrix="$(jq -c '{include: [.include[] | select(.inference_edition == "cuda")]}' <<< "$MATRIX")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "enabled=$(jq '.include | length > 0' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  cuda-runtime:
    needs: plan-matrix
    if: needs.plan-matrix.outputs.has-cuda == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-matrix.outputs.cuda-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: ./.github/actions/setup-bun-workspace
      - name: Resolve runner toolchain image
        id: image
        shell: bash
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/cache-llamacpp-runtime
        with:
          mode: restore
      - name: Stage pinned CPU fallback
        run: node scripts/sync-vendor-llamacpp-cpu-edition.cjs
        env:
          LLAMACPP_CPU_TARGET_ID: ${{ matrix.runtime_target }}
      - name: Restore compiled CUDA runtime
        if: matrix.inference_edition == 'cuda'
        id: cuda-binary
        uses: actions/cache@v5
        with:
          path: vendor/llamacpp/cuda
          key: cuda-b9244-sm89-cuda12.4.1-${{ matrix.runner }}-${{ steps.image.outputs.version }}-${{ hashFiles('.github/workflows/build-inference-editions.yml', 'scripts/*llamacpp*', 'scripts/ci/*llamacpp*', 'scripts/ci/runtime-tree-integrity.cjs', 'scripts/windows-pe-imports.cjs', 'scripts/stage-linux-cuda-runtime-libs.cjs', 'scripts/ci/stage-linux-cuda-runtime-libs.sh', 'resources/llamacpp-backends/manifest.json', 'package.json') }}
      - name: Cache llama.cpp CUDA source
        if: ${{ steps.cuda-binary.outputs.cache-hit != 'true' && matrix.inference_edition == 'cuda' && matrix.platform != 'macos' }}
        uses: actions/cache@v5
        with:
          path: .cache/llama.cpp-src
          key: llamacpp-cuda-src-b9244-v1
          restore-keys: llamacpp-cuda-src-b9244-
      - name: Set up CUDA 12.4 toolkit (Windows)
        if: ${{ steps.cuda-binary.outputs.cache-hit != 'true' && matrix.inference_edition == 'cuda' && matrix.platform == 'windows' }}
        uses: Jimver/cuda-toolkit@v0.2.22
        id: cuda-toolkit
        with:
          cuda: '12.4.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'
      - name: Verify CUDA compiler (Windows)
        if: ${{ steps.cuda-binary.outputs.cache-hit != 'true' && matrix.inference_edition == 'cuda' && matrix.platform == 'windows' }}
        shell: bash
        run: nvcc --version
      - name: Prepare llama.cpp CUDA source (Windows)
        if: ${{ steps.cuda-binary.outputs.cache-hit != 'true' && matrix.inference_edition == 'cuda' && matrix.platform == 'windows' }}
        shell: bash
        run: bash scripts/ensure-llamacpp-cuda-source.sh
      - name: Install Ninja (Windows CUDA)
        if: ${{ steps.cuda-binary.outputs.cache-hit != 'true' && matrix.inference_edition == 'cuda' && matrix.platform == 'windows' }}
        run: choco install ninja -y
      - name: Set up MSVC developer environment (Windows CUDA)
        if: ${{ steps.cuda-binary.outputs.cache-hit != 'true' && matrix.inference_edition == 'cuda' && matrix.platform == 'windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile llama-server (Windows CUDA)
        if: ${{ steps.cuda-binary.outputs.cache-hit != 'true' && matrix.inference_edition == 'cuda' && matrix.platform == 'windows' }}
        shell: bash
        run: bash scripts/build-llamacpp-cuda-rtx40.sh win
      - name: Build RTX 40 CUDA llama.cpp runtime (Linux, Docker CUDA 12.4 / Ubuntu 22.04)
        if: ${{ steps.cuda-binary.outputs.cache-hit != 'true' && matrix.inference_edition == 'cuda' && matrix.platform == 'linux' }}
        shell: bash
        run: bash scripts/ci/build-llamacpp-cuda-linux-in-docker.sh
      - name: Finalize CUDA llama.cpp edition bundle
        if: ${{ steps.cuda-binary.outputs.cache-hit != 'true' && matrix.inference_edition == 'cuda' && matrix.platform != 'macos' }}
        run: node scripts/finalize-llamacpp-cuda-edition.cjs
        env:
          LLAMACPP_CUDA_PLATFORM: ${{ matrix.platform == 'windows' && 'win32' || 'linux' }}
      - name: Seal fresh CUDA runtime contents
        if: steps.cuda-binary.outputs.cache-hit != 'true'
        run: node scripts/ci/runtime-tree-integrity.cjs seal vendor/llamacpp/cuda
      - name: Verify cached CUDA contents
        run: node scripts/ci/runtime-tree-integrity.cjs verify vendor/llamacpp/cuda
      - name: Seal compiled runtime for edition packaging
        run: node scripts/ci/build-checkpoint.mjs create cuda-checkpoint '${{ matrix.target }}' vendor/llamacpp/cuda
      - uses: actions/upload-artifact@v6
        with:
          name: cuda-${{ matrix.target }}-${{ github.run_id }}
          path: cuda-checkpoint/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  windows-components:
    if: inputs.build-windows
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      ZHIYUAN_UPDATE_VARIANT: lite
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: ./.github/actions/setup-bun-workspace
      - name: Restore prepared Windows components
        uses: actions/cache@v5
        with:
          path: |
            resources/mingit
            resources/python-win
            resources/uv-win
            resources/skill-python
            resources/magpie/win32-x64
            vendor/channel-runtime
            vendor/engram-runtime
            build-tar/windows-components
          key: windows-components-v1-${{ hashFiles('bun.lock', 'package.json', 'scripts/**', 'resources/magpie/upstream.json', 'SKILLs/**', 'MCPs/**') }}
          restore-keys: windows-components-v1-
      - name: Prepare shared pinned Magpie gateway
        uses: ./.github/actions/prepare-magpie
        with:
          target: win32-x64
      - name: Build shared Windows runtimes and Skills
        shell: bash
        run: |
          bun run channel:runtime:win-x64
          bun run engram:runtime:win-x64
          bun run build:skills
          node scripts/ci/prepare-windows-components.cjs
      - name: Qualify shared compression once
        uses: ./.github/actions/verify-windows-compression
        with:
          artifact-suffix: common-${{ github.run_attempt }}
      - name: Archive prepared resources
        shell: bash
        run: >-
          node scripts/ci/build-checkpoint.mjs create prepared-resources windows-common
          resources/mingit resources/python-win resources/uv-win resources/skill-python
          resources/magpie/win32-x64 vendor/channel-runtime vendor/engram-runtime
          SKILLs MCPs build-tar/windows-components
      - uses: actions/upload-artifact@v6
        with:
          name: windows-common-${{ github.run_id }}
          path: prepared-resources/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build:
    needs: [plan-matrix, windows-components, cuda-runtime]
    if: ${{ !cancelled() && needs.plan-matrix.result == 'success' }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix: ${{ fromJSON(needs.plan-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.mode == 'release' && 'release' || '' }}
    env:
      ZHIYUAN_UPDATE_VARIANT: ${{ matrix.inference_edition }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Resolve immutable source commit
        id: source-commit
        shell: bash
        # pull_request runs check out the PR head (source-ref), while GITHUB_SHA
        # is the synthetic merge commit. Every acceptance script that binds
        # evidence to "this build" (uninstall lease, retained-uninstaller
        # manifest, shell evidence) must use the commit actually built.
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ZHIYUAN_SOURCE_COMMIT=$commit" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore llama.cpp runtime
        id: llama-runtime
        uses: ./.github/actions/cache-llamacpp-runtime
        with:
          mode: restore
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            vendor/engram-runtime
            vendor/channel-runtime
          key: packaging-${{ runner.os }}-${{ matrix.runtime_target }}-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'scripts/**') }}
          restore-keys: |
            packaging-${{ runner.os }}-${{ matrix.runtime_target }}-node24-bun1.4.0-
      - name: Install Electron system dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libatspi2.0-0 libgbm1 libgtk-3-0 libnotify4 libnss3 libsecret-1-0 \
            libxss1 libxtst6 libuuid1 xdg-utils xvfb
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Download shared Windows components
        if: matrix.platform == 'windows'
        uses: actions/download-artifact@v6
        with:
          name: windows-common-${{ github.run_id }}
          path: prepared-resources
      - name: Verify and restore shared Windows components
        if: matrix.platform == 'windows'
        run: node scripts/ci/build-checkpoint.mjs restore prepared-resources windows-common
      - name: Prepare pinned Magpie gateway for POSIX
        if: matrix.platform != 'windows'
        uses: ./.github/actions/prepare-magpie
        with:
          target: ${{ matrix.platform == 'linux' && 'linux-x64' || (matrix.arch == 'arm64' && 'darwin-arm64' || 'darwin-x64') }}
      - name: Set up installer shell SDK
        if: ${{ matrix.platform == 'windows' }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Set up POSIX runtimes
        if: ${{ matrix.platform != 'windows' }}
        run: |
          bun run setup:posix-uv-runtime
          bun run setup:posix-python-runtime
          bun run engram:runtime:${{ matrix.runtime_target }}
      - name: Sync vendor llama.cpp CPU edition
        if: ${{ matrix.inference_edition != 'lite' }}
        run: node scripts/sync-vendor-llamacpp-cpu-edition.cjs
        env:
          LLAMACPP_CPU_TARGET_ID: ${{ matrix.runtime_target }}
      - name: Download compiled CUDA runtime
        if: matrix.inference_edition == 'cuda'
        uses: actions/download-artifact@v6
        with:
          name: cuda-${{ matrix.target }}-${{ github.run_id }}
          path: cuda-checkpoint
      - name: Restore verified CUDA runtime
        if: matrix.inference_edition == 'cuda'
        run: node scripts/ci/build-checkpoint.mjs restore cuda-checkpoint '${{ matrix.target }}'
      - name: Stage bundled llama.cpp runtime
        if: ${{ matrix.inference_edition != 'lite' }}
        run: bun run prepare:inference-edition-runtime
        env:
          ZHIYUAN_UPDATE_VARIANT: ${{ matrix.inference_edition }}
      - name: Connect Certum SimplySign
        if: ${{ inputs.mode == 'release' && matrix.platform == 'windows' }}
        id: certum-signing
        uses: ./.github/actions/setup-certum-signing
        with:
          user-id: ${{ secrets.CERTUM_USER_ID }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certificate-thumbprint: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      - name: Build Windows (verify)
        if: ${{ inputs.mode == 'verify' && matrix.platform == 'windows' }}
        run: bun run package:win:prepared
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Build Windows release (lite)
        if: ${{ inputs.mode == 'release' && matrix.platform == 'windows' && matrix.inference_edition == 'lite' }}
        run: bun run package:win:prepared:signed
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Build Windows release (cpu)
        if: ${{ inputs.mode == 'release' && matrix.platform == 'windows' && matrix.inference_edition == 'cpu' }}
        run: bun run package:win:prepared:signed
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Build Windows release (cuda)
        if: ${{ inputs.mode == 'release' && matrix.platform == 'windows' && matrix.inference_edition == 'cuda' }}
        run: bun run package:win:prepared:signed
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Validate optional macOS signing credentials
        if: ${{ inputs.mode == 'release' && matrix.platform == 'macos' }}
        shell: bash
        run: |
          values=("$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID")
          provided=0
          for value in "${values[@]}"; do [[ -n "$value" ]] && provided=$((provided + 1)); done
          if [[ $provided -eq 0 ]]; then
            echo 'ZHIYUAN_MAC_AUTO_UPDATE_ENABLED=false' >> "$GITHUB_ENV"
            echo 'CSC_IDENTITY_AUTO_DISCOVERY=false' >> "$GITHUB_ENV"
            echo '::warning title=Unsigned macOS release::Apple signing credentials are unavailable.'
          elif [[ $provided -ne ${#values[@]} ]]; then
            echo 'macOS signing credentials are only partially configured' >&2
            exit 1
          else
            echo 'ZHIYUAN_MAC_AUTO_UPDATE_ENABLED=true' >> "$GITHUB_ENV"
            echo 'CSC_IDENTITY_AUTO_DISCOVERY=true' >> "$GITHUB_ENV"
          fi
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build macOS (verify)
        if: ${{ inputs.mode == 'verify' && matrix.platform == 'macos' }}
        run: node scripts/ensure-build-version.js && bun run dist:mac:${{ matrix.arch }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Build unsigned macOS release
        if: ${{ inputs.mode == 'release' && matrix.platform == 'macos' && env.ZHIYUAN_MAC_AUTO_UPDATE_ENABLED != 'true' }}
        run: node scripts/ensure-build-version.js && bun run prepare:update-release && bun run dist:mac:${{ matrix.arch }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Build signed macOS release
        if: ${{ inputs.mode == 'release' && matrix.platform == 'macos' && env.ZHIYUAN_MAC_AUTO_UPDATE_ENABLED == 'true' }}
        run: node scripts/ensure-build-version.js && bun run prepare:update-release && bun run dist:mac:${{ matrix.arch }}
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Build Linux (verify)
        if: ${{ inputs.mode == 'verify' && matrix.platform == 'linux' }}
        # The CUDA llama-server is already built in Docker, finalized and staged
        # above; dist:linux:cuda would rebuild it on the host against the
        # Docker-generated CMake cache, so CUDA packages with plain dist:linux.
        run: ${{ matrix.inference_edition == 'cuda' && 'bun run dist:linux' || format('bun run dist:linux:{0}', matrix.inference_edition) }}
        env:
          ZHIYUAN_UPDATE_VARIANT: ${{ matrix.inference_edition }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Build Linux release
        if: ${{ inputs.mode == 'release' && matrix.platform == 'linux' }}
        # The CUDA llama-server is already built in Docker, finalized and staged
        # above; dist:linux:cuda would rebuild it on the host against the
        # Docker-generated CMake cache, so CUDA packages with plain dist:linux.
        run: ${{ matrix.inference_edition == 'cuda' && 'bun run dist:linux' || format('bun run dist:linux:{0}', matrix.inference_edition) }}
        env:
          ZHIYUAN_UPDATE_VARIANT: ${{ matrix.inference_edition }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Save llama.cpp runtime
        if: success()
        uses: ./.github/actions/cache-llamacpp-runtime
        with:
          mode: save
          cache-hit: ${{ steps.llama-runtime.outputs.cache-hit }}
          cache-primary-key: ${{ steps.llama-runtime.outputs.cache-primary-key }}
      - name: Checkpoint exact packaged bytes before acceptance
        shell: bash
        env:
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
        run: |
          paths=(release)
          if [[ '${{ matrix.platform }}' == windows ]]; then paths+=(build-tar/windows-components scripts/installer-shell/out); fi
          if [[ '${{ matrix.inference_edition }}' != lite ]]; then paths+=(resources/llamacpp-bundled); fi
          node scripts/ci/build-checkpoint.mjs create package-checkpoint '${{ matrix.target }}' "${paths[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.target }}-${{ github.run_id }}
          path: package-checkpoint/
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  acceptance:
    needs: [plan-matrix, build]
    # Accept successful targets even if another build fails; missing artifacts fail closed.
    if: ${{ !cancelled() && needs.plan-matrix.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.mode == 'release' && 'release' || '' }}
    timeout-minutes: ${{ inputs.extended-install-tests && 120 || 60 }}
    env:
      ZHIYUAN_UPDATE_VARIANT: ${{ matrix.inference_edition }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Resolve immutable source commit
        id: source-commit
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "ZHIYUAN_SOURCE_COMMIT=$commit" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-bun-workspace
      - uses: actions/download-artifact@v6
        with:
          name: package-${{ matrix.target }}-${{ github.run_id }}
          path: package-checkpoint
      - name: Verify and restore exact packaged bytes
        env:
          APP_BUILD_VERSION: ${{ inputs.app-build-version }}
        run: node scripts/ci/build-checkpoint.mjs restore package-checkpoint '${{ matrix.target }}'
      - name: Install Linux acceptance libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libatspi2.0-0 libgbm1 libgtk-3-0 libnotify4 libnss3 libsecret-1-0 libxss1 libxtst6 libuuid1 xdg-utils xvfb
      - name: Smoke bundled llama-server
        if: ${{ matrix.inference_edition != 'lite' }}
        shell: bash
        run: |
          set -euo pipefail
          root=resources/llamacpp-bundled
          test -f "$root/manifest.json" || { echo "Missing $root/manifest.json" >&2; exit 1; }
          # Launch the server the manifest names, never an arbitrary find hit.
          # Hosted runners have no GPU driver (the Windows CUDA server imports
          # nvcuda.dll), so the portable CPU fallback is launched when declared;
          # every other declared executable must exist.
          node -e "const fs=require('fs');const m=require('./$root/manifest.json');for(const k of ['executable','vulkanExecutable','cpuFallbackExecutable'])if(m[k]&&!fs.existsSync('$root/'+m[k])){console.error('Declared '+k+' missing: '+m[k]);process.exit(1)}"
          launch="$(node -e "const m=require('./$root/manifest.json');process.stdout.write(m.cpuFallbackExecutable||m.executable)")"
          chmod +x "$root/$launch" 2>/dev/null || true
          "$root/$launch" --version
          node scripts/ci/measure-llamacpp-bundled.cjs "$root" "${{ matrix.target }}" "$launch"
      - name: Verify packaged ACP registry and bridges
        run: node scripts/ci/verify-packaged-acp-resources.mjs
      - name: Verify packaged release version
        if: ${{ inputs.mode == 'release' }}
        shell: bash
        run: node scripts/ci/verify-packaged-app-version.mjs '${{ inputs.app-build-version }}'
      - name: Verify signed and notarized macOS release
        if: ${{ inputs.mode == 'release' && matrix.platform == 'macos' && env.ZHIYUAN_MAC_AUTO_UPDATE_ENABLED == 'true' }}
        shell: bash
        run: |
          app_path="$(find release -maxdepth 3 -type d -name '*.app' -print -quit)"
          [[ -n "$app_path" ]] || { echo 'Packaged macOS app was not found' >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app_path"
          for attempt in 1 2 3; do
            if xcrun stapler validate "$app_path"; then break; fi
            if [[ "$attempt" == 3 ]]; then
              echo 'macOS notarization ticket validation failed after 3 attempts' >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          node scripts/ci/verify-packaged-magpie-signature.mjs "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
      - name: Verify Windows Authenticode signatures
        if: ${{ inputs.mode == 'release' && matrix.platform == 'windows' }}
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/verify-windows-authenticode.ps1
          -ProjectRoot '${{ github.workspace }}'
          -ExpectedThumbprint '${{ secrets.CERTUM_CERT_THUMBPRINT }}'
      - name: Verify Windows release size
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        env:
          ZHIYUAN_UPDATE_VARIANT: ${{ matrix.inference_edition }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci/windows-installer-size-smoke.ps1 -ProjectRoot '${{ github.workspace }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows package runtimes with a clean PATH
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        env:
          ZHIYUAN_UPDATE_VARIANT: ${{ matrix.inference_edition }}
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-runtime-smoke.ps1
          -ProjectRoot '${{ github.workspace }}'
      - name: Verify shared compression qualification matches packaged bytes
        if: matrix.platform == 'windows'
        run: node scripts/ci/compression-qualification.cjs verify
      - name: Prepare isolated native uninstall acceptance
        id: acceptance-ownership
        if: matrix.platform == 'windows'
        shell: powershell
        run: ./scripts/ci/windows-shell-uninstall.ps1 -Action prepare
      - name: Validate real Windows interaction drivers
        if: inputs.extended-install-tests && matrix.platform == 'windows'
        # These suites spawn real PowerShell processes and a C# compiler. Avoid
        # cross-suite CPU contention on the hosted runner; retain every timeout.
        run: bunx vitest run --maxWorkers=1 scripts/ci/windows-installer-size-smoke.test.ts scripts/ci/windows-installer-interactive.test.ts scripts/ci/windows-shell-interactive.test.ts scripts/ci/windows-shell-uninstall.test.ts scripts/installer-shell/app/engine-contracts.test.ts scripts/installer-shell/preview-ui.test.ts scripts/installer-shell/powershell-environment.test.ts scripts/installer/cleanup-after-install.test.ts scripts/installer/recover-component-switch.test.ts scripts/installer/migrate-user-skills.test.ts scripts/installer/validate-install-root.test.ts tests/nsis-installer.test.ts
      - name: Verify Windows cold install, cache-hit upgrade, and uninstall
        if: ${{ (inputs.mode == 'release' || inputs.extended-install-tests) && matrix.platform == 'windows' }}
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-installer-smoke.ps1
          -ProjectRoot '${{ github.workspace }}'
      - name: Verify real NSIS install, completion, launch, cancel, and retry
        if: inputs.extended-install-tests && matrix.platform == 'windows'
        timeout-minutes: 40
        shell: powershell
        run: ./scripts/ci/windows-installer-interactive.ps1
      - name: Verify the packaged renderer in a virtual Ubuntu desktop
        if: ${{ inputs.mode == 'verify' && matrix.platform == 'linux' }}
        run: >-
          node scripts/verify-linux-renderer.mjs
          release/linux-unpacked
          release/linux-render-smoke.png
      - name: Verify the Linux renderer
        if: ${{ inputs.mode == 'release' && matrix.platform == 'linux' }}
        run: xvfb-run -a node scripts/verify-linux-renderer.mjs release/linux-unpacked release/linux-render-smoke.png
      - name: Install and start the exact Linux release deb
        if: ${{ (inputs.mode == 'release' || inputs.extended-install-tests) && matrix.platform == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(release/*.deb)
          [[ ${#debs[@]} -eq 1 ]] || { echo 'Expected exactly one Linux deb package' >&2; exit 1; }
          sudo apt-get install -y "$(realpath "${debs[0]}")"
          app_exec="$(node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('electron-builder.json','utf8'));process.stdout.write('/opt/'+c.productName+'/'+(c.executableName||c.productName));")"
          test -x "$app_exec" || {
            echo "Installed Linux executable is missing: $app_exec" >&2
            ls -d /opt/*/ >&2 || true
            exit 1
          }
          node scripts/verify-linux-renderer.mjs "$app_exec" release/linux-deb-install-smoke.png
      - name: Verify final WebView2 installer and bind evidence
        id: shell-evidence
        # Keep shell diagnostics independent of an earlier NSIS failure.
        if: ${{ !cancelled() && matrix.platform == 'windows' && steps.acceptance-ownership.outcome == 'success' }}
        shell: pwsh
        run: |
          node scripts/ci/windows-shell-interactive.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Shell interactive acceptance failed.' }
          $installer = @(Get-ChildItem -LiteralPath release -Filter 'ZhiYuanAgent-Setup-*.exe' -File)
          if ($installer.Count -ne 1) { throw 'Expected exactly one shell installer.' }
          $installed = Join-Path $env:RUNNER_TEMP 'zhiyuan-shell-acceptance/安装路径/知远.exe'
          node scripts/ci/windows-shell-evidence.mjs acceptance-diagnostics/shell-interactive $installer[0].FullName $installed
          if ($LASTEXITCODE -ne 0) { throw 'Shell evidence is invalid.' }
      - name: Verify native uninstall preserves user data
        if: ${{ !cancelled() && matrix.platform == 'windows' && steps.shell-evidence.outcome == 'success' }}
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-shell-uninstall.ps1 -Action verify
          -ExpectedThumbprint '${{ inputs.mode == 'release' && secrets.CERTUM_CERT_THUMBPRINT || '' }}'
      - name: Collect Windows diagnostics before leaving the runner
        if: ${{ always() && matrix.platform == 'windows' }}
        shell: powershell
        run: ./scripts/ci/collect-windows-diagnostics.ps1
      - name: Upload shell acceptance evidence
        if: ${{ always() && inputs.mode == 'verify' && matrix.platform == 'windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: shell-acceptance-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-diagnostics
          if-no-files-found: error
          retention-days: 7
      - name: Upload signed shell acceptance evidence
        if: ${{ always() && inputs.mode == 'release' && matrix.platform == 'windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: signed-shell-acceptance-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-diagnostics
          if-no-files-found: error
          retention-days: 7
      - name: Assemble Windows release payload
        if: ${{ inputs.mode == 'release' && matrix.platform == 'windows' }}
        shell: bash
        env:
          EDITION: ${{ matrix.inference_edition }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(release/ZhiYuanAgent-Setup-*.exe)
          updaters=()
          for file in release/*.exe; do
            [[ "$(basename "$file")" == ZhiYuanAgent-Setup-* ]] || updaters+=("$file")
          done
          blockmaps=(release/*.exe.blockmap)
          [[ ${#installers[@]} -eq 1 && ${#updaters[@]} -eq 1 && ${#blockmaps[@]} -eq 1 ]] || { echo 'Expected one WebView2 installer, NSIS updater, and updater blockmap' >&2; exit 1; }
          [[ "${blockmaps[0]}" == "${updaters[0]}.blockmap" ]] || { echo 'Blockmap must belong to the NSIS updater' >&2; exit 1; }
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ inputs.app-build-version }}' win32 x64 "$EDITION" \
            release/latest.yml release/electron-updater/latest.yml
          node scripts/release/create-release-candidate.mjs \
            '${{ inputs.app-build-version }}' \
            '${{ steps.source-commit.outputs.commit }}' \
            '${{ github.run_id }}' candidate "candidate-win32-x64-${EDITION}.json" \
            "${installers[0]}:win32:x64:${EDITION}:installer" \
            "${updaters[0]}:win32:x64:${EDITION}:updater" \
            "${blockmaps[0]}:win32:x64:${EDITION}:blockmap" \
            "release/electron-updater/latest.yml:win32:x64:${EDITION}:metadata"
      - name: Assemble macOS release payload
        if: ${{ inputs.mode == 'release' && matrix.platform == 'macos' }}
        shell: bash
        env:
          EDITION: ${{ matrix.inference_edition }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          blockmaps=(release/*.zip.blockmap)
          [[ ${#dmgs[@]} -eq 1 && ${#zips[@]} -eq 1 && ${#blockmaps[@]} -eq 1 ]] || { echo 'Expected one macOS DMG, ZIP, and blockmap' >&2; exit 1; }
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ inputs.app-build-version }}' darwin '${{ matrix.arch }}' "$EDITION" \
            release/latest-mac.yml release/electron-updater/latest-mac.yml
          node scripts/release/create-release-candidate.mjs \
            '${{ inputs.app-build-version }}' \
            '${{ steps.source-commit.outputs.commit }}' \
            '${{ github.run_id }}' candidate "candidate-darwin-${{ matrix.arch }}-${EDITION}.json" \
            "${dmgs[0]}:darwin:${{ matrix.arch }}:${EDITION}:installer" \
            "${zips[0]}:darwin:${{ matrix.arch }}:${EDITION}:updater" \
            "${blockmaps[0]}:darwin:${{ matrix.arch }}:${EDITION}:blockmap" \
            "release/electron-updater/latest-mac.yml:darwin:${{ matrix.arch }}:${EDITION}:metadata"
      - name: Assemble Linux release payload
        if: ${{ inputs.mode == 'release' && matrix.platform == 'linux' }}
        shell: bash
        env:
          EDITION: ${{ matrix.inference_edition }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(release/*.deb)
          appimages=(release/*.AppImage)
          [[ ${#debs[@]} -eq 1 && ${#appimages[@]} -eq 1 ]] || { echo 'Expected one Linux deb and AppImage' >&2; exit 1; }
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ inputs.app-build-version }}' linux x64 "appimage-${EDITION}" \
            release/latest-linux.yml release/electron-updater/latest-linux.yml
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ inputs.app-build-version }}' linux x64 "deb-${EDITION}" \
            release/latest-linux.yml release/electron-updater/deb/latest-linux.yml
          node scripts/release/create-release-candidate.mjs \
            '${{ inputs.app-build-version }}' \
            '${{ steps.source-commit.outputs.commit }}' \
            '${{ github.run_id }}' candidate "candidate-linux-x64-${EDITION}.json" \
            "${debs[0]}:linux:x64:deb-${EDITION}:installer" \
            "${debs[0]}:linux:x64:deb-${EDITION}:updater" \
            "release/electron-updater/deb/latest-linux.yml:linux:x64:deb-${EDITION}:metadata" \
            "${appimages[0]}:linux:x64:appimage-${EDITION}:installer" \
            "${appimages[0]}:linux:x64:appimage-${EDITION}:updater" \
            "release/electron-updater/latest-linux.yml:linux:x64:appimage-${EDITION}:metadata"
      - name: Upload release payload
        if: ${{ inputs.mode == 'release' }}
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ inputs.app-build-version }}-${{ matrix.target }}
          path: candidate/
          compression-level: 0
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: ${{ inputs.mode == 'verify' && matrix.platform == 'macos' }}
        with:
          name: ${{ matrix.artifact }}
          path: release/*.dmg
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: ${{ inputs.mode == 'verify' && matrix.platform == 'windows' }}
        with:
          name: ${{ matrix.artifact }}
          path: release/*.exe
          retention-days: 7
      - uses: actions/upload-artifact@v6
        if: ${{ always() && inputs.mode == 'verify' && matrix.platform == 'linux' }}
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/linux-render-smoke.png
            release/linux-deb-install-smoke.png
          retention-days: 7
