name: Publish online update

on:
  push:
    branches: [release]

concurrency:
  group: zhiyuan-online-update-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_BUCKET: zhiyuan-releases

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=$(date -u +%Y.%-m.%-d)-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build-windows-lite:
    needs: prepare-release
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.x' }
      - run: npm install
      - run: npm run setup:python-runtime
        env:
          ZHIYUAN_PORTABLE_PYTHON_ARCHIVE: ${{ secrets.WINDOWS_PYTHON_ARCHIVE }}
      - run: npm run dist:win:lite
        env:
          APP_BUILD_VERSION: ${{ needs.prepare-release.outputs.version }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - uses: actions/upload-artifact@v4
        with: { name: win32-x64-lite, path: 'release/*.exe' }

  build-macos-arm64:
    needs: prepare-release
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24.x' }
      - run: npm install
      - run: node scripts/ensure-build-version.js && npm run prepare:update-release && npm run dist:mac
        env:
          APP_BUILD_VERSION: ${{ needs.prepare-release.outputs.version }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - uses: actions/upload-artifact@v4
        with: { name: darwin-arm64-default, path: 'release/*.dmg' }

  publish:
    needs: [prepare-release, build-windows-lite, build-macos-arm64]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: actions/setup-node@v4
        with: { node-version: '24.x' }
      - name: Install release tools
        run: |
          pipx install 'awscli>=1.45.10,<2'
          npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
      - name: Resolve artifacts
        id: artifacts
        run: |
          mapfile -t windows_artifacts < <(find artifacts/win32-x64-lite -type f -name '*.exe')
          mapfile -t macos_artifacts < <(find artifacts/darwin-arm64-default -type f -name '*.dmg')
          if [[ ${#windows_artifacts[@]} -ne 1 || ${#macos_artifacts[@]} -ne 1 ]]; then
            echo 'Expected exactly one Windows installer and one macOS installer' >&2
            exit 1
          fi
          echo "windows=${windows_artifacts[0]}" >> "$GITHUB_OUTPUT"
          echo "macos=${macos_artifacts[0]}" >> "$GITHUB_OUTPUT"
      - name: Create and verify signed manifest
        run: |
          node scripts/release/publish-update-manifest.mjs \
            manifest/stable.json \
            '${{ needs.prepare-release.outputs.version }}' \
            "$GITHUB_SHA" \
            '${{ steps.artifacts.outputs.windows }}:win32:x64:lite' \
            '${{ steps.artifacts.outputs.macos }}:darwin:arm64:default'
        env:
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
      - name: Read current stable manifest
        id: current
        run: |
          set +e
          aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key channels/stable.json \
            > manifest/current-head.json 2> manifest/current-head.err
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            aws s3api get-object \
              --bucket "$R2_BUCKET" \
              --key channels/stable.json \
              manifest/current.json > /dev/null
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "etag=$(jq -r '.ETag' manifest/current-head.json)" >> "$GITHUB_OUTPUT"
          elif grep -Eq '404|Not Found|NoSuchKey' manifest/current-head.err; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat manifest/current-head.err >&2
            exit "$status"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Enforce monotonic release version
        id: version_check
        run: |
          current_path='-'
          if [[ '${{ steps.current.outputs.exists }}' == 'true' ]]; then
            current_path='manifest/current.json'
          fi
          node scripts/release/verify-update-transition.mjs \
            "$current_path" \
            manifest/stable.json \
            '${{ needs.prepare-release.outputs.version }}'
        env:
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      - name: Upload immutable artifacts and verify remote sizes
        if: steps.version_check.outputs.idempotent != 'true'
        run: |
          version='${{ needs.prepare-release.outputs.version }}'
          windows_path='${{ steps.artifacts.outputs.windows }}'
          macos_path='${{ steps.artifacts.outputs.macos }}'
          windows_key="releases/$version/win32-x64-lite/$(basename "$windows_path")"
          macos_key="releases/$version/darwin-arm64-default/$(basename "$macos_path")"

          aws s3 cp "$windows_path" "s3://$R2_BUCKET/$windows_key" \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp "$macos_path" "s3://$R2_BUCKET/$macos_key" \
            --cache-control 'public, max-age=31536000, immutable'

          windows_remote_size=$(aws s3api head-object --bucket "$R2_BUCKET" --key "$windows_key" --query ContentLength --output text)
          macos_remote_size=$(aws s3api head-object --bucket "$R2_BUCKET" --key "$macos_key" --query ContentLength --output text)
          [[ "$windows_remote_size" == "$(stat --format='%s' "$windows_path")" ]]
          [[ "$macos_remote_size" == "$(stat --format='%s' "$macos_path")" ]]
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Preserve previous stable manifest
        if: steps.version_check.outputs.idempotent != 'true' && steps.current.outputs.exists == 'true'
        run: |
          aws s3api put-object \
            --bucket "$R2_BUCKET" \
            --key channels/stable.previous.json \
            --body manifest/current.json \
            --content-type application/json \
            --cache-control no-store
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Conditionally publish stable manifest
        id: publish
        if: steps.version_check.outputs.idempotent != 'true'
        run: |
          conditional_args=(--if-none-match '*')
          if [[ '${{ steps.current.outputs.exists }}' == 'true' ]]; then
            conditional_args=(--if-match '${{ steps.current.outputs.etag }}')
          fi
          aws s3api put-object \
            --bucket "$R2_BUCKET" \
            --key channels/stable.json \
            --body manifest/stable.json \
            --content-type application/json \
            --cache-control no-store \
            "${conditional_args[@]}" \
            > manifest/publish-result.json
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "etag=$(jq -r '.ETag' manifest/publish-result.json)" >> "$GITHUB_OUTPUT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Smoke test published release and roll back on failure
        run: |
          set +e
          node scripts/release/verify-published-update.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            win32:x64:lite \
            darwin:arm64:default
          smoke_status=$?
          set -e

          if [[ $smoke_status -ne 0 && '${{ steps.publish.outputs.changed }}' == 'true' ]]; then
            if [[ '${{ steps.current.outputs.exists }}' == 'true' ]]; then
              aws s3api put-object \
                --bucket "$R2_BUCKET" \
                --key channels/stable.json \
                --body manifest/current.json \
                --content-type application/json \
                --cache-control no-store \
                --if-match '${{ steps.publish.outputs.etag }}'
            else
              published_etag=$(aws s3api head-object --bucket "$R2_BUCKET" --key channels/stable.json --query ETag --output text)
              if [[ "$published_etag" != '${{ steps.publish.outputs.etag }}' ]]; then
                echo 'Stable manifest changed concurrently; refusing an unsafe rollback' >&2
                exit 1
              fi
              aws s3api delete-object --bucket "$R2_BUCKET" --key channels/stable.json
            fi
          fi
          exit "$smoke_status"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
