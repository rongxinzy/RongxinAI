name: Publish online update

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: zhiyuan-online-update-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_BUCKET: zhiyuan-releases

jobs:
  prepare-release:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Derive and validate the release version from the tag
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Release tags must use v<semver>, for example v2026.7.28-build.1" >&2
            exit 1
          fi
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Ensure the tagged commit is already in main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag must point to a commit reachable from origin/main" >&2
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

  quality:
    uses: ./.github/workflows/ci.yml

  supply-chain-gate:
    needs: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - name: Enforce retired runtime decoupling
        run: node scripts/ci/check-openclaw-decoupling.mjs
      - uses: actions/setup-node@v6
        with: { node-version: '24.x' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.0' }
      # Installs only the exact Bun lockfile graph and never runs dependency
      # lifecycle scripts. This catches a lockfile/integrity mismatch before
      # a release build begins.
      - name: Verify frozen Bun dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      # Verifies npm registry signatures for every checked-in npm lockfile.
      # This is intentionally not `npm audit`: known CVEs are not a release
      # gate here; registry provenance and tampered package metadata are.
      - name: Verify npm package signatures
        shell: bash
        run: |
          set -euo pipefail
          for lockfile in \
            SKILLs/presentation-studio/package-lock.json \
            SKILLs/web-search/package-lock.json \
            scripts/release/package-lock.json; do
            directory="$(dirname "$lockfile")"
            # npm's signature command needs the child package tree on disk.
            # Keep its lifecycle scripts disabled while materializing exactly
            # the package-lock graph for each bundled child project.
            if [[ "$directory" != '.' ]]; then
              npm --prefix "$directory" ci --ignore-scripts
            fi
            npm --prefix "$directory" audit signatures --package-lock-only --ignore-scripts
          done
      - name: Enforce approved package sources
        run: bun run check:supply-chain-inputs

  build-platforms:
    needs: [prepare-release, supply-chain-gate]
    strategy:
      # A release is only valid when every platform artifact is available.
      # Cancel sibling builds as soon as one platform fails.
      fail-fast: true
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            artifact: win32-x64-lite
            runtime_target: win-x64
          - platform: macos
            runner: macos-latest
            artifact: darwin-arm64-default
            runtime_target: mac-arm64
          - platform: linux
            runner: ubuntu-latest
            artifact: linux-x64-default
            runtime_target: linux-x64
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/setup-node@v6
        with: { node-version: '24.x' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.0' }
      # These are application-bundled runtimes, not package-manager caches.
      # GitLab's release runners retain them independently; keep the same
      # boundary here so changing an unrelated build script does not require
      # re-downloading Python or uv for every release platform.
      - name: Restore bundled runtime cache
        uses: actions/cache@v5
        with:
          path: |
            resources/python-win
            resources/uv-win
            resources/python-mac
            resources/uv-mac
            resources/python-linux
            resources/uv-linux
            resources/uv-archives
          key: bundled-runtimes-${{ runner.os }}-${{ matrix.runtime_target }}-${{ hashFiles('scripts/setup-python-runtime.js', 'scripts/setup-uv-runtime.js', 'scripts/setup-mac-python-runtime.js', 'scripts/setup-mac-uv-runtime.js', 'electron-builder.json') }}
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            vendor/channel-runtime
          key: packaging-${{ runner.os }}-${{ matrix.runtime_target }}-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'scripts/**') }}
          restore-keys: |
            packaging-${{ runner.os }}-${{ matrix.runtime_target }}-node24-bun1.4.0-
      - name: Install Electron and virtual desktop dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libatspi2.0-0 libgbm1 libgtk-3-0 libnotify4 libnss3 libsecret-1-0 \
            libxss1 libxtst6 libuuid1 xdg-utils xvfb
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Set up Windows runtimes
        if: ${{ matrix.platform == 'windows' }}
        run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
      - name: Set up POSIX runtimes
        if: ${{ matrix.platform != 'windows' }}
        run: |
          bun run setup:posix-uv-runtime
          bun run setup:posix-python-runtime
      - name: Connect Certum SimplySign
        if: ${{ matrix.platform == 'windows' }}
        id: certum-signing
        uses: ./.github/actions/setup-certum-signing
        with:
          user-id: ${{ secrets.CERTUM_USER_ID }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certificate-thumbprint: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      - name: Build Windows package
        if: ${{ matrix.platform == 'windows' }}
        run: bun run dist:win:signed
        env:
          APP_BUILD_VERSION: ${{ needs.prepare-release.outputs.version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Validate optional macOS signing and notarization credentials
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          names=(
            MACOS_CSC_LINK
            MACOS_CSC_KEY_PASSWORD
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_TEAM_ID
          )
          values=(
            "$CSC_LINK"
            "$CSC_KEY_PASSWORD"
            "$APPLE_ID"
            "$APPLE_APP_SPECIFIC_PASSWORD"
            "$APPLE_TEAM_ID"
          )
          provided=0
          missing=()
          for index in "${!names[@]}"; do
            if [[ -n "${values[$index]}" ]]; then
              provided=$((provided + 1))
            else
              missing+=("${names[$index]}")
            fi
          done
          if [[ $provided -eq 0 ]]; then
            echo 'ZHIYUAN_MAC_AUTO_UPDATE_ENABLED=false' >> "$GITHUB_ENV"
            echo 'CSC_IDENTITY_AUTO_DISCOVERY=false' >> "$GITHUB_ENV"
            echo '::warning title=Manual macOS updates::Apple credentials are unavailable. The macOS package will be built unsigned and unnotarized with in-app automatic installation disabled.'
          elif [[ ${#missing[@]} -gt 0 ]]; then
            printf 'Partially configured macOS release credentials; missing secret: %s\n' "${missing[@]}" >&2
            exit 1
          else
            echo 'ZHIYUAN_MAC_AUTO_UPDATE_ENABLED=true' >> "$GITHUB_ENV"
            echo 'CSC_IDENTITY_AUTO_DISCOVERY=true' >> "$GITHUB_ENV"
            echo '::notice title=Signed macOS release::Code signing and notarization credentials are configured.'
          fi
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build unsigned macOS package
        if: ${{ matrix.platform == 'macos' && env.ZHIYUAN_MAC_AUTO_UPDATE_ENABLED != 'true' }}
        run: node scripts/ensure-build-version.js && bun run prepare:update-release && bun run dist:mac
        env:
          APP_BUILD_VERSION: ${{ needs.prepare-release.outputs.version }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Build signed macOS package
        if: ${{ matrix.platform == 'macos' && env.ZHIYUAN_MAC_AUTO_UPDATE_ENABLED == 'true' }}
        run: node scripts/ensure-build-version.js && bun run prepare:update-release && bun run dist:mac
        env:
          APP_BUILD_VERSION: ${{ needs.prepare-release.outputs.version }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Verify signed and notarized macOS app
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          if [[ "$ZHIYUAN_MAC_AUTO_UPDATE_ENABLED" != 'true' ]]; then
            echo 'macOS signing verification skipped for the manual-update build.'
            exit 0
          fi
          app_path="$(find release -maxdepth 3 -type d -name '*.app' -print -quit)"
          [[ -n "$app_path" ]] || { echo 'Packaged macOS app was not found' >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
      - name: Build Linux packages
        if: ${{ matrix.platform == 'linux' }}
        run: bun run dist:linux
        env:
          APP_BUILD_VERSION: ${{ needs.prepare-release.outputs.version }}
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Verify packaged app version
        shell: bash
        run: node scripts/ci/verify-packaged-app-version.mjs '${{ needs.prepare-release.outputs.version }}'
      - name: Verify Windows Authenticode signatures
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/verify-windows-authenticode.ps1
          -ProjectRoot ${{ github.workspace }}
          -ExpectedThumbprint '${{ steps.certum-signing.outputs.thumbprint }}'
      - name: Verify Windows package runtimes with a clean PATH
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-runtime-smoke.ps1
          -ProjectRoot ${{ github.workspace }}
      - name: Qualify Windows compression before publication
        if: ${{ matrix.platform == 'windows' }}
        uses: ./.github/actions/verify-windows-compression
      - name: Verify the packaged renderer in a virtual Ubuntu desktop
        if: ${{ matrix.platform == 'linux' }}
        run: >-
          node scripts/verify-linux-renderer.mjs
          release/linux-unpacked
          release/linux-render-smoke.png
      # Uploading installers directly from their platform runner avoids the
      # GitHub artifact upload -> download -> R2 upload relay. The signed
      # stable manifest is still withheld until every matrix job succeeds.
      - name: Upload Windows immutable artifact to R2
        if: ${{ matrix.platform == 'windows' }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.exe)
          blockmaps=(release/*.exe.blockmap)
          [[ ${#files[@]} -eq 1 && ${#blockmaps[@]} -eq 1 ]] || { echo 'Expected exactly one Windows installer and blockmap' >&2; exit 1; }
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ needs.prepare-release.outputs.version }}' win32 x64 lite \
            release/latest.yml release/electron-updater/latest.yml
          node scripts/release/upload-update-artifacts.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            update-artifacts.json \
            "${files[0]}:win32:x64:lite:installer" \
            "${files[0]}:win32:x64:lite:updater" \
            "${blockmaps[0]}:win32:x64:lite:blockmap" \
            "release/electron-updater/latest.yml:win32:x64:lite:metadata"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Upload macOS immutable artifact to R2
        if: ${{ matrix.platform == 'macos' }}
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          blockmaps=(release/*.zip.blockmap)
          [[ ${#dmgs[@]} -eq 1 && ${#zips[@]} -eq 1 && ${#blockmaps[@]} -eq 1 ]] || { echo 'Expected exactly one macOS DMG, update ZIP, and ZIP blockmap' >&2; exit 1; }
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ needs.prepare-release.outputs.version }}' darwin arm64 default \
            release/latest-mac.yml release/electron-updater/latest-mac.yml
          node scripts/release/upload-update-artifacts.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            update-artifacts.json \
            "${dmgs[0]}:darwin:arm64:default:installer" \
            "${zips[0]}:darwin:arm64:default:updater" \
            "${blockmaps[0]}:darwin:arm64:default:blockmap" \
            "release/electron-updater/latest-mac.yml:darwin:arm64:default:metadata"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Upload Linux immutable artifacts to R2
        if: ${{ matrix.platform == 'linux' }}
        run: |
          shopt -s nullglob
          debs=(release/*.deb)
          appimages=(release/*.AppImage)
          [[ ${#debs[@]} -eq 1 && ${#appimages[@]} -eq 1 ]] || { echo 'Expected exactly one deb and AppImage' >&2; exit 1; }
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ needs.prepare-release.outputs.version }}' linux x64 appimage \
            release/latest-linux.yml release/electron-updater/latest-linux.yml
          node scripts/release/normalize-electron-updater-metadata.mjs \
            '${{ needs.prepare-release.outputs.version }}' linux x64 deb \
            release/latest-linux.yml release/electron-updater/deb/latest-linux.yml
          node scripts/release/upload-update-artifacts.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            update-artifacts.json \
            "${debs[0]}:linux:x64:deb:installer" \
            "${debs[0]}:linux:x64:deb:updater" \
            "${appimages[0]}:linux:x64:appimage:installer" \
            "${appimages[0]}:linux:x64:appimage:updater" \
            "release/electron-updater/latest-linux.yml:linux:x64:appimage:metadata" \
            "release/electron-updater/deb/latest-linux.yml:linux:x64:deb:metadata"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Upload immutable artifact metadata
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-metadata
          path: update-artifacts.json
          retention-days: 7

  publish:
    needs: [prepare-release, build-platforms]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.commit }}
      - uses: actions/download-artifact@v8
        with: { path: artifacts }
      - uses: actions/setup-node@v6
        with: { node-version: '24.x' }
      - name: Install release tools
        run: |
          pipx install 'awscli>=1.45.10,<2'
          npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
      - name: Resolve uploaded artifact metadata
        run: |
          mapfile -t metadata < <(find artifacts -type f -name update-artifacts.json | sort)
          if [[ ${#metadata[@]} -ne 3 ]]; then
            echo 'Expected exactly three platform artifact metadata files' >&2
            exit 1
          fi
          jq -e 'all(.artifacts[]; .key and .size and .sha256 and .sha512 and .kind)' "${metadata[@]}" > /dev/null
      - name: Create and verify signed manifest
        run: |
          node scripts/release/publish-update-manifest.mjs \
            manifest/stable.json \
            '${{ needs.prepare-release.outputs.version }}' \
            '${{ needs.prepare-release.outputs.commit }}' \
            --metadata \
            $(find artifacts -type f -name update-artifacts.json | sort)
        env:
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY_BASE64 }}
      - name: Read the current stable generation
        id: current
        run: |
          mkdir -p manifest
          set +e
          aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key channels/stable-pointer.json \
            > manifest/current-pointer-head.json 2> manifest/current-pointer-head.err
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            aws s3api get-object \
              --bucket "$R2_BUCKET" \
              --key channels/stable-pointer.json \
              manifest/current-pointer.json > /dev/null
            generation="$(jq -er '
              select(.schemaVersion == 1)
              | select(.generation | type == "string" and test("^[A-Za-z0-9._-]+$"))
              | .generation
            ' manifest/current-pointer.json)"
            aws s3api get-object \
              --bucket "$R2_BUCKET" \
              --key "generations/${generation}/legacy/stable.json" \
              manifest/current.json > /dev/null
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'pointer_exists=true' >> "$GITHUB_OUTPUT"
            echo "pointer_etag=$(jq -r '.ETag' manifest/current-pointer-head.json)" >> "$GITHUB_OUTPUT"
          elif grep -Eq '404|Not Found|NoSuchKey' manifest/current-pointer-head.err; then
            set +e
            aws s3api head-object \
              --bucket "$R2_BUCKET" \
              --key channels/stable.json \
              > manifest/current-head.json 2> manifest/current-head.err
            stable_status=$?
            set -e
            if [[ $stable_status -eq 0 ]]; then
              aws s3api get-object \
                --bucket "$R2_BUCKET" \
                --key channels/stable.json \
                manifest/current.json > /dev/null
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              echo 'pointer_exists=false' >> "$GITHUB_OUTPUT"
            elif grep -Eq '404|Not Found|NoSuchKey' manifest/current-head.err; then
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              echo 'pointer_exists=false' >> "$GITHUB_OUTPUT"
            else
              cat manifest/current-head.err >&2
              exit "$stable_status"
            fi
          else
            cat manifest/current-pointer-head.err >&2
            exit "$status"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Enforce monotonic release version
        id: version_check
        run: |
          current_path='-'
          if [[ '${{ steps.current.outputs.exists }}' == 'true' ]]; then
            current_path='manifest/current.json'
          fi
          node scripts/release/verify-update-transition.mjs \
            "$current_path" \
            manifest/stable.json \
            '${{ needs.prepare-release.outputs.version }}'
        env:
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      - name: Verify parallel uploaded immutable artifacts
        if: steps.version_check.outputs.idempotent != 'true'
        run: |
          mapfile -t metadata < <(find artifacts -type f -name update-artifacts.json | sort)
          for metadata_path in "${metadata[@]}"; do
            while IFS=$'\t' read -r key size; do
              remote_size=$(aws s3api head-object \
                --bucket "$R2_BUCKET" \
                --key "$key" \
                --query ContentLength \
                --output text)
              [[ "$remote_size" == "$size" ]]
            done < <(jq -r '.artifacts[] | [.key, .size] | @tsv' "$metadata_path")
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Verify and publish the immutable update generation
        if: steps.version_check.outputs.idempotent != 'true'
        run: |
          mapfile -t metadata < <(find artifacts -type f -name update-artifacts.json | sort)
          mkdir -p manifest/electron
          while IFS=$'\t' read -r key target filename; do
            target_file="${target//:/-}"
            mkdir -p "manifest/electron/${target_file}"
            output="manifest/electron/${target_file}/${filename}"
            aws s3api get-object --bucket "$R2_BUCKET" --key "$key" "$output" > /dev/null
          done < <(
            jq -s -r '
              [.[].artifacts[] | select(.kind == "metadata")]
              | sort_by(.platform, .arch, .variant)
              | .[]
              | [.key, (.platform + ":" + .arch + ":" + .variant), .filename]
              | @tsv
            ' "${metadata[@]}"
          )
          node scripts/release/verify-electron-updater-generation.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            manifest/electron/win32-x64-lite/latest.yml:win32:x64:lite \
            manifest/electron/darwin-arm64-default/latest-mac.yml:darwin:arm64:default \
            manifest/electron/linux-x64-appimage/latest-linux.yml:linux:x64:appimage \
            manifest/electron/linux-x64-deb/latest-linux.yml:linux:x64:deb \
            --artifact-metadata "${metadata[@]}"
          generation_key='generations/${{ needs.prepare-release.outputs.version }}/legacy/stable.json'
          set +e
          aws s3api head-object --bucket "$R2_BUCKET" --key "$generation_key" \
            > manifest/generation-head.json 2> manifest/generation-head.err
          generation_status=$?
          set -e
          if [[ $generation_status -eq 0 ]]; then
            aws s3api get-object --bucket "$R2_BUCKET" --key "$generation_key" \
              manifest/existing-generation.json > /dev/null
            node scripts/release/verify-update-transition.mjs \
              manifest/existing-generation.json \
              manifest/stable.json \
              '${{ needs.prepare-release.outputs.version }}'
            cp manifest/existing-generation.json manifest/stable.json
          elif grep -Eq '404|Not Found|NoSuchKey' manifest/generation-head.err; then
            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "$generation_key" \
              --body manifest/stable.json \
              --content-type application/json \
              --cache-control 'public, max-age=31536000, immutable' \
              --if-none-match '*' > /dev/null
          else
            cat manifest/generation-head.err >&2
            exit "$generation_status"
          fi
          node scripts/release/create-update-generation-pointer.mjs \
            manifest/stable-pointer.json \
            '${{ needs.prepare-release.outputs.version }}'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
      - name: Preserve previous stable manifest
        if: steps.version_check.outputs.idempotent != 'true' && steps.current.outputs.exists == 'true'
        run: |
          aws s3api put-object \
            --bucket "$R2_BUCKET" \
            --key channels/stable.previous.json \
            --body manifest/current.json \
            --content-type application/json \
            --cache-control no-store
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Preserve previous stable generation pointer
        if: steps.version_check.outputs.idempotent != 'true' && steps.current.outputs.pointer_exists == 'true'
        run: |
          aws s3api put-object \
            --bucket "$R2_BUCKET" \
            --key channels/stable.previous-pointer.json \
            --body manifest/current-pointer.json \
            --content-type application/json \
            --cache-control no-store
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Read legacy stable manifest ETag
        id: legacy_mirror
        if: steps.version_check.outputs.idempotent != 'true'
        run: |
          set +e
          aws s3api head-object --bucket "$R2_BUCKET" --key channels/stable.json > manifest/legacy-mirror-head.json 2> manifest/legacy-mirror-head.err
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "etag=$(jq -r '.ETag' manifest/legacy-mirror-head.json)" >> "$GITHUB_OUTPUT"
          elif grep -Eq '404|Not Found|NoSuchKey' manifest/legacy-mirror-head.err; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat manifest/legacy-mirror-head.err >&2
            exit "$status"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Conditionally publish the dual-protocol stable release
        id: publish
        if: steps.version_check.outputs.idempotent != 'true'
        run: |
          legacy_args=(--if-none-match '*')
          if [[ '${{ steps.legacy_mirror.outputs.exists }}' == 'true' ]]; then
            legacy_args=(--if-match '${{ steps.legacy_mirror.outputs.etag }}')
          fi
          pointer_args=(--if-none-match '*')
          if [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]]; then
            pointer_args=(--if-match '${{ steps.current.outputs.pointer_etag }}')
          fi

          publish_legacy() {
            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key channels/stable.json \
              --body manifest/stable.json \
              --content-type application/json \
              --cache-control no-store \
              "${legacy_args[@]}" \
              > manifest/publish-legacy-result.json || return $?
            legacy_etag=$(jq -er '.ETag' manifest/publish-legacy-result.json)
          }
          publish_pointer() {
            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key channels/stable-pointer.json \
              --body manifest/stable-pointer.json \
              --content-type application/json \
              --cache-control no-store \
              "${pointer_args[@]}" \
              > manifest/publish-pointer-result.json || return $?
            pointer_etag=$(jq -er '.ETag' manifest/publish-pointer-result.json)
          }
          rollback_legacy() {
            if [[ '${{ steps.legacy_mirror.outputs.exists }}' == 'true' ]]; then
              aws s3api put-object \
                --bucket "$R2_BUCKET" \
                --key channels/stable.json \
                --body manifest/current.json \
                --content-type application/json \
                --cache-control no-store \
                --if-match "$legacy_etag"
            else
              published_etag=$(aws s3api head-object --bucket "$R2_BUCKET" --key channels/stable.json --query ETag --output text)
              [[ "$published_etag" == "$legacy_etag" ]] || { echo 'Legacy stable manifest changed concurrently; refusing an unsafe rollback' >&2; return 1; }
              aws s3api delete-object --bucket "$R2_BUCKET" --key channels/stable.json
            fi
          }
          rollback_pointer() {
            if [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]]; then
              aws s3api put-object \
                --bucket "$R2_BUCKET" \
                --key channels/stable-pointer.json \
                --body manifest/current-pointer.json \
                --content-type application/json \
                --cache-control no-store \
                --if-match "$pointer_etag"
            else
              published_etag=$(aws s3api head-object --bucket "$R2_BUCKET" --key channels/stable-pointer.json --query ETag --output text)
              [[ "$published_etag" == "$pointer_etag" ]] || { echo 'Stable generation pointer changed concurrently; refusing an unsafe rollback' >&2; return 1; }
              aws s3api delete-object --bucket "$R2_BUCKET" --key channels/stable-pointer.json
            fi
          }

          if [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]]; then
            publish_legacy
            set +e
            publish_pointer
            publish_status=$?
            set -e
            if [[ $publish_status -ne 0 ]]; then
              rollback_legacy
              exit "$publish_status"
            fi
          else
            publish_pointer
            set +e
            publish_legacy
            publish_status=$?
            set -e
            if [[ $publish_status -ne 0 ]]; then
              rollback_pointer
              exit "$publish_status"
            fi
          fi

          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "etag=$pointer_etag" >> "$GITHUB_OUTPUT"
          echo "legacy_etag=$legacy_etag" >> "$GITHUB_OUTPUT"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      - name: Smoke test published release and roll back on failure
        run: |
          set +e
          node scripts/release/verify-published-update.mjs \
            '${{ needs.prepare-release.outputs.version }}' \
            win32:x64:lite \
            darwin:arm64:default \
            linux:x64:deb \
            linux:x64:appimage
          smoke_status=$?
          set -e

          if [[ $smoke_status -ne 0 && '${{ steps.publish.outputs.changed }}' == 'true' ]]; then
            if [[ '${{ steps.current.outputs.exists }}' == 'true' ]]; then
              aws s3api put-object \
                --bucket "$R2_BUCKET" \
                --key channels/stable.json \
                --body manifest/current.json \
                --content-type application/json \
                --cache-control no-store \
                --if-match '${{ steps.publish.outputs.legacy_etag }}'
            else
              published_legacy_etag=$(aws s3api head-object --bucket "$R2_BUCKET" --key channels/stable.json --query ETag --output text)
              if [[ "$published_legacy_etag" != '${{ steps.publish.outputs.legacy_etag }}' ]]; then
                echo 'Legacy stable manifest changed concurrently; refusing an unsafe rollback' >&2
                exit 1
              fi
              aws s3api delete-object --bucket "$R2_BUCKET" --key channels/stable.json
            fi

            if [[ '${{ steps.current.outputs.pointer_exists }}' == 'true' ]]; then
              aws s3api put-object \
                --bucket "$R2_BUCKET" \
                --key channels/stable-pointer.json \
                --body manifest/current-pointer.json \
                --content-type application/json \
                --cache-control no-store \
                --if-match '${{ steps.publish.outputs.etag }}'
            else
              published_etag=$(aws s3api head-object --bucket "$R2_BUCKET" --key channels/stable-pointer.json --query ETag --output text)
              if [[ "$published_etag" != '${{ steps.publish.outputs.etag }}' ]]; then
                echo 'Stable generation pointer changed concurrently; refusing an unsafe rollback' >&2
                exit 1
              fi
              aws s3api delete-object --bucket "$R2_BUCKET" --key channels/stable-pointer.json
            fi
          fi
          exit "$smoke_status"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_ENDPOINT_URL_S3: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          UPDATE_MANIFEST_KEY_ID: ${{ secrets.UPDATE_MANIFEST_KEY_ID }}
          UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64 }}
