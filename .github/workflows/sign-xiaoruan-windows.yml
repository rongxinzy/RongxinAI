name: Sign Xiaoruan Windows package

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Xiaoruan unsigned windows-build Actions run ID
        required: true
        type: string
      release_version:
        description: 'Package SemVer used for the unsigned build (e.g. 1.0.0). Optional leading v is stripped. Leave empty to use package.json at the source commit.'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      source_run_id:
        description: Caller build-platforms run ID (the current run in the Xiaoruan repository)
        required: true
        type: string
      release_version:
        description: 'Package SemVer without a v prefix'
        required: true
        type: string
    secrets:
      # In workflow_call mode the Certum credentials resolve from the caller
      # repository's `release` environment (job-level environment secrets win
      # over passed secrets per the workflow_call contract), so callers must
      # not pass them; they stay required for direct dispatch from this repo.
      CERTUM_USER_ID:
        required: false
      CERTUM_OTP_URI:
        required: false
      CERTUM_CERT_THUMBPRINT:
        required: false
      MODELSCOPE_TOKENS:
        required: false
      XIAORUAN_ARTIFACT_READ_TOKEN:
        required: false
      RUNTIME_ARTIFACT_READ_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: xiaoruan-certum-signing
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    if: >-
      (github.repository == 'rongxinzy/RongxinAI' && github.ref == 'refs/heads/main') ||
      (github.repository == 'rongxinzy/xiaoruan-ai-agent' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source-repository: ${{ steps.source.outputs.source-repository || steps.source-call.outputs.source-repository }}
      source-run-id: ${{ steps.source.outputs.source-run-id || steps.source-call.outputs.source-run-id }}
      source-sha: ${{ steps.source.outputs.source-sha || steps.source-call.outputs.source-sha }}
      package-version: ${{ steps.source.outputs.package-version || steps.source-call.outputs.package-version }}
    steps:
      - uses: actions/checkout@v6
        if: github.repository == 'rongxinzy/RongxinAI'
      - uses: actions/setup-node@v6
        if: github.repository == 'rongxinzy/RongxinAI'
        with:
          node-version: '24.x'
      - id: source
        name: Validate Xiaoruan unsigned package run
        if: github.repository == 'rongxinzy/RongxinAI'
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RUNTIME_ARTIFACT_READ_TOKEN: ${{ secrets.XIAORUAN_ARTIFACT_READ_TOKEN || secrets.RUNTIME_ARTIFACT_READ_TOKEN }}
        run: node scripts/xiaoruan-signing/prepare.mjs
      - id: source-call
        name: Adopt caller build run identity
        if: github.repository == 'rongxinzy/xiaoruan-ai-agent'
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ && "$SOURCE_RUN_ID" == "$GITHUB_RUN_ID" ]] || {
            echo 'source_run_id must be the caller run ID' >&2
            exit 1
          }
          [[ "$CALLER_WORKFLOW_REF" == rongxinzy/xiaoruan-ai-agent/.github/workflows/build-platforms.yml@* ]] || {
            echo "unexpected caller workflow: $CALLER_WORKFLOW_REF" >&2
            exit 1
          }
          raw="${RELEASE_VERSION#v}"
          raw="${raw#V}"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          [[ "$raw" =~ $semver ]] || { echo "release_version must be SemVer (got: $RELEASE_VERSION)" >&2; exit 1; }
          {
            echo "source-repository=$GITHUB_REPOSITORY"
            echo "source-run-id=$SOURCE_RUN_ID"
            echo "source-sha=$GITHUB_SHA"
            echo "package-version=$raw"
          } >> "$GITHUB_OUTPUT"
      - name: Record handoff identity
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.source-run-id || steps.source-call.outputs.source-run-id }}
          SOURCE_SHA: ${{ steps.source.outputs.source-sha || steps.source-call.outputs.source-sha }}
          PACKAGE_VERSION: ${{ steps.source.outputs.package-version || steps.source-call.outputs.package-version }}
        run: |
          {
            echo '### Xiaoruan signing handoff'
            echo
            echo "- source run: \`$SOURCE_RUN_ID\`"
            echo "- source commit: \`$SOURCE_SHA\`"
            echo "- package version: \`$PACKAGE_VERSION\`"
            echo "- method: rebuild with \`dist:win:signed\` (app + installer)"
            echo
            echo "https://github.com/rongxinzy/xiaoruan-ai-agent/actions/runs/$SOURCE_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  sign:
    needs: prepare
    if: >-
      github.repository == 'rongxinzy/RongxinAI' ||
      github.repository == 'rongxinzy/xiaoruan-ai-agent'
    runs-on: windows-latest
    environment: release
    timeout-minutes: 90
    defaults:
      run:
        working-directory: xiaoruan
    steps:
      - name: Checkout Xiaoruan source commit
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.prepare.outputs.source-repository }}
          ref: ${{ needs.prepare.outputs.source-sha }}
          path: xiaoruan
          token: ${{ secrets.XIAORUAN_ARTIFACT_READ_TOKEN || secrets.RUNTIME_ARTIFACT_READ_TOKEN || github.token }}
      - name: Enforce retired runtime decoupling
        run: node scripts/ci/check-openclaw-decoupling.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            xiaoruan/vendor/engram-runtime
            xiaoruan/vendor/channel-runtime
          key: xiaoruan-signing-${{ runner.os }}-win-x64-node24-bun1.4.0-${{ hashFiles('xiaoruan/bun.lock', 'xiaoruan/package.json', 'xiaoruan/scripts/**') }}
          restore-keys: |
            xiaoruan-signing-${{ runner.os }}-win-x64-node24-bun1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Set up Windows runtimes
        run: |
          bun run setup:uv-runtime
          bun run setup:python-runtime
          bun run engram:runtime:win-x64
      - name: Connect Certum SimplySign
        id: certum
        # Use the copy vendored in the signed source tree: it is identical to
        # the ZhiYuan one, works in both dispatch and workflow_call modes, and
        # pins the signing action to the commit being released.
        uses: ./xiaoruan/.github/actions/setup-certum-signing
        with:
          user-id: ${{ secrets.CERTUM_USER_ID }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          certificate-thumbprint: ${{ secrets.CERTUM_CERT_THUMBPRINT }}
      - name: Build signed Windows package
        run: bun run dist:win:signed
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          APP_BUILD_VERSION: ${{ needs.prepare.outputs.package-version }}
          CERTUM_CERT_THUMBPRINT: ${{ steps.certum.outputs.thumbprint }}
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Verify packaged app version
        shell: bash
        run: node scripts/ci/verify-packaged-app-version.mjs '${{ needs.prepare.outputs.package-version }}'
      - name: Verify Windows Authenticode signatures
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/verify-windows-authenticode.ps1
          -ProjectRoot '${{ github.workspace }}/xiaoruan'
          -ExpectedThumbprint '${{ steps.certum.outputs.thumbprint }}'
      - name: Verify Windows package runtimes with a clean PATH
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/ci/windows-runtime-smoke.ps1
          -ProjectRoot '${{ github.workspace }}/xiaoruan'
      # Launching release/win-unpacked directly cannot work: the offline
      # components (channel runtime, Python, uv, PortableGit, SKILLs, MCPs)
      # ship as 7z payloads inside the NSIS installer and only exist under
      # resources/ after installation expands them. Silent-install the signed
      # package first, then smoke-launch the installed executable.
      - name: Silent-install the signed package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath 'release' -Filter '*.exe' -File |
            Where-Object { $_.Name -notlike '*Uninstall*' })
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer; found $($installers.Count)"
          }
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -PassThru
          if (-not $setup.WaitForExit(15 * 60 * 1000)) {
            Stop-Process -Id $setup.Id -Force -ErrorAction SilentlyContinue
            throw 'Installer did not finish within 15 minutes.'
          }
          if ($setup.ExitCode -ne 0) {
            throw "Installer exited with code $($setup.ExitCode)."
          }
      - name: Stop any auto-launched app instance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -and $_.Path -like '*\Programs\xiaoruan-ai-agent\*' } |
            Stop-Process -Force
          Start-Sleep -Seconds 3
      - name: Smoke-launch the installed app to a visible window
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-Content -LiteralPath package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $builder = Get-Content -LiteralPath electron-builder.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $exeName = $builder.executableName
          if (-not $exeName) { $exeName = $builder.productName }
          $exe = Join-Path $env:LOCALAPPDATA ("Programs\{0}\{1}.exe" -f $package.name, $exeName)
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/ci/windows-app-launch-smoke.ps1 `
            -ExePath $exe -WindowTimeoutSeconds 300
          if ($LASTEXITCODE -ne 0) {
            throw "Installed app launch smoke failed with exit code $LASTEXITCODE."
          }
      - uses: actions/upload-artifact@v6
        with:
          name: signed-windows-build
          path: xiaoruan/release/*.exe
          if-no-files-found: error
          retention-days: 3
      - name: Publish signed package summary
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ needs.prepare.outputs.source-run-id }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source-sha }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package-version }}
        run: |
          {
            echo '### Signed Xiaoruan Windows package'
            echo
            echo "- signing run: \`$GITHUB_RUN_ID\`"
            echo "- source run: \`$SOURCE_RUN_ID\`"
            echo "- source commit: \`$SOURCE_SHA\`"
            echo "- package version: \`$PACKAGE_VERSION\`"
            echo "- artifact: \`signed-windows-build\` (app + installer signed during packaging)"
            echo
            echo "https://github.com/rongxinzy/RongxinAI/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
