name: Installer visual review only

# Pull request checks run inside CI. This workflow remains for manual reruns.

concurrency:
  group: installer-preview-manual-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.58.0-${{ runner.os }}
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ci/installer-style-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-html-visual-review
          path: installer-style-evidence
          retention-days: 7
