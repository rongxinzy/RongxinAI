name: Installer visual review only
on:
  push:
    branches: [main, style/installer-website-alignment]
    paths:
      - 'scripts/installer-shell/preview/**'
      - 'scripts/installer-shell/preview-ui.test.ts'
      - 'scripts/ci/installer-style-preview.py'
      - '.github/workflows/installer-style-preview.yml'
  pull_request:
    paths:
      - 'scripts/installer-shell/preview/**'
      - 'scripts/installer-shell/preview-ui.test.ts'
      - 'scripts/ci/installer-style-preview.py'
      - '.github/workflows/installer-style-preview.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ci/installer-style-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-html-visual-review
          path: installer-style-evidence
          retention-days: 7
