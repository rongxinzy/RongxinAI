name: Linux install and startup gate

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
    secrets:
      MODELSCOPE_TOKENS:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  install-and-start:
    # Ubuntu 26.04 runners currently fail DNS resolution inside Docker builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore llama.cpp runtime
        id: llama-runtime
        uses: ./.github/actions/cache-llamacpp-runtime
        with:
          mode: restore
      - name: Restore packaging caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.npm
            ~/.cache/electron
            ~/.cache/electron-builder
            vendor/engram-runtime
            vendor/channel-runtime
          key: copy-v2-linux-install-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'scripts/**') }}
          restore-keys: |
            copy-v2-linux-install-node24-bun1.4.0-
      - name: Install Electron and virtual desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libatspi2.0-0 libgbm1 libgtk-3-0 libnotify4 libnss3 libsecret-1-0 \
            libxss1 libxtst6 libuuid1 xdg-utils xvfb
      - run: bun install --frozen-lockfile --ignore-scripts --backend copyfile
      - run: bun run apply:patches
      - name: Read pinned Magpie Go toolchain
        id: magpie-toolchain
        run: node -e "const p=require('./resources/magpie/upstream.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'go-version='+p.goVersion.replace(/^go/,'')+'\n')"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.magpie-toolchain.outputs.go-version }}
          cache: false
      - name: Build and verify pinned Magpie gateway
        run: |
          bun run magpie:build -- --target linux-x64
          bun run magpie:verify -- --target linux-x64
      - name: Set up bundled Linux runtimes
        run: |
          bun run setup:posix-uv-runtime
          bun run setup:posix-python-runtime
          bun run engram:runtime:linux-x64
      - name: Build Linux installer artifacts
        timeout-minutes: 65
        run: bun run dist:linux
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Install the generated deb package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t debs < <(find release -maxdepth 1 -type f -name '*.deb' -print | sort)
          [[ ${#debs[@]} -eq 1 ]] || { echo 'Expected exactly one Linux deb package' >&2; exit 1; }
          sudo apt-get install -y "$(realpath "${debs[0]}")"
          test -x '/opt/知远智能体 (ZhiYuan Agent)/知远'
      - name: Verify the installed Ubuntu application starts and paints
        run: >-
          node scripts/verify-linux-renderer.mjs
          '/opt/知远智能体 (ZhiYuan Agent)/知远'
          release/linux-deb-install-smoke.png
      - name: Upload Linux startup diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-install-startup-diagnostics
          path: release/linux-deb-install-smoke.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save llama.cpp runtime
        if: success()
        uses: ./.github/actions/cache-llamacpp-runtime
        with:
          mode: save
          cache-hit: ${{ steps.llama-runtime.outputs.cache-hit }}
          cache-primary-key: ${{ steps.llama-runtime.outputs.cache-primary-key }}
