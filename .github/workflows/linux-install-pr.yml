name: Linux install and startup gate

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      MODELSCOPE_TOKENS:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  install-and-start:
    uses: ./.github/workflows/build-inference-editions.yml
    with:
      mode: verify
      build-windows: false
      build-macos: false
      linux-inference-editions: cpu
      extended-install-tests: true
    secrets:
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
