name: Linux install and startup gate

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
    secrets:
      MODELSCOPE_TOKENS:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  install-and-start:
    # Ubuntu 26.04 runners currently fail DNS resolution inside Docker builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Build Linux installer artifacts
        id: build-inference-packages
        uses: ./.github/actions/build-inference-packages
        with:
          mode: verify
          platform: linux
          runtime-target: linux-x64
          inference-edition: lite
          MODELSCOPE-TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}
      - name: Verify the generated deb installs, starts and paints
        run: node scripts/ci/linux-release-acceptance.mjs smoke-deb
      - name: Upload Linux startup diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: linux-install-startup-diagnostics
          path: release/linux-deb-install-smoke.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save llama.cpp runtime
        if: success()
        uses: ./.github/actions/cache-llamacpp-runtime
        with:
          mode: save
          cache-hit: ${{ steps.build-inference-packages.outputs.cache-hit }}
          cache-primary-key: ${{ steps.build-inference-packages.outputs.cache-primary-key }}
