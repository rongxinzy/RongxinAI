name: Release preflight

on:
  workflow_dispatch:
    inputs:
      source-ref:
        description: Source commit to verify
        type: string
        default: ''
      include-packaging:
        description: Build and install unsigned packages (tag releases already test their signed packages)
        type: boolean
        default: true
  workflow_call:
    inputs:
      source-ref:
        type: string
        default: ''
      include-packaging:
        type: boolean
        default: false
    secrets:
      MODELSCOPE_TOKENS:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - id: source
        run: |
          commit="$(git rev-parse --verify HEAD)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  quality:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: ./.github/actions/setup-bun-workspace
        with:
          include-electron: 'true'
          save-cache: 'true'
      - name: Verify npm package signatures
        shell: bash
        run: |
          set -euo pipefail
          for lockfile in \
            SKILLs/presentation-studio/package-lock.json \
            SKILLs/web-search/package-lock.json \
            scripts/release/package-lock.json; do
            directory="$(dirname "$lockfile")"
            npm --prefix "$directory" ci --ignore-scripts
            npm --prefix "$directory" audit signatures --package-lock-only --ignore-scripts
          done
      - name: Validate source and dependency policy
        run: |
          bun run validate:skills
          node scripts/ci/check-openclaw-decoupling.mjs
          bun run check:supply-chain-inputs
          bun run lint
          bun run format:check
          bun run knip
          bun run knip:production
          bun run check:python-dead-code
      - name: Typecheck and enforce renderer bundle budgets
        run: |
          bun run build:tsc
          bun run build:vite
          bun run test:bundle-budget
        env:
          VITE_SKIP_ELECTRON: '1'
      - name: Verify Presentation Studio compiler and validator
        run: npm test --prefix SKILLs/presentation-studio
      - name: Typecheck Electron without rebuilding native modules or emitting duplicate application code
        run: bun run typecheck:electron
      - name: Install Electron for native ABI integration tests
        run: node node_modules/electron/install.js
      - uses: ./.github/actions/prepare-node-test-native
      - name: Run the complete suite including Electron ABI fixtures
        run: bun run test:full
      - name: Run streaming mutation guards
        run: bun run test:streaming-mutations

  enterprise:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: ./.github/actions/setup-bun-workspace
      - name: Typecheck enterprise extension
        run: bun run typecheck:enterprise
      - name: Run enterprise extension tests
        run: bun run test:enterprise
      - name: Build enterprise extension bundle and renderer
        run: bun run build:enterprise
      - name: Verify enterprise extension bundle
        run: bun run verify:enterprise:bundle
      - name: Verify enterprise packaging config
        run: bun run verify:enterprise:packaging-config

  channel-runtime:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Restore channel runtime download
        id: channel-cache
        uses: actions/cache/restore@v5
        with:
          path: vendor/channel-runtime
          key: channel-runtime-${{ runner.os }}-${{ hashFiles('package.json', 'scripts/download-channel-runtime.cjs') }}
          restore-keys: |
            channel-runtime-${{ runner.os }}-
      - name: Download the pinned channel runtime
        run: npm run channel:runtime:linux-x64
      - name: Verify channel transport and QQ Bot support
        run: npm run channel:runtime:smoke
      - name: Save channel runtime download
        if: steps.channel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: vendor/channel-runtime
          key: ${{ steps.channel-cache.outputs.cache-primary-key }}

  python-runtime-linux:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HUSKY: '0'
      PYTHON_RUNTIME_INTEGRATION: '1'
      PYTHON_RUNTIME_RUNNER: '${{ github.workspace }}/dist-electron/python-runtime-runner.js'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Bundle the independent Runner
        run: bun build src/main/pythonRuntime/runner.ts --target=node --format=cjs --outfile=dist-electron/python-runtime-runner.js
      - name: Restore the bundled managed runtime cache
        uses: actions/cache@v5
        with:
          path: |
            resources/python-linux
            resources/uv-linux
          key: bundled-runtime-linux-${{ hashFiles('src/main/pythonRuntime/bundledRuntime.json') }}
      - name: Provision the bundled managed runtime
        run: |
          bun run setup:posix-python-runtime
          bun run setup:posix-uv-runtime
      - name: Verify pinned Python, isolated packages, rebuild and process cancellation
        run: bun x --no-install vitest run src/main/pythonRuntime/runtime.integration.test.ts --maxWorkers=1

  python-runtime-windows:
    needs: source
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HUSKY: '0'
      PYTHON_RUNTIME_INTEGRATION: '1'
      PYTHON_RUNTIME_RUNNER: '${{ github.workspace }}/dist-electron/python-runtime-runner.js'
      PYTHON_RUNTIME_JOB_HELPER: '${{ github.workspace }}/resources/python-runtime/job-runner.exe'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build actual Job Object helper
        shell: pwsh
        run: ./scripts/python-runtime/build-job-runner.ps1
      - name: Verify descendant containment and parent-death cleanup
        run: node --test scripts/python-runtime/job-runner.test.cjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Restore Bun package cache
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-1.4.0-
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run apply:patches
      - name: Bundle the independent Runner
        run: bun build src/main/pythonRuntime/runner.ts --target=node --format=cjs --outfile=dist-electron/python-runtime-runner.js
      - name: Restore the bundled managed runtime cache
        uses: actions/cache@v5
        with:
          path: |
            resources/python-win
            resources/uv-win
          key: bundled-runtime-win-${{ hashFiles('src/main/pythonRuntime/bundledRuntime.json') }}
      - name: Provision the bundled managed runtime
        run: |
          bun run setup:python-runtime
          bun run setup:uv-runtime
      - name: Verify Windows standalone Python and real uv wheel environments
        run: bun x --no-install vitest run src/main/pythonRuntime/runtime.integration.test.ts --maxWorkers=1

  browser-preview:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: ./.github/actions/setup-bun-workspace
      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run web:preview:codegen:check
      - run: bun run web:preview:stream-replay:codegen:check
      - run: bun run web:preview:contract
      - run: bun run web:preview:check

  installer-preview:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.58.0-${{ runner.os }}
      - run: pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/ci/installer-style-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-preview-${{ github.run_id }}
          path: acceptance-diagnostics/installer-preview
          retention-days: 7

  memory-leak:
    needs: source
    uses: ./.github/workflows/memory-regression.yml
    with:
      source-ref: ${{ needs.source.outputs.commit }}

  linux-install:
    needs: source
    if: inputs.include-packaging
    uses: ./.github/workflows/linux-install-pr.yml
    with:
      source-ref: ${{ needs.source.outputs.commit }}
    secrets:
      MODELSCOPE_TOKENS: ${{ secrets.MODELSCOPE_TOKENS }}

  windows-install:
    needs: source
    if: inputs.include-packaging
    uses: ./.github/workflows/windows-installer-pr.yml
    with:
      source-ref: ${{ needs.source.outputs.commit }}

  preflight-gate:
    if: always()
    needs: [source, quality, enterprise, channel-runtime, python-runtime-linux, python-runtime-windows, browser-preview, installer-preview, memory-leak, linux-install, windows-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
          sparse-checkout: |
            .nvmrc
            scripts/ci/gates
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node scripts/ci/gates/verify-preflight.ts
        env:
          PREFLIGHT_RESULTS: ${{ toJSON(needs) }}
          INCLUDE_PACKAGING: ${{ inputs.include-packaging }}
