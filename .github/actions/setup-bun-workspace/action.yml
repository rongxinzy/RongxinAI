name: Setup Bun workspace
description: Install frozen Bun dependencies and restore the shared install and Electron download caches.

inputs:
  include-electron:
    description: Share Electron downloads separately from the Bun package cache.
    required: false
    default: 'false'
  save-cache:
    description: Save Bun packages when the restore missed. Enable on one writer only.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        check-latest: true
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.4.0'
    - name: Restore Bun package cache
      id: bun-cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-1.4.0-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-1.4.0-
    - name: Share Electron download cache
      if: inputs.include-electron == 'true'
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          electron-downloads-v1-${{ runner.os }}-${{ runner.arch }}-
    - shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
    - shell: bash
      run: bun run apply:patches
    - name: Save Bun package cache
      if: inputs.save-cache == 'true' && steps.bun-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ steps.bun-cache.outputs.cache-primary-key }}
