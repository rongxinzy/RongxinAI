name: Build inference packages
description: Shared inference packaging steps with explicit caller bindings
inputs:
  app-build-version:
    description: Caller inputs.app-build-version
    required: false
    default: ''
  mode:
    description: Caller inputs.mode
    required: false
    default: ''
  arch:
    description: Caller matrix.arch
    required: false
    default: ''
  inference-edition:
    description: Caller matrix.inference_edition
    required: false
    default: ''
  platform:
    description: Caller matrix.platform
    required: false
    default: ''
  runtime-target:
    description: Caller matrix.runtime_target
    required: false
    default: ''
  APPLE-APP-SPECIFIC-PASSWORD:
    description: Caller secrets.APPLE_APP_SPECIFIC_PASSWORD
    required: false
    default: ''
  APPLE-ID:
    description: Caller secrets.APPLE_ID
    required: false
    default: ''
  APPLE-TEAM-ID:
    description: Caller secrets.APPLE_TEAM_ID
    required: false
    default: ''
  CERTUM-CERT-THUMBPRINT:
    description: Caller secrets.CERTUM_CERT_THUMBPRINT
    required: false
    default: ''
  CERTUM-OTP-URI:
    description: Caller secrets.CERTUM_OTP_URI
    required: false
    default: ''
  CERTUM-USER-ID:
    description: Caller secrets.CERTUM_USER_ID
    required: false
    default: ''
  MACOS-CSC-KEY-PASSWORD:
    description: Caller secrets.MACOS_CSC_KEY_PASSWORD
    required: false
    default: ''
  MACOS-CSC-LINK:
    description: Caller secrets.MACOS_CSC_LINK
    required: false
    default: ''
  MODELSCOPE-TOKENS:
    description: Caller secrets.MODELSCOPE_TOKENS
    required: false
    default: ''
  UPDATE-MANIFEST-KEY-ID:
    description: Caller secrets.UPDATE_MANIFEST_KEY_ID
    required: false
    default: ''
  UPDATE-MANIFEST-PUBLIC-KEY-BASE64:
    description: Caller secrets.UPDATE_MANIFEST_PUBLIC_KEY_BASE64
    required: false
    default: ''
outputs:
  thumbprint:
    description: Same-job thumbprint
    value: ${{ steps.certum-signing.outputs.thumbprint }}
  cache-hit:
    description: Same-job cache-hit
    value: ${{ steps.llama-runtime.outputs.cache-hit }}
  cache-primary-key:
    description: Same-job cache-primary-key
    value: ${{ steps.llama-runtime.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Restore llama.cpp runtime
      id: llama-runtime
      uses: ./.github/actions/cache-llamacpp-runtime
      with:
        mode: restore
    - name: Restore packaging caches
      uses: actions/cache@v5
      with:
        path: |
          ~/.bun/install/cache
          ~/.npm
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
          resources/uv-mac
          resources/uv-linux
          resources/python-mac
          resources/python-linux
          resources/skill-python
        key: copy-v2-packaging-${{ runner.os }}-${{ inputs.runtime-target }}-node24-bun1.4.0-${{ hashFiles('bun.lock', 'package.json', 'SKILLs/**/requirements.txt', 'scripts/setup-*runtime*.js') }}
        restore-keys: |
          copy-v2-packaging-${{ runner.os }}-${{ inputs.runtime-target }}-node24-bun1.4.0-
    - name: Install Electron system dependencies
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.platform == 'linux' }}
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libatspi2.0-0 libgbm1 libgtk-3-0 libnotify4 libnss3 libsecret-1-0 \
          libxss1 libxtst6 libuuid1 xdg-utils xvfb libfuse2t64
    - run: bun install --frozen-lockfile --ignore-scripts --backend copyfile
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
    - run: bun run apply:patches
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
    - name: Read pinned Magpie Go toolchain
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      id: magpie-toolchain
      run: node -e "const p=require('./resources/magpie/upstream.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'go-version='+p.goVersion.replace(/^go/,'')+'\n')"
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ steps.magpie-toolchain.outputs.go-version }}
        cache: false
    - name: Cache Magpie module and build scratch
      uses: actions/cache@v5
      with:
        path: |
          .cache/magpie
          resources/magpie
        key: magpie-${{ runner.os }}-${{ inputs.runtime-target }}-go${{ steps.magpie-toolchain.outputs.go-version }}-${{ hashFiles('resources/magpie/upstream.json', 'scripts/build-magpie-runtime.cjs', 'scripts/magpie-runtime.cjs') }}
    - name: Build and verify pinned Magpie gateway
      shell: bash
      env:
        MAGPIE_TARGET: ${{ inputs.platform == 'linux' && 'linux-x64' || inputs.platform == 'windows' && 'win32-x64' || (inputs.arch == 'arm64' && 'darwin-arm64' || 'darwin-x64') }}
      run: |
        set -euo pipefail
        go version | grep -Fq "go${{ steps.magpie-toolchain.outputs.go-version }}"
        bun run magpie:build -- --target "${MAGPIE_TARGET}"
        bun run magpie:verify -- --target "${MAGPIE_TARGET}"
    - name: Set up installer shell SDK
      if: ${{ inputs.platform == 'windows' }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'
    - name: Set up Windows runtimes
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.platform == 'windows' }}
      run: |
        bun run setup:uv-runtime
        bun run setup:python-runtime
    - name: Set up POSIX runtimes
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.platform != 'windows' }}
      run: |
        bash scripts/ci/with-download-retries.sh bun run setup:posix-uv-runtime
        bash scripts/ci/with-download-retries.sh bun run setup:posix-python-runtime
    - name: Sync vendor llama.cpp CPU edition
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.inference-edition != 'lite' }}
      run: node scripts/sync-vendor-llamacpp-cpu-edition.cjs
      env:
        LLAMACPP_CPU_TARGET_ID: ${{ inputs.runtime-target }}
    - name: Prepare pinned Windows CUDA runtime
      if: ${{ inputs.inference-edition == 'cuda' && inputs.platform == 'windows' }}
      uses: ./.github/actions/prepare-windows-cuda
    - name: Restore Linux CUDA llama.cpp runtime
      if: ${{ inputs.inference-edition == 'cuda' && inputs.platform == 'linux' }}
      id: linux-cuda-runtime
      uses: actions/cache/restore@v5
      with:
        path: vendor/llamacpp/cuda
        key: linux-cuda-v1-ubuntu2204-cuda12.4.1-sm89-${{ hashFiles('package.json', 'resources/llamacpp-backends/manifest.json', 'scripts/ci/build-llamacpp-cuda-linux-in-docker.sh', 'scripts/build-llamacpp-cuda-rtx40.sh', 'scripts/ci/stage-linux-cuda-runtime-libs.sh', 'scripts/finalize-llamacpp-cuda-edition.cjs', 'scripts/finalize-llamacpp-cuda-edition.lib.cjs') }}
    - name: Build RTX 40 CUDA llama.cpp runtime (Linux, Docker CUDA 12.4 / Ubuntu 22.04)
      if: ${{ inputs.inference-edition == 'cuda' && inputs.platform == 'linux' && steps.linux-cuda-runtime.outputs.cache-hit != 'true' }}
      shell: bash
      run: bash scripts/ci/build-llamacpp-cuda-linux-in-docker.sh
    - name: Finalize CUDA llama.cpp edition bundle
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.inference-edition == 'cuda' && inputs.platform == 'linux' && steps.linux-cuda-runtime.outputs.cache-hit != 'true' }}
      run: node scripts/finalize-llamacpp-cuda-edition.cjs
      env:
        LLAMACPP_CUDA_PLATFORM: ${{ inputs.platform == 'windows' && 'win32' || 'linux' }}
    - name: Save Linux CUDA llama.cpp runtime
      if: ${{ inputs.inference-edition == 'cuda' && inputs.platform == 'linux' && steps.linux-cuda-runtime.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: vendor/llamacpp/cuda
        key: ${{ steps.linux-cuda-runtime.outputs.cache-primary-key }}
    - name: Stage bundled llama.cpp runtime
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.inference-edition != 'lite' }}
      run: bun run prepare:inference-edition-runtime
      env:
        ZHIYUAN_UPDATE_VARIANT: ${{ inputs.inference-edition }}
    - name: Connect Certum SimplySign
      if: ${{ inputs.mode == 'release' && inputs.platform == 'windows' }}
      id: certum-signing
      uses: ./.github/actions/setup-certum-signing
      with:
        user-id: ${{ inputs.CERTUM-USER-ID }}
        otp-uri: ${{ inputs.CERTUM-OTP-URI }}
        certificate-thumbprint: ${{ inputs.CERTUM-CERT-THUMBPRINT }}
    - name: Build Windows (verify)
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.mode == 'verify' && inputs.platform == 'windows' }}
      run: bun run dist:win:${{ inputs.inference-edition }}
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        MODELSCOPE_TOKENS: ${{ inputs.MODELSCOPE-TOKENS }}
    - name: Build Windows release (lite)
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.mode == 'release' && inputs.platform == 'windows' && inputs.inference-edition == 'lite' }}
      run: bun run dist:win:signed
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'
        APP_BUILD_VERSION: ${{ inputs.app-build-version }}
        CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
        UPDATE_MANIFEST_KEY_ID: ${{ inputs.UPDATE-MANIFEST-KEY-ID }}
        UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ inputs.UPDATE-MANIFEST-PUBLIC-KEY-BASE64 }}
        MODELSCOPE_TOKENS: ${{ inputs.MODELSCOPE-TOKENS }}
    - name: Build Windows release (cpu)
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.mode == 'release' && inputs.platform == 'windows' && inputs.inference-edition == 'cpu' }}
      run: bun run dist:win:signed:cpu
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'
        APP_BUILD_VERSION: ${{ inputs.app-build-version }}
        CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
        UPDATE_MANIFEST_KEY_ID: ${{ inputs.UPDATE-MANIFEST-KEY-ID }}
        UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ inputs.UPDATE-MANIFEST-PUBLIC-KEY-BASE64 }}
        MODELSCOPE_TOKENS: ${{ inputs.MODELSCOPE-TOKENS }}
    - name: Build Windows release (cuda)
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.mode == 'release' && inputs.platform == 'windows' && inputs.inference-edition == 'cuda' }}
      run: bun run dist:win:signed:cuda
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'
        APP_BUILD_VERSION: ${{ inputs.app-build-version }}
        CERTUM_CERT_THUMBPRINT: ${{ steps.certum-signing.outputs.thumbprint }}
        UPDATE_MANIFEST_KEY_ID: ${{ inputs.UPDATE-MANIFEST-KEY-ID }}
        UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ inputs.UPDATE-MANIFEST-PUBLIC-KEY-BASE64 }}
        MODELSCOPE_TOKENS: ${{ inputs.MODELSCOPE-TOKENS }}
    - name: Validate optional macOS signing credentials
      if: ${{ inputs.mode == 'release' && inputs.platform == 'macos' }}
      shell: bash
      run: |
        values=("$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID")
        provided=0
        for value in "${values[@]}"; do [[ -n "$value" ]] && provided=$((provided + 1)); done
        if [[ $provided -eq 0 ]]; then
          echo 'ZHIYUAN_MAC_AUTO_UPDATE_ENABLED=false' >> "$GITHUB_ENV"
          echo 'CSC_IDENTITY_AUTO_DISCOVERY=false' >> "$GITHUB_ENV"
          echo '::warning title=Unsigned macOS release::Apple signing credentials are unavailable.'
        elif [[ $provided -ne ${#values[@]} ]]; then
          echo 'macOS signing credentials are only partially configured' >&2
          exit 1
        else
          echo 'ZHIYUAN_MAC_AUTO_UPDATE_ENABLED=true' >> "$GITHUB_ENV"
          echo 'CSC_IDENTITY_AUTO_DISCOVERY=true' >> "$GITHUB_ENV"
        fi
      env:
        CSC_LINK: ${{ inputs.MACOS-CSC-LINK }}
        CSC_KEY_PASSWORD: ${{ inputs.MACOS-CSC-KEY-PASSWORD }}
        APPLE_ID: ${{ inputs.APPLE-ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.APPLE-APP-SPECIFIC-PASSWORD }}
        APPLE_TEAM_ID: ${{ inputs.APPLE-TEAM-ID }}
    - name: Build macOS (verify)
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.mode == 'verify' && inputs.platform == 'macos' }}
      run: node scripts/ensure-build-version.js && bun run dist:mac:${{ inputs.arch }}
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'
        CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        MODELSCOPE_TOKENS: ${{ inputs.MODELSCOPE-TOKENS }}
    - name: Build unsigned macOS release
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.mode == 'release' && inputs.platform == 'macos' && env.ZHIYUAN_MAC_AUTO_UPDATE_ENABLED != 'true' }}
      run: node scripts/ensure-build-version.js && bun run prepare:update-release && bun run dist:mac:${{ inputs.arch }}
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'
        APP_BUILD_VERSION: ${{ inputs.app-build-version }}
        UPDATE_MANIFEST_KEY_ID: ${{ inputs.UPDATE-MANIFEST-KEY-ID }}
        UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ inputs.UPDATE-MANIFEST-PUBLIC-KEY-BASE64 }}
        MODELSCOPE_TOKENS: ${{ inputs.MODELSCOPE-TOKENS }}
    # Intel macOS runners: stapler CloudKit ticket fetch over HTTP/3/UDP fails intermittently.
    # https://github.com/actions/runner-images/issues/14924
    - name: Block UDP/443 for stapler (macOS x64)
      if: ${{ inputs.mode == 'release' && inputs.platform == 'macos' && inputs.arch == 'x64' && env.ZHIYUAN_MAC_AUTO_UPDATE_ENABLED == 'true' }}
      shell: bash
      run: scripts/ci/block-stapler-http3-udp443.sh
    - name: Build signed macOS release
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.mode == 'release' && inputs.platform == 'macos' && env.ZHIYUAN_MAC_AUTO_UPDATE_ENABLED == 'true' }}
      run: node scripts/ensure-build-version.js && bun run prepare:update-release && bun run dist:mac:${{ inputs.arch }}
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'
        APP_BUILD_VERSION: ${{ inputs.app-build-version }}
        UPDATE_MANIFEST_KEY_ID: ${{ inputs.UPDATE-MANIFEST-KEY-ID }}
        UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ inputs.UPDATE-MANIFEST-PUBLIC-KEY-BASE64 }}
        CSC_LINK: ${{ inputs.MACOS-CSC-LINK }}
        CSC_KEY_PASSWORD: ${{ inputs.MACOS-CSC-KEY-PASSWORD }}
        APPLE_ID: ${{ inputs.APPLE-ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.APPLE-APP-SPECIFIC-PASSWORD }}
        APPLE_TEAM_ID: ${{ inputs.APPLE-TEAM-ID }}
        MODELSCOPE_TOKENS: ${{ inputs.MODELSCOPE-TOKENS }}
    - name: Build Linux (verify)
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.mode == 'verify' && inputs.platform == 'linux' }}
      # The CUDA llama-server is already built in Docker, finalized and staged
      # above; dist:linux:cuda would rebuild it on the host against the
      # Docker-generated CMake cache, so CUDA packages with plain dist:linux.
      run: ${{ inputs.inference-edition == 'cuda' && 'bun run dist:linux' || format('bun run dist:linux:{0}', inputs.inference-edition) }}
      env:
        ZHIYUAN_UPDATE_VARIANT: ${{ inputs.inference-edition }}
        NODE_OPTIONS: '--max-old-space-size=4096'
        MODELSCOPE_TOKENS: ${{ inputs.MODELSCOPE-TOKENS }}
    - name: Build Linux release
      shell: ${{ inputs.platform == 'windows' && 'pwsh' || 'bash -e {0}' }}
      if: ${{ inputs.mode == 'release' && inputs.platform == 'linux' }}
      # The CUDA llama-server is already built in Docker, finalized and staged
      # above; dist:linux:cuda would rebuild it on the host against the
      # Docker-generated CMake cache, so CUDA packages with plain dist:linux.
      run: ${{ inputs.inference-edition == 'cuda' && 'bun run dist:linux' || format('bun run dist:linux:{0}', inputs.inference-edition) }}
      env:
        ZHIYUAN_UPDATE_VARIANT: ${{ inputs.inference-edition }}
        NODE_OPTIONS: '--max-old-space-size=4096'
        APP_BUILD_VERSION: ${{ inputs.app-build-version }}
        UPDATE_MANIFEST_KEY_ID: ${{ inputs.UPDATE-MANIFEST-KEY-ID }}
        UPDATE_MANIFEST_PUBLIC_KEY_BASE64: ${{ inputs.UPDATE-MANIFEST-PUBLIC-KEY-BASE64 }}
        MODELSCOPE_TOKENS: ${{ inputs.MODELSCOPE-TOKENS }}
