name: Prepare Windows packaging runtime
description: Provision the offline runtimes and verify native process shutdown before packaging
runs:
  using: composite
  steps:
    - name: Set up offline Windows runtimes
      shell: pwsh
      run: |
        bun run setup:uv-runtime
        bun run setup:python-runtime
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Build and verify the Windows Python job helper
      shell: pwsh
      run: |
        ./scripts/python-runtime/build-job-runner.ps1
        node --test scripts/python-runtime/job-runner.test.cjs
    - name: Verify native Magpie gateway shutdown
      shell: pwsh
      env:
        ZHIYUAN_MAGPIE_SMOKE: '1'
      run: >-
        bun x --no-install vitest run src/main/magpie/integration.test.ts
        -t "discovers and updates a fixture CLI"
