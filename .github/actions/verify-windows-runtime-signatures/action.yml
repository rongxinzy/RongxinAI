name: Verify Windows runtime signatures
description: Download checksum-pinned runtimes and verify their public signing identity before packaging.
inputs:
  signer-thumbprint:
    description: Trusted public certificate SHA-1 thumbprint (not a private signing credential).
    required: true
runs:
  using: composite
  steps:
    - name: Download pinned Windows runtimes
      shell: pwsh
      run: |
        bun run channel:runtime:win-x64
        if ($LASTEXITCODE -ne 0) { throw 'Channel runtime download failed.' }
        bun run engram:runtime:win-x64
        if ($LASTEXITCODE -ne 0) { throw 'Memory runtime download failed.' }
    - name: Verify both runtime signatures before packaging
      shell: pwsh
      env:
        RUNTIME_SIGNER_THUMBPRINT: ${{ inputs.signer-thumbprint }}
      run: |
        & ./scripts/ci/verify-windows-runtime-signatures.ps1
