name: Prepare Magpie runtime
description: Build and verify the pinned gateway before packaging
inputs:
  target:
    description: Magpie platform and architecture
    required: true
  build-attempts:
    description: Maximum build attempts
    default: '1'
runs:
  using: composite
  steps:
    - name: Read pinned Magpie Go toolchain
      id: toolchain
      shell: bash
      run: node -e "const p=require('./resources/magpie/upstream.json'); require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'go-version='+p.goVersion.replace(/^go/,'')+'\n')"
    - uses: actions/setup-go@v6
      with:
        go-version: ${{ steps.toolchain.outputs.go-version }}
        cache: false
    - name: Cache Magpie build inputs and runtime
      if: ${{ runner.environment == 'github-hosted' }}
      uses: actions/cache@v5
      with:
        path: |
          .cache/magpie
          resources/magpie/${{ inputs.target }}
        key: magpie-${{ runner.os }}-${{ inputs.target }}-go${{ steps.toolchain.outputs.go-version }}-${{ hashFiles('resources/magpie/upstream.json', 'scripts/build-magpie-runtime.cjs', 'scripts/magpie-runtime.cjs') }}
    - name: Build and verify pinned Magpie gateway
      shell: bash
      env:
        MAGPIE_TARGET: ${{ inputs.target }}
        MAGPIE_BUILD_ATTEMPTS: ${{ inputs.build-attempts }}
        MAGPIE_GO_VERSION: ${{ steps.toolchain.outputs.go-version }}
      run: |
        go version | grep -Fq "go${MAGPIE_GO_VERSION} "
        attempt=1
        until bun run magpie:build -- --target "$MAGPIE_TARGET"; do
          if ((attempt >= MAGPIE_BUILD_ATTEMPTS)); then
            echo "Magpie build failed after $attempt attempts" >&2
            exit 1
          fi
          echo "Magpie build attempt $attempt failed; retrying in 15 seconds..." >&2
          sleep 15
          attempt=$((attempt + 1))
        done
        bun run magpie:verify -- --target "$MAGPIE_TARGET"
