<svg width="1120" height="880" viewBox="0 0 1120 880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="0.7"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <style>
      text { fill: #000; font-family: 'Latin Modern Roman', 'CMU Serif', 'STIX Two Text', 'Times New Roman', serif; }
      .t0 { font-size: 26px; font-weight: 700; }
      .t1 { font-size: 15px; font-style: italic; }
      .t2 { font-size: 18px; font-weight: 700; }
      .t3 { font-size: 17px; font-weight: 700; }
      .t4 { font-size: 13px; }
      .t5 { font-size: 16px; font-weight: 700; }
      .t6 { font-size: 12px; font-style: italic; }
      .t7 { font-size: 15px; font-weight: 700; }
      .box { fill: #fff; stroke: #000; stroke-width: 1.6; }
      .grp { fill: none; stroke: #000; stroke-width: 1.4; stroke-dasharray: 7 5; }
      .ln  { stroke: #000; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1120" height="880" fill="#fff"/>

  <text x="560" y="50" text-anchor="middle" class="t0">RongxinAI — Local AI Agent Workspace</text>
  <text x="560" y="80" text-anchor="middle" class="t1">OpenClaw runs agent workflows &#183; llama.cpp serves local GGUF models &#183; Electron owns the desktop security boundary</text>

  <!-- Electron Main Process -->
  <rect x="60" y="110" width="1000" height="300" class="grp"/>
  <text x="82" y="142" class="t2">Electron Main Process</text>

  <rect x="95" y="165" width="350" height="95" fill="url(#hatch)" stroke="#000" stroke-width="1.6"/>
  <text x="115" y="201" class="t3">OpenClaw Runtime</text>
  <text x="115" y="227" class="t4">Cowork sessions, tools, approvals</text>
  <rect x="352" y="178" width="78" height="24" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <text x="391" y="195" text-anchor="middle" class="t4" font-weight="700">primary</text>

  <rect x="470" y="165" width="270" height="95" class="box"/>
  <text x="490" y="201" class="t3">llama.cpp Service</text>
  <text x="490" y="227" class="t4">GGUF models, launch options,</text>
  <text x="490" y="247" class="t4">marketplace</text>

  <rect x="765" y="165" width="270" height="95" class="box"/>
  <text x="785" y="201" class="t3">Skill / MCP Manager</text>
  <text x="785" y="227" class="t4">Built-in skills, marketplace,</text>
  <text x="785" y="247" class="t4">external tools</text>

  <rect x="95" y="290" width="350" height="95" class="box"/>
  <text x="115" y="326" class="t3">SQLite Storage</text>
  <text x="115" y="352" class="t4">Sessions, config, memory, tasks</text>

  <rect x="470" y="290" width="270" height="95" class="box"/>
  <text x="490" y="326" class="t3">Scheduled Tasks</text>
  <text x="490" y="352" class="t4">Cron, background triggers, delivery</text>

  <rect x="765" y="290" width="270" height="95" class="box"/>
  <text x="785" y="326" class="t3">IM / Email Gateway</text>
  <text x="785" y="352" class="t4">WeChat, WeCom, DingTalk,</text>
  <text x="785" y="372" class="t4">Feishu/Lark, QQ, Email</text>

  <!-- IPC bridge -->
  <line x1="560" y1="410" x2="560" y2="462" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="578" y="442" class="t6">IPC invoke</text>
  <rect x="420" y="465" width="280" height="70" class="box"/>
  <text x="560" y="497" text-anchor="middle" class="t5">Preload Script</text>
  <text x="560" y="521" text-anchor="middle" class="t6">contextBridge &#183; IPC secure bridge</text>
  <line x1="560" y1="535" x2="560" y2="587" class="ln" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="578" y="568" class="t6">stream events</text>

  <!-- Renderer Process -->
  <rect x="60" y="590" width="1000" height="200" class="grp"/>
  <text x="82" y="622" class="t2">Renderer Process (React)</text>

  <rect x="95" y="655" width="215" height="85" class="box"/>
  <text x="202" y="705" text-anchor="middle" class="t7">Redux State</text>

  <rect x="335" y="655" width="250" height="85" class="box"/>
  <text x="460" y="705" text-anchor="middle" class="t7">Cowork / Inference UI</text>

  <rect x="610" y="655" width="220" height="85" class="box"/>
  <text x="720" y="705" text-anchor="middle" class="t7">Artifacts Preview</text>

  <rect x="855" y="655" width="180" height="85" class="box"/>
  <text x="945" y="705" text-anchor="middle" class="t7">Settings / Market</text>
</svg>
