<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>edu-english-words</title><style>*{box-sizing:border-box;margin:0}
html,body{width:1100px;height:688px;overflow:hidden}
body{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:#f2f2ef;color:#16171a;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;font-variant-numeric:tabular-nums}

body{padding:30px}
.panel{width:100%;height:100%;background:#fff;border:1px solid #e4e4e0;display:flex;flex-direction:column;overflow:hidden}
.ask{display:flex;gap:14px;padding:19px 26px;background:#fafaf8;border-bottom:1px solid #edede9}
.avatar{width:24px;height:24px;border-radius:50%;background:#e6e6e2;flex:none;margin-top:2px}
.ask p{font-size:14px;color:#3d4046;line-height:1.6}
.ans{flex:1;min-height:0;padding:24px 26px;display:flex;flex-direction:column;gap:18px}
.ans h2{font-size:16px;letter-spacing:-.01em}
.ans h3{font-size:12px;letter-spacing:.16em;color:#8b8f97;text-transform:uppercase}
.hr{height:1px;background:#edede9}
.word{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.word b{font-size:34px;letter-spacing:-.02em}
.word span{font-size:14px;color:#6f737b}
.pos{font-size:12px;color:#fff;background:var(--accent);padding:2px 8px;border-radius:2px}
.def{font-size:15px;color:#3d4046}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{border:1px solid #edede9;background:#fafaf8;padding:16px 18px}
.box .k{font-size:11px;letter-spacing:.14em;color:#8b8f97}
.box p{margin-top:8px;font-size:13.5px;color:#3d4046;line-height:1.8}
.quote{font-size:14.5px;color:#3d4046;line-height:1.9;border-left:3px solid var(--accent);padding-left:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #e4e4e0;padding:4px 10px;font-size:12.5px;color:#4c5058}
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.step .n{width:24px;height:24px;border:1px solid var(--accent);color:var(--accent);font-size:12px;display:flex;align-items:center;justify-content:center}
.step .t{font-size:13.5px;color:#3d4046;line-height:1.8}
.formula{font-size:16px;color:#16171a;margin-top:4px}
.answer{margin-top:6px;background:color-mix(in srgb,var(--accent) 8%,#fff);border-left:3px solid var(--accent);padding:12px 16px;font-size:14px}
.cmp{display:grid;gap:12px}
.cmp .before,.cmp .after{padding:12px 16px;font-size:13.5px;line-height:1.8}
.cmp .before{background:#fafaf8;border:1px solid #edede9;color:#8b8f97}
.cmp .after{border:1px solid color-mix(in srgb,var(--accent) 45%,#fff);background:color-mix(in srgb,var(--accent) 6%,#fff);color:#3d4046}
.cmp .tag{font-size:11px;letter-spacing:.12em;color:#8b8f97;display:block;margin-bottom:6px}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:#3d4046}
.flow span{border:1px solid #e4e4e0;padding:8px 12px;background:#fafaf8}
.flow i{color:#b6bac0;font-style:normal}
.notes{display:grid;gap:8px}
.notes div{font-size:13.5px;color:#4c5058;line-height:1.7;padding-left:16px;position:relative}
.notes div::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;background:var(--accent)}
</style></head><body>
<div class="panel" style="--accent:#10B981">
  <div class="ask"><div class="avatar"></div><p>resilient 这个词总是记不住，帮我拆一下。</p></div>
  <div class="ans">
    <div class="word"><b>resilient</b><span class="mono">/rɪˈzɪliənt/</span><span class="pos">adj.</span></div>
    <div class="def">有韧性的；受压后能恢复原状的</div>
    <div class="hr"></div>
    <div class="grid2">
      <div class="box"><div class="k">词根拆解</div><p><span class="mono">re-</span> 回 + <span class="mono">sil</span> 跳 + <span class="mono">-ient</span> 形容词后缀<br>字面意思：能弹回去的</p></div>
      <div class="box"><div class="k">记忆锚点</div><p>想成一颗橡皮球：按下去会弹回来。人也是一样，受了挫折还能回到原来的状态，就是 resilient。</p></div>
    </div>
    <div class="quote">Startups are resilient: they fail, adapt, and try again with what is left.</div>
    <div class="chips"><span class="chip">tough</span><span class="chip">adaptable</span><span class="chip">flexible</span><span class="chip">反义：fragile</span></div>
  </div>
</div></body></html>
