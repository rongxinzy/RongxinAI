<title>知远智能体 · 安装器设计原型</title>
<style>
  /* Standalone setup palette, aligned with the approved website reference.
     No website runtime, remote assets, fonts, or renderer theme dependencies. */
  :root {
    --brand: #090d16;
    --brand-strong: #263349;
    --brand-soft: #eef4fa;
    --text: #182335;
    --text-2: #525c71;
    --text-3: #616d7f;
    --border: #dce3ea;
    --surface: #fff;
    --tint: #f5f8fb;
    --danger: #b4232c;
    --danger-soft: #fff0f0;
    --radius: 12px;
    --font: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    --serif: "Songti SC", "Noto Serif CJK SC", "SimSun", Georgia, serif;
    --ease-out: cubic-bezier(.22, .8, .32, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: var(--font); color: var(--text); background: #edf1f5; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    display: flex; flex-direction: column; overflow: hidden; position: relative;
  }
  .titlebar { height: 64px; flex: none; display: flex; align-items: center; gap: 18px; padding: 0 16px 0 32px; user-select: none; }
  .titlebar .app-title { font-size: 12px; color: var(--text-2); }
  .spacer { flex: 1; }
  .win-btn { width: 40px; height: 32px; border: 0; background: transparent; border-radius: 6px; color: var(--text-2); cursor: default; display: flex; align-items: center; justify-content: center; }
  .win-btn:hover { background: #ffffffa6; }
  .win-btn.close:hover { background: #b4232c; color: #fff; }
  .pages { flex: 1; min-height: 0; position: relative; }
  .page { position: absolute; inset: 0; display: none; flex-direction: column; padding: 24px 56px 28px; overflow: auto; }
  .page.active { display: flex; }
  .page.enter { animation: pageIn .2s var(--ease-out); }
  @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
  .btn { min-height: 44px; flex-shrink: 0; padding: 0 26px; border-radius: 999px; font: 600 14px/1.3 var(--font); border: 1px solid transparent; cursor: pointer; transition: background .12s, border-color .12s; }
  .btn:focus-visible, .link:focus-visible, .checkbox:focus-visible, .win-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--brand-strong); }
  .btn:active:not(:disabled) { transition: none; }
  .btn-primary:active:not(:disabled) { background: #334155; box-shadow: inset 0 1px 2px #0003; }
  .btn-ghost:active:not(:disabled), .btn-text:active:not(:disabled) { background: #e7ecf2; border-color: #9aa8b8; }
  #btnLaunch:disabled { background: #dce2e9; color: #525c71; cursor: progress; transition: none; }
  .btn-primary:disabled { background: #e1e6ec; color: #667184; cursor: not-allowed; }
  .btn-ghost, .btn-text { background: #ffffffc9; border-color: var(--border); color: var(--text-2); }
  .btn-ghost:hover, .btn-text:hover { background: #fff; border-color: #aebac8; color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #8f1c24; }
  .footer { flex: none; margin-top: auto; display: flex; align-items: center; gap: 12px; padding-top: 20px; }
  .brand-row { display: flex; align-items: center; flex: none; }
  .brand-row img { height: 26px; display: block; }
  .hero-title { font: 600 32px/1.3 var(--serif); letter-spacing: .02em; text-align: center; }
  .hero-tag { margin-top: 12px; font-size: 14px; line-height: 1.5; color: var(--text-2); text-align: center; }
  .hero-tag[role="alert"] { color: var(--danger); }
  .options { margin-top: 32px; display: flex; flex-direction: column; }
  .opt-row { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-top: 1px solid var(--border); }
  .opt-row:last-child { border-bottom: 1px solid var(--border); }
  .opt-icon { width: 24px; height: 28px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--text-2); }
  .opt-body { flex: 1; min-width: 0; }
  .opt-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .opt-desc { font-size: 14px; line-height: 1.5; color: var(--text-2); margin-top: 4px; }
  .opt-path { display: block; margin-top: 8px; font: 14px/1.5 var(--font); color: var(--text); max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; user-select: text; }
  .link { background: none; border: 0; padding: 4px 0; color: var(--text); font: 500 14px/1.5 var(--font); cursor: pointer; border-radius: 4px; flex-shrink: 0; text-underline-offset: 3px; }
  .link:hover { text-decoration: underline; }
  .license-row { margin-top: 18px; display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 1.5; color: var(--text-2); }
  .checkbox { width: 18px; height: 18px; border-radius: 4px; border: 1px solid #8c9aab; background: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .checkbox svg { opacity: 0; }
  .checkbox.on { background: var(--brand); border-color: var(--brand); }
  .checkbox.on svg { opacity: 1; }
  .switch { position: relative; width: 40px; height: 24px; flex: none; cursor: pointer; display: inline-block; }
  .switch input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; margin: 0; cursor: pointer; appearance: none; -webkit-appearance: none; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px; background: #cbd3dc; pointer-events: none; }
  .switch .thumb { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; pointer-events: none; transition: transform .12s; }
  .switch input:checked ~ .track { background: var(--brand); }
  .switch input:checked ~ .thumb { transform: translateX(16px); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--text); outline-offset: 3px; }
  .page-progress, .page-complete { align-items: center; justify-content: center; text-align: center; }
  .loader { position: relative; width: 64px; height: 64px; margin-bottom: 28px; }
  .loader img.mark { display: none; }
  .loader .ring { position: absolute; inset: 4px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--text); animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .progress-title, .complete-title, .uninstall-title { font: 600 28px/1.4 var(--serif); }
  .phase { font-size: 14px; line-height: 1.5; color: var(--text-2); margin-top: 10px; min-height: 21px; transition: opacity .12s; }
  .phase.swap { opacity: 0; }
  .track-wrap { width: min(420px, 100%); margin-top: 28px; }
  .track-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; line-height: 1.5; color: var(--text-2); margin-bottom: 10px; font-variant-numeric: tabular-nums; text-align: left; }
  #phaseName { display: none; }
  #percent { margin-left: auto; }
  .prog-track { height: 6px; border-radius: 999px; background: #e0e6ed; overflow: hidden; }
  .fill { height: 100%; width: 0%; border-radius: 999px; background: var(--brand); transition: width .5s var(--ease-out); }
  .tips { margin-top: 28px; font-size: 14px; line-height: 1.5; color: var(--text-2); min-height: 42px; position: relative; width: 100%; }
  .tip { position: absolute; inset: 0; opacity: 0; transition: opacity .2s; }
  .tip.show { opacity: 1; }
  .check { width: 64px; height: 64px; margin-bottom: 24px; flex-shrink: 0; }
  .check .circle { fill: var(--brand); }
  .check .tick { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .complete-sub { font-size: 14px; line-height: 1.6; color: var(--text-2); margin-top: 10px; max-width: 100%; overflow-wrap: anywhere; }
  .page-uninstall { justify-content: center; }
  .uninstall-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--danger-soft); color: var(--danger); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; flex-shrink: 0; }
  .uninstall-desc { font-size: 14px; color: var(--text-2); margin-top: 12px; max-width: 560px; line-height: 1.7; }
  .uninstall-desc code { background: var(--tint); padding: 1px 6px; border-radius: 4px; font-size: 14px; }
  .error-message { font-size: 14px; line-height: 1.6; color: var(--danger); margin-top: 16px; overflow-wrap: anywhere; }
  .error-message:empty { display: none; }
  .error-detail { margin-top: 16px; max-height: 180px; overflow: auto; white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: var(--text-2); }
  .page-error { padding-top: 48px; }
  dialog { margin: auto; padding: 24px; border: 1px solid var(--border); border-radius: var(--radius); width: min(720px, 90vw); color: var(--text); background: var(--surface); }
  dialog::backdrop { background: #18233540; }
  dialog h2 { font-size: 18px; font-weight: 600; }
  dialog pre { margin: 16px 0; max-height: 55vh; overflow: auto; white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
  dialog form { display: flex; justify-content: end; }
  .demo-bar { position: fixed; right: 18px; bottom: 16px; display: flex; gap: 6px; align-items: center; background: #182335; padding: 8px 10px; border-radius: 10px; font: 12px var(--font); color: #fff; }
  .demo-bar .label { margin-right: 2px; }
  .demo-bar button { background: #ffffff22; color: #fff; border: 0; padding: 5px 10px; border-radius: 6px; cursor: pointer; font: 12px var(--font); }
  .demo-bar button:hover { background: #ffffff44; }
  body.shell .demo-bar { display: none; }
  body.shell .window { width: 100%; height: 100%; border-radius: 0; box-shadow: none; }
  @media (max-width: 700px) { .page { padding-left: 28px; padding-right: 28px; } .opt-row { flex-wrap: wrap; } .opt-path { flex: 1; max-width: 100%; } }
  @media (max-height: 480px) { .page-progress, .page-complete, .page-uninstall { justify-content: flex-start; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (forced-colors: active) { .window { background: Canvas; } .btn, .checkbox, .switch .track { border: 1px solid ButtonText; } .btn-primary, .checkbox.on, .switch input:checked ~ .track, .fill { background: Highlight; color: HighlightText; forced-color-adjust: none; } .btn-primary:disabled { background: Canvas; color: GrayText; border-color: GrayText; } .check .circle { fill: CanvasText; } .check .tick { stroke: Canvas; } }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <div class="brand-row"><img id="wordmarkImg" data-asset="wordmark" alt="知远"></div>
    <span class="app-title" data-i18n="winTitle"></span>
    <span class="spacer"></span>
    <button class="win-btn close" aria-label="关闭" title="关闭">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="pages">

    <!-- ============ hero ============ -->
    <section class="page active" id="page-hero">
      <h1 class="hero-title" data-i18n="product"></h1>
      <div class="hero-tag" id="heroStatus" data-i18n="tagline" role="status"></div>

      <div class="options">
        <div class="opt-row">
          <div class="opt-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </div>
          <div class="opt-body">
            <div class="opt-title" data-i18n="installLocation"></div>
            <div class="opt-desc" data-i18n="locationHint"></div>
            <span class="opt-path" id="installPath">C:\Users\Admin\AppData\Local\Programs\ZhiYuan Agent</span>
          </div>
          <button class="link" id="btnBrowse" data-i18n="browse"></button>
        </div>

        <div class="opt-row">
          <div class="opt-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg>
          </div>
          <div class="opt-body">
            <div class="opt-title" data-i18n="localInference"></div>
            <div class="opt-desc" data-i18n="localInferenceHint"></div>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggleInference">
            <span class="track"></span><span class="thumb"></span>

        </div>
      </div>

      <div class="license-row">
        <span class="checkbox" id="licenseCheck" role="checkbox" aria-checked="false" tabindex="0">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 5.2 4 7.5 8.5 2.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span><span data-i18n="licenseAgree"></span> <button class="link" id="btnLicense" data-i18n="licenseLink"></button></span>

      <div class="footer">
        <button class="btn btn-text" id="btnCancelHero" data-i18n="cancel"></button>
        <span class="spacer"></span>
        <button class="btn btn-primary" id="btnInstall" disabled data-i18n="install"></button>
      </div>
    </section>

    <!-- ============ progress ============ -->
    <section class="page page-progress" id="page-progress">
      <div class="loader">
        <img class="mark" id="loaderMark" data-asset="appicon" alt="">
        <div class="ring"></div>
      </div>
      <div class="progress-title" id="progressTitle" data-i18n="installingTitle"></div>
      <div class="phase" id="phaseLabel"></div>
      <div class="track-wrap">
        <div class="track-meta"><span id="phaseName"></span><span id="percent">0%</span></div>
        <div class="prog-track"><div class="fill" id="fill"></div></div>
      </div>
      <div class="tips" id="tips"></div>
      <div style="margin-top:28px;">
        <button class="btn btn-text" id="btnCancelProgress" data-i18n="cancel" style="display:none;"></button>
      </div>
    </section>

    <!-- ============ complete ============ -->
    <section class="page page-complete" id="page-complete">
      <svg class="check" viewBox="0 0 84 84">
        <circle class="circle" cx="42" cy="42" r="42"/>
        <path class="tick" d="M26 43.5 37 54l21-24"/>
      </svg>
      <div class="complete-title" id="completeTitle" data-i18n="completeTitle"></div>
      <div class="complete-sub" id="completeSub"></div>
      <div class="footer" style="justify-content:center; margin-top:36px; padding-top:0;">
        <button class="btn btn-ghost" id="btnDone" data-i18n="done"></button>
        <button class="btn btn-primary" id="btnLaunch" data-i18n="launch"></button>
      </div>
    </section>

    <!-- ============ uninstall ============ -->
    <section class="page page-uninstall" id="page-uninstall">
      <div class="uninstall-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </div>
      <div class="uninstall-title" data-i18n="uninstallTitle"></div>
      <div class="uninstall-desc" data-i18n="uninstallDesc"></div>
      <div class="footer">
        <button class="btn btn-text" id="btnCancelUninstall" data-i18n="cancel"></button>
        <span class="spacer"></span>
        <button class="btn btn-danger" id="btnConfirmUninstall" data-i18n="uninstall"></button>
      </div>
    </section>

  </div>
</div>

<dialog id="licenseDialog" aria-labelledby="licenseTitle">
  <h2 id="licenseTitle" data-i18n="licenseLink"></h2>
  <pre id="licenseText"></pre>
  <form method="dialog"><button class="btn btn-primary" data-i18n="done"></button></form>
</dialog>

<div class="demo-bar">
  <span class="label">原型演示</span>
  <button data-goto="hero">首页</button>
  <button id="demoReplay">进度</button>
  <button data-goto="complete">完成</button>
  <button data-goto="uninstall">卸载</button>
</div>

<script>
const I18N = {
  zh: {
    winTitle: '安装程序',
    product: '开始你的 AI 工作台',
    tagline: '选择安装位置与所需组件。',
    installLocation: '安装位置',
    locationHint: '应用与运行组件将安装到此目录',
    browse: '更改…',
    localInference: '安装本地推理组件',
    localInferenceHint: '开启后首次启动时会下载 CPU 或 NVIDIA CUDA 后端（16–621 MB），不勾选不影响其他功能',
    licenseAgree: '我已阅读并同意',
    licenseLink: '《许可协议》',
    licenseUnavailable: '许可协议暂时无法读取，请关闭后重新运行完整安装包。',
    cancel: '取消',
    install: '安装',
    installingTitle: '正在安装',
    completeTitle: '安装完成',
    completeSubLocal: '本地推理组件将在首次启动时按你的硬件自动准备',
    completeSub: '知远智能体已就绪，开始你的第一个任务吧',
    done: '完成',
    launch: '启动知远智能体',
    uninstallTitle: '确定要卸载知远智能体吗？',
    uninstallDesc: '将移除应用程序和可重新下载的运行环境。你的会话、设置和个人文件会保留。',
    uninstall: '卸载',
    uninstallingTitle: '正在卸载知远智能体',
    uninstalledTitle: '已卸载知远智能体',
    uninstalledSub: '应用程序已移除。你的会话、设置和个人文件已保留。',
    phases: [
      '正在校验离线组件', '正在展开频道运行环境', '正在展开内置 Skills 与 MCPs',
      '正在展开 Python 运行环境', '正在展开 Skill 依赖层', '正在激活离线组件',
      '正在连接本地运行环境', '正在安装 VC++ 运行时', '正在清理旧版本'
    ],
    tips: [
      '提示：在线模型、联网工具与首次下载本地推理组件需要联网',
      '提示：Skills 让知远学会新能力，安装后可在设置中继续添加',
      '提示：本地推理组件可按需启用，不占用安装时间',
      '提示：微信、飞书、钉钉消息渠道可在安装后随时接入'
    ]
  },
  en: {
    winTitle: 'Setup',
    product: 'Set up your AI workspace',
    tagline: 'Choose an install location and the components you need.',
    installLocation: 'Install location',
    locationHint: 'The app and runtime components go here',
    browse: 'Change…',
    localInference: 'Install local inference components',
    localInferenceHint: 'Downloads the CPU or NVIDIA CUDA backend on first launch (16–621 MB). Optional.',
    licenseAgree: 'I have read and agree to the',
    licenseLink: 'License Agreement',
    licenseUnavailable: 'The license could not be read. Close setup and run the complete installer again.',
    cancel: 'Cancel',
    install: 'Install',
    installingTitle: 'Installing',
    completeTitle: 'Installation complete',
    completeSubLocal: 'Local inference components will be prepared on first launch',
    completeSub: 'ZhiYuan Agent is ready for your first task',
    done: 'Finish',
    launch: 'Launch ZhiYuan Agent',
    uninstallTitle: 'Uninstall ZhiYuan Agent?',
    uninstallDesc: 'This removes the app and its downloadable runtime. Your sessions, settings and personal files are kept.',
    uninstall: 'Uninstall',
    uninstallingTitle: 'Uninstalling ZhiYuan Agent',
    uninstalledTitle: 'ZhiYuan Agent uninstalled',
    uninstalledSub: 'The app has been removed. Your sessions, settings and personal files are kept.',
    phases: [
      'Validating offline components', 'Expanding channel runtime', 'Expanding bundled Skills and MCPs',
      'Expanding Python runtime', 'Expanding Skill dependency layer', 'Activating offline components',
      'Linking local runtimes', 'Installing VC++ runtime', 'Cleaning up previous version'
    ],
    tips: [
      'Tip: Online models, connected tools and initial inference downloads require internet access',
      'Tip: Skills teach ZhiYuan new abilities — add more in Settings',
      'Tip: Local inference is optional and installs on demand',
      'Tip: Connect WeChat, Feishu or DingTalk anytime after install'
    ]
  }
};
// Keep the Chinese default, but honor the explicit language passed by the host.
const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh';
const t = k => I18N[lang][k];

/* deep links for design review: ?page=hero|progress|complete|uninstall&freeze=0.5 */
const params = new URLSearchParams(location.search);
const uninstallMode = params.get('page') === 'uninstall';
const initialPage = params.get('page');

function applyI18n() {
  document.getElementById('licenseCheck').setAttribute('aria-label', t('licenseAgree') + ' ' + t('licenseLink'));
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  if (uninstallMode) {
    document.querySelector('.app-title').textContent =
      lang === 'zh' ? '卸载程序' : 'Uninstaller';
  }
}

/* ---------- page router ---------- */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active', 'enter'));
  const page = document.getElementById('page-' + id);
  page.classList.add('active');
  void page.offsetWidth;
  page.classList.add('enter');
}

/* ---------- hero ---------- */
// Keep the complete path available to assistive technology and native tooltips
// while the visual row uses a single line. The engine still reads textContent.
function setInstallPath(value) {
  const path = document.getElementById('installPath');
  path.textContent = value;
  path.title = value;
  path.setAttribute('aria-label', value);
}
setInstallPath(document.getElementById('installPath').textContent);
const licenseCheck = document.getElementById('licenseCheck');
const btnInstall = document.getElementById('btnInstall');
let startAdmission = Promise.resolve();
function startShellOperation(start) {
  // The host returns after admitting the operation, not after installation.
  const admission = (async () => await Promise.resolve(start()))();
  startAdmission = admission;
  admission.catch(error => {
    if (admission === startAdmission) handleEngineEvent({ type: 'error', message: String(error) });
  });
}
function toggleLicense() {
  const on = licenseCheck.classList.toggle('on');
  licenseCheck.setAttribute('aria-checked', on);
  btnInstall.disabled = !on;
}
licenseCheck.addEventListener('click', toggleLicense);
licenseCheck.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleLicense(); } });
document.getElementById('btnBrowse').addEventListener('click', () => {
  const installPath = document.getElementById('installPath');
  if (inShell) {
    // Real folder picker hosted by the shell; the confirmed path is what
    // StartInstall receives on Install click.
    window.chrome.webview.hostObjects.shell.BrowseInstallDir(installPath.textContent).then(dir => {
      if (dir) setInstallPath(dir);
    });
    return;
  }
  const path = prompt(lang === 'zh' ? '安装目录' : 'Install directory', installPath.textContent);
  if (path) setInstallPath(path);
});
document.getElementById('toggleInference').addEventListener('change', e => {
  inferenceOn = e.target.checked;
});
let inferenceOn = false;
btnInstall.addEventListener('click', () => {
  if (btnInstall.disabled) return;
  btnInstall.disabled = true;
  showPage('progress');
  if (inShell) {
    resetProgressView();
    startShellOperation(() => window.chrome.webview.hostObjects.shell.StartInstall(
      document.getElementById('installPath').textContent, inferenceOn));
  } else {
    runInstall();
  }
});

/* ---------- real engine events (shell mode) ---------- */
const fill = document.getElementById('fill');
const percent = document.getElementById('percent');
const phaseLabel = document.getElementById('phaseLabel');
const phaseName = document.getElementById('phaseName');
const tipsBox = document.getElementById('tips');
let simToken = 0;

function resetProgressView() {
  fill.style.transition = 'none';
  fill.style.width = '0%';
  percent.textContent = '0%';
  phaseLabel.textContent = '';
  phaseName.textContent = '';
}

function handleEngineEvent(evt) {
  if (evt.type === 'phase') {
    phaseLabel.classList.add('swap');
    setTimeout(() => {
      phaseLabel.textContent = (evt.label || '') + '…';
      phaseName.textContent = evt.label || '';
      phaseLabel.classList.remove('swap');
    }, 120);
  } else if (evt.type === 'progress') {
    const pct = Math.max(0, Math.min(100, evt.percent || 0));
    fill.style.transition = '';
    fill.style.width = pct + '%';
    percent.textContent = pct + '%';
  } else if (evt.type === 'done') {
    percent.textContent = '100%';
    fill.style.width = '100%';
    if (uninstallMode) {
      document.getElementById('completeTitle').textContent = t('uninstalledTitle');
      document.getElementById('completeSub').textContent = t('uninstalledSub');
      document.getElementById('btnLaunch').style.display = 'none';
    } else {
      document.getElementById('completeSub').textContent = evt.installDir || '';
    }
    setTimeout(() => showPage('complete'), 400);
  } else if (evt.type === 'error') {
    showPage(uninstallMode ? 'uninstall' : 'hero');
    btnInstall.disabled = licenseCheck.getAttribute('aria-checked') !== 'true';
    const status = document.getElementById('heroStatus');
    status.setAttribute('role', 'alert');
    status.textContent = evt.message || (lang === 'zh' ? '安装失败，请重试。' : 'Installation failed. Please retry.');
  } else if (evt.type === 'launch-error') {
    document.getElementById('completeSub').textContent = evt.message || (lang === 'zh' ? '启动失败，请重试。' : 'Launch failed. Please retry.');
    document.getElementById('btnLaunch').disabled = false;
  }

}

function buildTips() {
  tipsBox.innerHTML = '';
  t('tips').forEach((text, i) => {
    const div = document.createElement('div');
    div.className = 'tip' + (i === 0 ? ' show' : '');
    div.textContent = text;
    tipsBox.appendChild(div);
  });
}

function runInstall() {
  const token = ++simToken;
  buildTips();
  const weights = [8, 14, 12, 18, 16, 10, 10, 5, 7];
  const phases = t('phases');
  const total = weights.reduce((a, b) => a + b, 0);
  let acc = 0;
  const schedule = phases.map((label, i) => {
    const start = acc / total;
    acc += weights[i];
    return { label, start, end: acc / total };
  });
  fill.style.transition = 'none';
  fill.style.width = '0%';
  percent.textContent = '0%';
  let tipIdx = 0;

  const started = performance.now();
  const DURATION = 19000;
  let phaseIdx = -1;
  const tipsTimer = setInterval(() => {
    if (token !== simToken) { clearInterval(tipsTimer); return; }
    const tips = tipsBox.children;
    tips[tipIdx % tips.length].classList.remove('show');
    tipIdx++;
    tips[tipIdx % tips.length].classList.add('show');
  }, 4200);

  function frame(now) {
    if (token !== simToken) { clearInterval(tipsTimer); return; }
    const raw = Math.min((now - started) / DURATION, 1);
    // ease overall progression slightly so the bar breathes rather than ticks
    const eased = raw < 1 ? 1 - Math.pow(1 - raw, 1.35) : 1;
    const pct = Math.round(eased * 100);
    fill.style.transition = '';
    fill.style.width = pct + '%';
    percent.textContent = pct + '%';
    const idx = schedule.findIndex(s => eased < s.end);
    const cur = idx === -1 ? schedule.length - 1 : idx;
    if (cur !== phaseIdx) {
      phaseIdx = cur;
      phaseLabel.classList.add('swap');
      setTimeout(() => {
        if (token !== simToken) return;
        phaseLabel.textContent = schedule[cur].label + '…';
        phaseName.textContent = schedule[cur].label;
        phaseLabel.classList.remove('swap');
      }, 180);
    }
    if (raw < 1) requestAnimationFrame(frame);
    else {
      clearInterval(tipsTimer);
      document.getElementById('completeSub').textContent = inferenceOn ? t('completeSubLocal') : t('completeSub');
      setTimeout(() => { if (token === simToken) showPage('complete'); }, 500);
    }
  }
  requestAnimationFrame(frame);
}

document.getElementById('demoReplay').addEventListener('click', () => { showPage('progress'); runInstall(); });
document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', () => { simToken++; showPage(b.dataset.goto); }));
async function requestShellClose() {
  try {
    await Promise.resolve(window.chrome.webview.hostObjects.shell.RequestClose());
  } catch (error) {
    console.error('[Setup] Close request failed:', error);
    const completed = document.getElementById('page-complete').classList.contains('active');
    if (completed) handleEngineEvent({ type: 'launch-error', message: String(error) });
  }
}
document.getElementById('btnDone').addEventListener('click', () => {
  simToken++;
  if (inShell) { requestShellClose(); return; }
  showPage('hero');
});
document.getElementById('btnLaunch').addEventListener('click', () => {
  if (inShell) {
    const button = document.getElementById('btnLaunch');
    button.disabled = true;
    Promise.resolve(window.chrome.webview.hostObjects.shell.LaunchApp()).then(started => {
      if (started) requestShellClose();
      else button.disabled = false;
    }).catch(() => { button.disabled = false; });
    return;
  }
  alert(lang === 'zh' ? '将启动 知远智能体' : 'Launching ZhiYuan Agent');
});
document.getElementById('btnCancelHero').addEventListener('click', () => {
  if (inShell) { requestShellClose(); return; }
  showPage('hero');
});
document.getElementById('btnCancelUninstall').addEventListener('click', () => {
  if (inShell) { requestShellClose(); return; }
  showPage('hero');
});
document.getElementById('btnConfirmUninstall').addEventListener('click', () => {
  showPage('progress');
  document.getElementById('progressTitle').textContent = t('uninstallingTitle');
  resetProgressView();
  if (inShell) { startShellOperation(() => window.chrome.webview.hostObjects.shell.StartUninstall()); }
});

document.getElementById('btnLicense').addEventListener('click', async () => {
  const dialog = document.getElementById('licenseDialog');
  const text = document.getElementById('licenseText');
  try {
    if (inShell) {
      text.textContent = await window.chrome.webview.hostObjects.shell.GetLicenseText();
    } else {
      const response = await fetch('../../../LICENSE');
      if (!response.ok) throw new Error('License unavailable');
      text.textContent = await response.text();
    }
  } catch { text.textContent = t('licenseUnavailable'); }
  if (!dialog.open) dialog.showModal();
});

applyI18n();

/* deep links are parsed at the top (uninstallMode feeds applyI18n); this
   block only acts on them. */
if (initialPage === 'progress') {
  showPage('progress');
  const freeze = parseFloat(params.get('freeze') || 'NaN');
  if (!Number.isNaN(freeze)) {
    buildTips();
    const phases = t('phases');
    const idx = Math.min(phases.length - 1, Math.floor(freeze * phases.length));
    const pct = Math.round(freeze * 100) + '%';
    fill.style.width = pct;
    percent.textContent = pct;
    phaseLabel.textContent = phases[idx] + '…';
    phaseName.textContent = phases[idx];
  } else {
    runInstall();
  }
} else if (initialPage) {
  showPage(initialPage);
}
if (params.has('debug')) {
  window.addEventListener('load', () => {
    const sw = document.querySelector('.switch');
    const parts = {};
    [sw, sw.querySelector('input'), sw.querySelector('.track'), sw.querySelector('.thumb')].forEach((el, i) => {
      const r = el.getBoundingClientRect();
      parts[['switch', 'input', 'track', 'thumb'][i]] = [r.x, r.y, r.width, r.height].map(v => Math.round(v * 10) / 10);
    });
    const pre = document.createElement('pre');
    pre.id = 'debug-rects';
    pre.textContent = JSON.stringify(parts);
    document.body.appendChild(pre);
  });
}

/* WebView2 shell integration: close + titlebar drag are delegated to the host window */
const inShell = !!(window.chrome && window.chrome.webview);
/* Asset roots differ: browser preview resolves repo paths, the packaged shell
   ships copies next to index.html. */
const assetRoots = inShell
  ? { wordmark: 'assets/zhiyuan-logo-light-1600.png', appicon: 'assets/256x256.png' }
  : { wordmark: '../../../public/zhiyuan-logo-light-1600.png', appicon: '../../../build/icons/png/256x256.png' };
document.querySelectorAll('img[data-asset]').forEach(img => {
  img.src = assetRoots[img.dataset.asset];
});
if (inShell) {
  document.body.classList.add('shell');
  document.querySelector('.win-btn.close').addEventListener('click', () => {
    requestShellClose();
  });
  document.querySelector('.titlebar').addEventListener('pointerdown', e => {
    if (e.button === 0 && !e.target.closest('.win-btn')) {
      window.chrome.webview.postMessage({ type: 'drag' });
    }
  });
  // Real engine drives the progress page: default path from the host, engine
  // events replace the simulator, and a lightweight Cancel is available.
  const shell = window.chrome.webview.hostObjects.shell;
  shell.GetDefaultInstallDir().then(dir => {
    setInstallPath(dir);
  });
  const cancelProgress = document.getElementById('btnCancelProgress');
  cancelProgress.style.display = '';
  cancelProgress.addEventListener('click', async () => {
    const admission = startAdmission;
    try {
      await admission;
      if (admission !== startAdmission) return; // A pending Cancel belongs to its original attempt.
      await Promise.resolve(shell.CancelInstall());
    } catch (error) {
      console.error('[Setup] Cancel request failed:', error);
    }
  });
  window.chrome.webview.addEventListener('message', e => {
    try {
      const evt = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
      if (evt.type === 'install-started') { resetProgressView(); showPage('progress'); return; }
      if (evt.type === 'uninstall-started') {
        resetProgressView();
        document.getElementById('progressTitle').textContent = t('uninstallingTitle');
        showPage('progress');
        return;
      }
      handleEngineEvent(evt);
    } catch (err) {
      document.title = 'msg-err: ' + err;
    }
  });
}
</script>
</body>
