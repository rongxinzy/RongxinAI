<svg width="1120" height="820" viewBox="0 0 1120 820" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1120" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071013"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.85 0 0 0 0 0.62 0 0 0 0.22 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <style>
      .title{font:700 26px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#E5E7EB}
      .label{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#D1FAE5}
      .labelBlue{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#BAE6FD}
      .labelPurple{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#DDD6FE}
      .body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#A7F3D0}
      .bodyBlue{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#BFDBFE}
      .bodyMuted{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#9CA3AF}
      .pill{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#86EFAC}
    </style>
  </defs>

  <rect width="1120" height="820" rx="28" fill="url(#bg)"/>
  <text x="560" y="42" text-anchor="middle" class="title">RongxinAI Local AI Agent Workspace</text>
  <text x="560" y="70" text-anchor="middle" class="bodyMuted">OpenClaw runs Agent workflows, Ollama serves local models, Electron owns the desktop security boundary</text>

  <rect x="50" y="105" width="1020" height="285" rx="22" fill="#071A18" stroke="url(#green)" stroke-width="3" filter="url(#glow)"/>
  <text x="560" y="135" text-anchor="middle" class="label">Electron Main Process</text>

  <rect x="85" y="165" width="360" height="110" rx="16" fill="#0B1F1E" stroke="#34D399" stroke-width="3"/>
  <text x="115" y="205" class="label">OpenClaw Runtime</text>
  <text x="115" y="235" class="body">Cowork sessions, tools, approvals</text>
  <rect x="306" y="188" width="78" height="30" rx="8" fill="#052E1D" stroke="#22C55E"/>
  <text x="345" y="209" text-anchor="middle" class="pill">Primary</text>

  <rect x="470" y="165" width="260" height="110" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="3"/>
  <text x="500" y="205" class="labelBlue">Ollama Service</text>
  <text x="500" y="235" class="bodyBlue">Local models, launch options, marketplace</text>

  <rect x="755" y="165" width="280" height="110" rx="16" fill="#111827" stroke="#A78BFA" stroke-width="3"/>
  <text x="785" y="205" class="labelPurple">Skill / MCP Manager</text>
  <text x="785" y="235" class="bodyBlue">Built-in skills, ClawHub, external tools</text>

  <rect x="85" y="300" width="300" height="70" rx="14" fill="#10231F" stroke="#22C55E" stroke-width="2.5"/>
  <text x="115" y="329" class="label">SQLite Storage</text>
  <text x="115" y="354" class="body">Sessions, config, memory, tasks</text>

  <rect x="410" y="300" width="300" height="70" rx="14" fill="#1B172A" stroke="#F59E0B" stroke-width="2.5"/>
  <text x="440" y="329" class="labelPurple">Scheduled Tasks</text>
  <text x="440" y="354" class="bodyBlue">Cron, background triggers, delivery</text>

  <rect x="735" y="300" width="300" height="70" rx="14" fill="#171A22" stroke="#60A5FA" stroke-width="2.5"/>
  <text x="765" y="329" class="labelBlue">IM / Email Gateway</text>
  <text x="765" y="354" class="bodyBlue">WeChat, WeCom, DingTalk, Feishu, QQ, Email</text>

  <path d="M560 390V470" stroke="#6B7280" stroke-width="4"/>
  <rect x="405" y="470" width="310" height="86" rx="16" fill="#15191F" stroke="#6B7280" stroke-width="3"/>
  <text x="560" y="506" text-anchor="middle" class="title">Preload Script</text>
  <text x="560" y="535" text-anchor="middle" class="bodyMuted">contextBridge / IPC secure bridge</text>
  <path d="M560 556V635" stroke="#6B7280" stroke-width="4"/>

  <rect x="50" y="635" width="1020" height="145" rx="22" fill="#07111F" stroke="url(#blue)" stroke-width="3" filter="url(#glow)"/>
  <text x="560" y="666" text-anchor="middle" class="labelBlue">Renderer Process (React)</text>

  <rect x="85" y="695" width="220" height="60" rx="14" fill="#0D1726" stroke="#60A5FA" stroke-width="2.5"/>
  <text x="115" y="732" class="labelBlue">Redux State</text>

  <rect x="330" y="695" width="245" height="60" rx="14" fill="#0A1E24" stroke="#22D3EE" stroke-width="2.5"/>
  <text x="360" y="732" class="labelBlue">Cowork / Inference UI</text>

  <rect x="600" y="695" width="210" height="60" rx="14" fill="#1A1430" stroke="#A855F7" stroke-width="2.5"/>
  <text x="630" y="732" class="labelPurple">Artifacts Preview</text>

  <rect x="835" y="695" width="200" height="60" rx="14" fill="#111827" stroke="#34D399" stroke-width="2.5"/>
  <text x="865" y="732" class="label">Settings / Market</text>
</svg>
