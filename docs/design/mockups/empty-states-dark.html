<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><title>空态</title><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px; line-height: 1.45; color: #E2E8F0; background: #0C0F14; }
.app { max-width: 1120px; margin: 0 auto; padding: 10px 16px 28px; }
.row-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.row-bar h1 { font-size: 17px; font-weight: 600; flex: 1; }
.profile-line { padding: 10px 12px; margin-bottom: 8px; background: #151922; border: 1px solid #252A35; border-radius: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.profile-line a { font-size: 12px; color: #60A5FA; text-decoration: none; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
.tab { font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid #252A35; background: #151922; color: #94A3B8; }
.tab.on { background: #1E3A5F; color: #93C5FD; border-color: #2563EB; }
.section { font-size: 11px; font-weight: 600; color: #94A3B8; margin: 10px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.pick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.pick { background: #151922; border: 1px solid #252A35; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
.pick strong { display: block; font-size: 12px; margin-bottom: 4px; }
.pick .reason { color: #94A3B8; font-size: 11px; line-height: 1.35; min-height: 2.6em; }
.list { background: #151922; border: 1px solid #252A35; border-radius: 8px; overflow: hidden; }
.lrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #252A35; align-items: center; font-size: 12px; }
.lrow:last-child { border-bottom: none; }
.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
.b-ok { background: #14532D; color: #86EFAC; }
.b-mid { background: #713F12; color: #FDE047; }
.b-no { background: #7F1D1D; color: #FCA5A5; }
.b-agent { background: #312E81; color: #C7D2FE; }
.b-chat { background: #334155; color: #94A3B8; }
.btn { height: 30px; padding: 0 14px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid #252A35; background: #151922; color: inherit; }
.btn-main { background: #3B82F6; color: #fff; border: none; }
.panel { background: #151922; border: 1px solid #252A35; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
.hero h2 { font-size: 16px; margin-bottom: 8px; }
.hero .lead { margin-bottom: 8px; font-size: 13px; }
.hero .speed { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.hero .license { font-size: 11px; color: #94A3B8; }
details { border: 1px solid #252A35; border-radius: 8px; padding: 0 12px 10px; background: #151922; margin-bottom: 8px; font-size: 12px; }
summary { padding: 10px 0; cursor: pointer; color: #94A3B8; font-weight: 600; list-style: none; }
summary::-webkit-details-marker { display: none; }
table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
td, th { padding: 6px 8px; border-bottom: 1px solid #252A35; text-align: left; }
th { color: #94A3B8; font-weight: 500; }
.banner { padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.banner-info { background: #1E3A5F; border: 1px solid #2563EB; }
.banner-warn { background: #422006; border: 1px solid #CA8A04; }
.progress { height: 6px; background: #334155; border-radius: 3px; margin-top: 6px; }
.progress i { display: block; height: 100%; width: 62%; background: #2563EB; border-radius: 3px; }
.mock-label { position: fixed; top: 6px; right: 8px; font-size: 10px; color: #94A3B8; }
.empty { text-align: center; padding: 32px 16px; }
</style></head>
<body><span class="mock-label">rev3 · 深 · dual-4090-16g</span><div class="app">
<div class="row-bar"><h1>模型市场</h1></div>
<div class="banner banner-info"><span><strong>浏览版</strong> · 可以逛模型市场，下载和运行请从<strong>官网</strong>安装完整版。</span><button class="btn btn-main">打开官网下载</button></div>
<div class="panel empty"><h2 style="font-size:15px">暂时连不上模型目录，先用内置推荐。</h2><button class="btn btn-main" style="margin-top:12px">使用内置推荐</button><button class="btn" style="margin-left:6px">重试</button></div>
<div class="banner banner-warn"><span>当前 CUDA 安装包无法使用这块显卡，已改用 CPU 运行。建议从官网安装 <strong>CPU 版</strong>。</span><button class="btn">了解 CPU 版</button></div></div></body></html>
