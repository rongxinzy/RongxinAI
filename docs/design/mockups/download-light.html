<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><title>下载</title><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Inter, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px; line-height: 1.45; color: #0F172A; background: #EEEFF2; }
.app { max-width: 1120px; margin: 0 auto; padding: 10px 16px 28px; }
.row-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.row-bar h1 { font-size: 17px; font-weight: 600; flex: 1; }
.profile-line { padding: 10px 12px; margin-bottom: 8px; background: #FFFFFF; border: 1px solid #DDE1E8; border-radius: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.profile-line a { font-size: 12px; color: #2563EB; text-decoration: none; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
.tab { font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid #DDE1E8; background: #FFFFFF; color: #64748B; }
.tab.on { background: #EFF6FF; color: #1D4ED8; border-color: #93C5FD; }
.section { font-size: 11px; font-weight: 600; color: #64748B; margin: 10px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.pick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
.pick { background: #FFFFFF; border: 1px solid #DDE1E8; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
.pick strong { display: block; font-size: 12px; margin-bottom: 4px; }
.pick .reason { color: #64748B; font-size: 11px; line-height: 1.35; min-height: 2.6em; }
.list { background: #FFFFFF; border: 1px solid #DDE1E8; border-radius: 8px; overflow: hidden; }
.lrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #DDE1E8; align-items: center; font-size: 12px; }
.lrow:last-child { border-bottom: none; }
.badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; margin-right: 4px; }
.b-ok { background: #DCFCE7; color: #166534; }
.b-mid { background: #FEF9C3; color: #854D0E; }
.b-no { background: #FEE2E2; color: #B91C1C; }
.b-agent { background: #E0E7FF; color: #3730A3; }
.b-chat { background: #F1F5F9; color: #64748B; }
.btn { height: 30px; padding: 0 14px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid #DDE1E8; background: #FFFFFF; color: inherit; }
.btn-main { background: #2563EB; color: #fff; border: none; }
.panel { background: #FFFFFF; border: 1px solid #DDE1E8; border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
.hero h2 { font-size: 16px; margin-bottom: 8px; }
.hero .lead { margin-bottom: 8px; font-size: 13px; }
.hero .speed { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.hero .license { font-size: 11px; color: #64748B; }
details { border: 1px solid #DDE1E8; border-radius: 8px; padding: 0 12px 10px; background: #FFFFFF; margin-bottom: 8px; font-size: 12px; }
summary { padding: 10px 0; cursor: pointer; color: #64748B; font-weight: 600; list-style: none; }
summary::-webkit-details-marker { display: none; }
table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 6px; }
td, th { padding: 6px 8px; border-bottom: 1px solid #DDE1E8; text-align: left; }
th { color: #64748B; font-weight: 500; }
.banner { padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.banner-info { background: #EFF6FF; border: 1px solid #BFDBFE; }
.banner-warn { background: #FFFBEB; border: 1px solid #FDE68A; }
.progress { height: 6px; background: #E2E8F0; border-radius: 3px; margin-top: 6px; }
.progress i { display: block; height: 100%; width: 62%; background: #2563EB; border-radius: 3px; }
.mock-label { position: fixed; top: 6px; right: 8px; font-size: 10px; color: #64748B; }
.empty { text-align: center; padding: 32px 16px; }
</style></head>
<body><span class="mock-label">rev3 · 浅 · dual-4090-16g</span><div class="app">
<div class="row-bar"><h1>正在下载 Qwen3-8B</h1></div>
<div class="panel">
  <p>下载中…</p>
  <p style="font-size:11px;color:#64748B;margin-top:4px">已检查磁盘空间（需要约 5.5 GB）</p>
  <p style="margin-top:8px;font-size:12px">3.10 / 5.00 GB</p>
  <div class="progress"><i></i></div>
  <div style="margin-top:12px;display:flex;gap:6px"><button class="btn">暂停</button><button class="btn">取消</button><button class="btn">重试</button></div>
</div>
<div class="panel" style="opacity:0.85">
  <p><strong>下载完成（示意）</strong></p>
  <p style="font-size:12px;margin-top:6px">文件已校验，已加入本地模型库。</p>
  <button class="btn btn-main" style="margin-top:10px">设为助手默认模型</button>
  <button class="btn" style="margin-left:6px">稍后再说</button>
</div></div></body></html>
