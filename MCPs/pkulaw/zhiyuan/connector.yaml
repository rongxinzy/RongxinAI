id: pkulaw
icon: icon.png
presentation:
  name: "\u5317\u5927\u6cd5\u5b9d"
  authorization: oauth
  zh:
    description: "\u6cd5\u5f8b\u6cd5\u89c4\u3001\u6848\u4f8b\u548c\u53f8\u6cd5\u6570\u636e\u68c0\u7d22"
    examples:
      - "\u8bf7\u68c0\u7d22\u4e0e\u300c\u4e2a\u4eba\u4fe1\u606f\u4fdd\u62a4\u300d\u76f8\u5173\u7684\u6700\u65b0\u6cd5\u5f8b\u6cd5\u89c4\uff0c\u5e76\u603b\u7ed3\u4f01\u4e1a\u9700\u8981\u6ce8\u610f\u7684\u4e3b\u8981\u4e49\u52a1\u3002"
      - "\u8bf7\u67e5\u627e\u8fd1\u4e09\u5e74\u4e0e\u52b3\u52a8\u5408\u540c\u89e3\u9664\u6709\u5173\u7684\u5178\u578b\u6848\u4f8b\uff0c\u603b\u7ed3\u88c1\u5224\u8981\u70b9\u3002"
    connect:
      usage: { title: "\u5982\u4f55\u4f7f\u7528", description: "\u9700\u8981\u5317\u5927\u6cd5\u5b9d\u4f01\u4e1a\u8d26\u53f7\u6216\u5b98\u65b9\u6388\u6743\u540e\u624d\u80fd\u8c03\u7528\u6cd5\u5f8b\u6570\u636e\u3002" }
      data: { title: "\u6570\u636e\u4e0e\u6743\u9650", description: "\u8bbf\u95ee\u8303\u56f4\u53d7\u6cd5\u5b9d\u8d26\u53f7\u548c\u5546\u4e1a\u5408\u540c\u63a7\u5236\u3002" }
      control: { title: "\u4f60\u59cb\u7ec8\u53ef\u63a7", description: "\u53ef\u968f\u65f6\u79fb\u9664\u5f53\u524d\u5e94\u7528\u4e2d\u7684\u8fde\u63a5\u914d\u7f6e\u3002" }
      authorization: { title: "OAuth \u6388\u6743", description: "\u7cfb\u7edf\u6d4f\u89c8\u5668\u5c06\u6253\u5f00\u5317\u5927\u6cd5\u5b9d\u5b98\u65b9\u767b\u5f55\u548c OAuth \u6388\u6743\u9875\u9762\u3002" }
  en:
    description: Chinese laws, regulations, and judicial case search.
    examples:
      - Find the latest Chinese laws and regulations on personal information protection and summarize key business obligations.
      - Find representative labor-contract termination cases from the past three years and summarize the rulings.
    connect:
      usage: { title: How it works, description: An enterprise account or official authorization is required. }
      data: { title: Data and permissions, description: Access is governed by the account and commercial agreement. }
      control: { title: You stay in control, description: Remove this app's connection at any time. }
      authorization: { title: Browser authorization, description: The connector documents MCP OAuth 2.1 with PKCE and browser callback authorization. }
