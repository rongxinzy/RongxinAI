      - "\u8bf7\u67e5\u627e\u8fd1\u4e09\u5e74\u4e0e\u52b3\u52a8\u5408\u540c\u89e3\u9664\u6709\u5173\u7684\u5178\u578b\u6848\u4f8b\uff0c\u603b\u7ed3\u88c1\u5224\u8981\u70b9\u3002"
    connect:
      usage: { title: "如何使用", description: "需要北大法宝企业账号或官方授权后才能调用法律数据。" }
      data: { title: "数据与权限", description: "访问范围取决于账号权限和商业合同。工具调用所需内容会发送给服务方。" }
