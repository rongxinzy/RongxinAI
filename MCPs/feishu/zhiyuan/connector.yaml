id: feishu
icon: icon.png
presentation:
  name: Feishu
  authorization: cli
  zh:
    description: "\u98de\u4e66\u6587\u6863\u3001\u65e5\u5386\u3001\u6d88\u606f\u3001\u4e91\u76d8\u548c\u5ba1\u6279\u534f\u4f5c"
    examples:
      - "\u8bf7\u67e5\u8be2\u98de\u4e66\u65e5\u5386\u4e2d\u672c\u5468\u7684\u4f1a\u8bae\uff0c\u5e76\u6574\u7406\u6210\u65f6\u95f4\u8868\u548c\u51c6\u5907\u6e05\u5355\u3002"
      - "\u8bf7\u5728\u98de\u4e66\u4e91\u6587\u6863\u4e2d\u67e5\u627e\u6700\u65b0\u7684\u9879\u76ee\u5468\u62a5\uff0c\u603b\u7ed3\u672c\u5468\u8fdb\u5c55\u548c\u98ce\u9669\u3002"
    connect:
      usage: { title: "如何使用", description: "连接后，可在任务中使用 Feishu 工具。" }
      data: { title: "数据与权限", description: "可访问的数据和操作取决于服务授权范围。工具调用所需内容会发送给服务方。" }
      control: { title: "移除连接", description: "可在本应用中移除连接；授权管理请前往服务方设置。" }
