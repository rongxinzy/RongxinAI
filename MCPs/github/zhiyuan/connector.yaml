id: github
icon: icon.svg
presentation:
  name: GitHub
  authorization: token
  zh:
    description: "GitHub \u4ee3\u7801\u4ed3\u5e93\u3001Issue\u3001Pull Request \u548c\u5f00\u53d1\u5de5\u4f5c\u6d41"
    examples:
      - "\u8bf7\u67e5\u770b\u5f53\u524d GitHub \u4ed3\u5e93\u4e2d\u672a\u5173\u95ed\u7684 Issue\uff0c\u6309\u4f18\u5148\u7ea7\u6574\u7406\u6210\u5f85\u529e\u6e05\u5355\u3002"
      - "\u8bf7\u603b\u7ed3\u6700\u8fd1\u4e00\u5468 GitHub \u4e2d\u5df2\u5408\u5e76\u7684 Pull Request\uff0c\u8bf4\u660e\u4e3b\u8981\u53d8\u66f4\u548c\u5f85\u5173\u6ce8\u98ce\u9669\u3002"
    connect:
      usage: { title: "如何使用", description: "连接后，可在任务中使用 GitHub 工具。" }
      data: { title: "数据与权限", description: "可访问的数据和操作取决于服务授权范围。工具调用所需内容会发送给服务方。" }
