      - Review open GitHub issues in the current repository and organize them into a prioritized task list.
      - Summarize pull requests merged in the past week, including key changes and risks to watch.
    connect:
      usage: { title: "How it works", description: "Use GitHub tools in tasks after connecting." }
      data: { title: "Data and permissions", description: "Access depends on the service’s permissions. Content needed for tool calls is sent to the service." }
      control: { title: "Remove connection", description: "Remove the connection in this app. Manage the authorization in the service’s settings." }
      authorization: { title: "Authorization method", description: "Configure a GitHub personal access token in the app with only the repositories and permissions you need." }
