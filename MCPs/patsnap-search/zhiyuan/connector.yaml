id: patsnap-search
icon: icon.png
presentation:
  name: "\u667a\u6167\u82bd"
  authorization: token
  zh:
    description: "\u4e13\u5229\u3001\u6587\u732e\u548c\u79d1\u6280\u60c5\u62a5\u68c0\u7d22"
    examples:
      - "\u8bf7\u68c0\u7d22\u8fd1\u4e09\u5e74\u4e0e\u300c\u56fa\u6001\u7535\u6c60\u300d\u76f8\u5173\u7684\u4e13\u5229\uff0c\u603b\u7ed3\u4e3b\u8981\u6280\u672f\u8def\u7ebf\u548c\u91cd\u70b9\u7533\u8bf7\u4eba\u3002"
      - "\u8bf7\u67e5\u627e\u4e0e\u6211\u4eec\u7684\u76ee\u6807\u6280\u672f\u6700\u63a5\u8fd1\u7684\u4e13\u5229\uff0c\u5217\u51fa\u53ef\u80fd\u7684\u4fb5\u6743\u98ce\u9669\u3002"
    connect:
      usage: { title: "如何使用", description: "配置 API Token 后，智能体可按请求检索专利和文献。" }
      data: { title: "数据与权限", description: "访问范围取决于 API Token 权限。工具调用所需内容会发送给服务方。" }
      control: { title: "移除连接", description: "可在本应用中移除连接；授权管理请前往服务方设置。" }
      authorization: { title: "授权方式", description: "在应用中录入官方 API Token，不会打开浏览器 OAuth。" }
  en:
    description: Patsnap patent, literature, and technology intelligence search.
    examples:
      - Search patents on solid-state batteries from the past three years and summarize technology routes and leading applicants.
      - Find patents closest to our target technology and list potential infringement risks.
    connect:
      usage: { title: "How it works", description: "Configure an API token before the agent searches patents and literature." }
      data: { title: "Data and permissions", description: "Access depends on the API token’s permissions. Content needed for tool calls is sent to the service." }
      control: { title: "Remove connection", description: "Remove the connection in this app. Manage the authorization in the service’s settings." }
      authorization: { title: "Authorization method", description: "Enter the official API token in the app; browser OAuth is not used." }
