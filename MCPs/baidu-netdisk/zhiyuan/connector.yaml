      - "\u8bf7\u68c0\u67e5\u767e\u5ea6\u7f51\u76d8\u4e2d\u6211\u4eca\u65e5\u4e0a\u4f20\u7684\u6587\u4ef6\uff0c\u6309\u6587\u4ef6\u7c7b\u578b\u6574\u7406\u6210\u6e05\u5355\u3002"
  en:
    description: Baidu Netdisk file search, reading, and management.
    examples:
      - Search Baidu Netdisk for files containing project proposal and list the five most recently modified results.
