id: notion
icon: icon.png
presentation:
  name: Notion
  authorization: oauth
  zh:
    description: "\u5728\u7ebf\u534f\u4f5c\u4e0e\u77e5\u8bc6\u5e93\u7ba1\u7406\u5de5\u4f5c\u533a"
    examples:
      - "\u8bf7\u4f7f\u7528 Notion \u5e2e\u6211\u6574\u7406\u672c\u5468\u4f1a\u8bae\u7eaa\u8981\uff0c\u63d0\u70bc\u5f85\u529e\u4e8b\u9879\u5e76\u5199\u5165\u9879\u76ee\u5de5\u4f5c\u533a\u3002"
      - "\u8bf7\u5728 Notion \u4e2d\u67e5\u627e\u4e0e\u300c\u4ea7\u54c1\u53d1\u5e03\u300d\u76f8\u5173\u7684\u9875\u9762\uff0c\u603b\u7ed3\u5f53\u524d\u8fdb\u5ea6\u548c\u672a\u5b8c\u6210\u4e8b\u9879\u3002"
    connect:
      usage:
        title: "\u5982\u4f55\u4f7f\u7528"
        description: "\u4ec5\u5728\u4f60\u660e\u786e\u8bf7\u6c42\u65f6\uff0c\u667a\u80fd\u4f53\u624d\u4f1a\u8c03\u7528 Notion \u5de5\u5177\u3002"
      data:
        title: "\u6570\u636e\u4e0e\u6743\u9650"
        description: "\u4ec5\u8bbf\u95ee\u4f60\u5728\u6388\u6743\u9875\u9762\u660e\u786e\u5141\u8bb8\u7684\u5185\u5bb9\u548c\u64cd\u4f5c\u3002"
      control:
        title: "\u4f60\u59cb\u7ec8\u53ef\u63a7"
        description: "\u4f60\u53ef\u4ee5\u968f\u65f6\u65ad\u5f00 Notion \u8fde\u63a5\u6216\u91cd\u65b0\u6388\u6743\u3002"
      authorization:
        title: "\u5b89\u5168\u6388\u6743"
        description: "\u7cfb\u7edf\u6d4f\u89c8\u5668\u5c06\u6253\u5f00 Notion \u5b98\u65b9\u767b\u5f55\u4e0e\u6388\u6743\u9875\u9762\u3002"
  en:
    description: Online collaboration and knowledge management workspace.
    examples:
      - Use Notion to summarize this week's meeting notes, extract action items, and save them to the project workspace.
      - Find Notion pages related to the product launch and summarize progress and outstanding work.
    connect:
      usage: { title: How it works, description: The agent uses Notion tools only when you explicitly request it. }
      data: { title: Data and permissions, description: Only content and actions approved during authorization are accessed. }
      control: { title: You stay in control, description: You can disconnect or re-authorize Notion at any time. }
      authorization: { title: Secure authorization, description: Your system browser opens Notion's official sign-in and authorization page. }
