id: notion
icon: icon.png
presentation:
  name: Notion
  authorization: oauth
  zh:
    description: "\u5728\u7ebf\u534f\u4f5c\u4e0e\u77e5\u8bc6\u5e93\u7ba1\u7406\u5de5\u4f5c\u533a"
    examples:
      - "\u8bf7\u4f7f\u7528 Notion \u5e2e\u6211\u6574\u7406\u672c\u5468\u4f1a\u8bae\u7eaa\u8981\uff0c\u63d0\u70bc\u5f85\u529e\u4e8b\u9879\u5e76\u5199\u5165\u9879\u76ee\u5de5\u4f5c\u533a\u3002"
      - "\u8bf7\u5728 Notion \u4e2d\u67e5\u627e\u4e0e\u300c\u4ea7\u54c1\u53d1\u5e03\u300d\u76f8\u5173\u7684\u9875\u9762\uff0c\u603b\u7ed3\u5f53\u524d\u8fdb\u5ea6\u548c\u672a\u5b8c\u6210\u4e8b\u9879\u3002"
    connect:
      usage: { title: "如何使用", description: "连接后，可在任务中使用 Notion 工具。" }
      data: { title: "数据与权限", description: "可访问的数据和操作取决于服务授权范围。工具调用所需内容会发送给服务方。" }
      control: { title: "移除连接", description: "可在本应用中移除连接；授权管理请前往服务方设置。" }
      authorization: { title: "授权方式", description: "系统浏览器将打开 Notion 官方登录与授权页面。" }
  en:
    description: Online collaboration and knowledge management workspace.
    examples:
      - Use Notion to summarize this week's meeting notes, extract action items, and save them to the project workspace.
      - Find Notion pages related to the product launch and summarize progress and outstanding work.
    connect:
      usage: { title: "How it works", description: "Use Notion tools in tasks after connecting." }
      data: { title: "Data and permissions", description: "Access depends on the service’s permissions. Content needed for tool calls is sent to the service." }
      control: { title: "Remove connection", description: "Remove the connection in this app. Manage the authorization in the service’s settings." }
      authorization: { title: "Authorization method", description: "Your system browser opens Notion's official sign-in and authorization page." }
