# .gitlab-ci.yml — 对齐 .github/workflows/ci.yml
#
# Stage: lint → build → test
# 依赖：宿主机只读卷 /opt/ci-cache/node_modules，lint 校验，其余只拷贝
# 镜像：rongxinai-ci:latest（包含 Node 24 + Electron 依赖）

workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  image: rongxinai-ci:latest
  before_script:
    - cp -r /opt/ci-cache/node_modules node_modules 2>/dev/null || true

stages:
  - lint
  - build
  - test
  - build-platforms

variables:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

# ═══════════════════════════════════════════════════════
# Stage 1: Lint（仅变更的 TS/TSX 文件）
# ═══════════════════════════════════════════════════════
lint:
  stage: lint
  before_script:
    - cp -r /opt/ci-cache/node_modules node_modules 2>/dev/null || true
    - npm install --prefer-offline --no-audit --ignore-scripts
  variables:
    GIT_DEPTH: 0
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        FILES=$(git diff --name-only --diff-filter=ACMR $CI_MERGE_REQUEST_DIFF_BASE_SHA...HEAD -- '*.ts' '*.tsx')
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        FILES=$(git diff --name-only --diff-filter=ACMR $CI_COMMIT_BEFORE_SHA...HEAD -- '*.ts' '*.tsx')
      else
        FILES=$(git diff --name-only --diff-filter=ACMR HEAD~1 -- '*.ts' '*.tsx')
      fi
    - |
      if [ -n "$FILES" ]; then
        echo "Linting changed files:"
        echo "$FILES"
        echo "$FILES" | xargs npx eslint --report-unused-disable-directives --max-warnings 0
      else
        echo "No TypeScript files changed, skipping lint"
      fi
    - cp -r node_modules /opt/ci-cache/node_modules 2>/dev/null || true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release-1.0" || $CI_COMMIT_BRANCH == "dev"

# ═══════════════════════════════════════════════════════
# Stage 2: 构建
# ═══════════════════════════════════════════════════════

build-renderer:
  stage: build
  needs:
    - job: lint
      optional: true
  variables:
    NODE_OPTIONS: '--max-old-space-size=8192'
  script:
    - npm run build
    - test -f dist/index.html
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - changes:
        - src/renderer/**/*
        - vite.config.ts
        - tsconfig.json
        - tailwind.config.js
        - postcss.config.js
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release-1.0" || $CI_COMMIT_BRANCH == "dev"

build-main:
  stage: build
  needs:
    - job: lint
      optional: true
  script:
    - npx --no-install tsc --project electron-tsconfig.json
    - echo "tsc output:" && find dist-electron -name "main.js" -o -name "preload.js" 2>&1
    - test -n "$(find dist-electron -name "main.js" -o -name "preload.js")"
  artifacts:
    paths:
      - dist-electron/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - changes:
        - src/main/**/*
        - src/common/**/*
        - electron-tsconfig.json
        - src/main/preload.ts
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release-1.0" || $CI_COMMIT_BRANCH == "dev"

build-skills:
  stage: build
  script:
    - npm run build:skills
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - changes:
        - SKILLs/**/*
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release-1.0" || $CI_COMMIT_BRANCH == "dev"

# ═══════════════════════════════════════════════════════
# Stage 3: 测试
# ═══════════════════════════════════════════════════════
test:
  stage: test
  needs:
    - job: build-main
      optional: true
  script:
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release-1.0" || $CI_COMMIT_BRANCH == "dev"

# ═══════════════════════════════════════════════════════
# Stage 4: 平台打包（自托管 Runner）
# ═══════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════
# Windows 安装包构建（自托管 Runner，tags: windows）
#
# 触发条件：
#   - 推送 v* 格式的 tag（自动）
#   - 通过 Web UI 手动触发（Pipeline → Run pipeline → 手动点 ▶）
#
# 缓存策略：
#   - node_modules：按分支 + lockfile hash 缓存，减少重复安装
#   - OpenClaw 运行时：按 OpenClaw 版本号缓存，避免每次完整构建
#   - Python 运行时：按 Python 版本号缓存
# ═══════════════════════════════════════════════════════

build-windows:
  stage: build-platforms
  tags:
    - windows
  image: null
  before_script: []
  cache:
    - key: "win-npm-$CI_COMMIT_REF_SLUG"
      paths:
        - node_modules/
    - key: "win-python-3.11.9"
      paths:
        - resources/python-win/
  script:
    # 确保 pnpm 可用（OpenClaw 构建依赖 pnpm monorepo）
    - npm ci
    - npm install -g pnpm
    - $env:PATH = "$(npm prefix -g);$env:PATH"
    # 准备便携 Python 运行时（缓存命中时跳过下载）
    - npm run setup:python-runtime
    # 完整打包流程：OpenClaw 运行时 → 编译 → skills → electron-builder
    - npm run dist:win
    - |
      echo "Build output:"
      dir release\*.exe
  artifacts:
    paths:
      - release/*.exe
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
