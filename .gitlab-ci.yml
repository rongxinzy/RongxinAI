# .gitlab-ci.yml
# Stage: install → lint → build → test
# 策略：单独 install job 产出 node_modules artifact，消除缓存竞态

workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  image: rongxinai-ci:latest

stages:
  - .pre
  - lint
  - build
  - test

variables:
  NODE_OPTIONS: '--max-old-space-size=4096'

# ═══════════════════════════════════════════════════════
# Stage .pre: 安装依赖（一次产出，全 pipeline 复用）
# ═══════════════════════════════════════════════════════
install:
  stage: .pre
  script:
    - node --version
    - npm --version
    - npm install
  artifacts:
    paths:
      - node_modules/
    expire_in: 2 hours
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release-1.0" || $CI_COMMIT_BRANCH == "dev"

# ═══════════════════════════════════════════════════════
# Stage 1: Lint
# ═══════════════════════════════════════════════════════
lint:
  stage: lint
  needs: [install]
  variables:
    GIT_DEPTH: 0
  script:
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        FILES=$(git diff --name-only --diff-filter=ACMR $CI_MERGE_REQUEST_DIFF_BASE_SHA...HEAD -- '*.ts' '*.tsx')
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        FILES=$(git diff --name-only --diff-filter=ACMR $CI_COMMIT_BEFORE_SHA...HEAD -- '*.ts' '*.tsx')
      else
        FILES=""
      fi
    - |
      if [ -n "$FILES" ]; then
        echo "Linting changed files:"
        echo "$FILES"
        echo "$FILES" | xargs npx eslint --report-unused-disable-directives --max-warnings 0
      else
        echo "No TypeScript files changed, skipping lint"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release-1.0" || $CI_COMMIT_BRANCH == "dev"

# ═══════════════════════════════════════════════════════
# Stage 2: 构建
# ═══════════════════════════════════════════════════════

build-renderer:
  stage: build
  needs: [install]
  script:
    - npm run build
    - test -f dist/index.html
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release-1.0" || $CI_COMMIT_BRANCH == "dev"

build-main:
  stage: build
  needs: [install]
  script:
    - npm run compile:electron
    - test -f dist-electron/main.js
    - test -f dist-electron/preload.js
  artifacts:
    paths:
      - dist-electron/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release-1.0" || $CI_COMMIT_BRANCH == "dev"

build-skills:
  stage: build
  needs: [install]
  script:
    - npm run build:skills
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release-1.0" || $CI_COMMIT_BRANCH == "dev"

# ═══════════════════════════════════════════════════════
# Stage 3: 测试
# ═══════════════════════════════════════════════════════
test:
  stage: test
  needs:
    - install
    - job: build-main
      optional: true
  script:
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release-1.0" || $CI_COMMIT_BRANCH == "dev"
